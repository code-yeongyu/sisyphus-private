        from rich.panel import Panel
        from rich.console import Console
        from rich.table import Table
        import typer

        console = Console()

        def plan_overview(
            path: Path | None = typer.Option(None, "--path", "-p"),
            cwd: str | None = typer.Option(None, "--cwd"),
        ) -> None:
            # 1. Plan 로드
            if path:
                plan_doc = load_plan(path)
                work_plan = plan_doc.work_plans[0]
            else:
                # 현재 plan
                ...

            # 2. Basic Info
            console.print(Panel(f"[bold]{work_plan.name}[/bold]", title="Plan Overview"))

            # 3. User Request
            console.print("\n[bold cyan]User Request:[/bold cyan]")
            console.print(work_plan.user_request.original)

            # 4. Objectives
            console.print("\n[bold cyan]Objectives:[/bold cyan]")
            console.print(f"Core: {work_plan.objectives.core}")
            for obj in work_plan.objectives.detailed:
                console.print(f"  - {obj.goal}: {obj.measurable}")

            # 5. Background
            console.print("\n[bold cyan]Background:[/bold cyan]")
            console.print(f"Current: {work_plan.background.current_situation}")
            console.print(f"Reason: {work_plan.background.reason_for_change}")
            console.print(f"Changes: {work_plan.background.changes_to_make}")

            # 6. Success Vision
            console.print("\n[bold cyan]Success Vision:[/bold cyan]")
            for scenario in work_plan.success_vision.user_perspective:
                console.print(f"  - {scenario.scenario}: {scenario.experience}")

            # 7. Final Verification (상세)
            console.print("\n[bold cyan]Final Verification:[/bold cyan]")
            table = Table()
            table.add_column("ID")
            table.add_column("Title")
            table.add_column("Category")
            table.add_column("Verified")
            for fv in work_plan.final_verification:
                table.add_row(fv.id, fv.title, fv.category, str(fv.verified))
            console.print(table)

            # 8. Progress (status와 동일)
            total_todos = _count_all_todos(work_plan.todos)
            completed_todos = _count_completed_todos(work_plan.todos)
            console.print(f"\n[bold cyan]Progress:[/bold cyan]")
            console.print(f"Total Tasks: {total_todos}, Completed: {completed_todos}")
            # Progress bar...
        ```

