work_plans:
  - id: 'refactor-loop'
    name: 'ExecutionLoop 리팩토링 - 버그 수정 및 아키텍처 개선'
    depends_on: []

    user_request:
      original: |
        loop.py 는 너무 현재 복잡하고 버그도 많습니다. 이를 재작성하려고 합니다. 퍼블릭 메소드들의 시그니쳐와 스키마는 유지하되, 필요하다면 별도의 클래스도 만들어 DI 를 할 수 있게 한다거나, 하는식으로 말입니다. 현재 상황에 대한 분석은 @loop.md 에 있습니다.

        제가 원하는것은 다음과 같습니다.
        while True:
        - completed != False -> execute phase (completed True 는 sisyphus task continue 가 마킹해줌)
        - completed == True -> verify phase -> fully_done_at is not null and final_verification all verified and fully_done_evidence and acceptance_criteria_for_verification_agent 안의 로직들 전부 verified -> break

        그리고 현재 존재하는 에러처리들에 대한 내용들은 제가 다 대응해둔거니까 다 대응이 되어야 하고 ,
        execute phase resume 이 verify phase 로 전환이 한번도 없이 10번 연속으로 진행될 경우에 11번째에 verify phase 로 강제이동 해버려야합니다 (강제이동이라는게 completed true 로 마킹하라는것은 아닙니다- 그냥 강제로 넘기라는겁니다.)

        그리고 verify phase 에는 항상 <feedbackhistory></feedbackhistory>{verify phase prompt} 형태로 들어가야 합니다.

        그 외 resuming / session id save load 도 당연히 유지되어야 합니다. 버그로 명백히 판단되는것을 제외하고는 기능을 유지하되 nested / 과도히 방어적인 코드를 개선한다고 생각해주세요.

        그리고 다만 verify agent 는 항상 required 여야 하며 절대 optional 로 다뤄지면 안됩니다.

        작업계획서의 맨 위에는 loop.py.bak 을 생성하는게 있었으면 좋겠고, 이 작업계획서가 loop.py.bak 과 새로 작성된 loop.py 를 강박증처럼 비교하며 버그수정여부와 누락된 기능이없는지, 제가 명시하지않은 기능이 새로 생기진 않았는지를 verify 했으면 좋겠습니다.
      created_at: '2025-11-18T09:39:20.926501+00:00'
      additional:
        - |
          Expected Outcome: 완전 재작성 + 버그 수정 + 중요한 기능 유지 + 아키텍처 개선 + 테스트 정직하게 새로 작성(과도한 테스트 금지, 모킹 제거)
        - |
          Forbidden Outcomes: Verify Agent Optional 처리, 현재 존재하는 기능의 손실, 테스트 코드의 실패, 정직하지 못하게 작성된 테스트 코드, 모킹이 필요없는데 모킹된 테스트 코드
        - |
          Special Concerns: 기존 로직의 손실 및 요구하지 않은 추가기능의 생성, 필요 이상으로 defensive 한 코드 처리, 필요없는 폴백 및 방어처리
        - |
          Existing Code Handling: 재작성 + DI 까지
        - |
          ⚠️ ABSOLUTELY FORBIDDEN - uv tool install override:
          절대로 작업 중에 `uv tool install sisyphus-work` 명령을 실행하지 마세요.
          이 명령은 현재 작업 중인 sisyphus-work 패키지를 global tool로 override하여
          작업이 도중에 꼬이고 예상치 못한 버그가 발생합니다.
          개발 중에는 항상 `uv run sisyphus-speckit` 형태로 실행해야 합니다.
        - |
          ⚠️ ABSOLUTELY FORBIDDEN - sisyphus work execution in current directory:
          절대로 이 프로젝트 디렉토리(./) 내에서 `sisyphus work` 명령을 실행하지 마세요.
          sisyphus 프로젝트는 sisyphus-cli 자체를 개발하는 monorepo이므로,
          여기서 sisyphus work를 실행하면 자기 자신을 수정하려다 순환 참조와
          예측 불가능한 동작이 발생합니다.
          sisyphus work는 반드시 다른 프로젝트에서만 사용해야 합니다.

    objectives:
      core: |
        ExecutionLoop 클래스의 복잡도를 줄이고 버그를 수정하면서 모든 기존 기능을 완벽히 보존하는 리팩토링
      detailed:
        - goal: "버그 수정 및 로직 단순화"
          measurable: "loop.md에 명시된 버그 의심 포인트들이 모두 해결됨"
        - goal: "아키텍처 개선 (DI, 클래스 분리)"
          measurable: "복잡한 중첩 로직이 독립적인 클래스로 분리됨"
        - goal: "퍼블릭 API 시그니처 유지"
          measurable: "run(), request_interrupt(), clear_interrupt() 시그니처 변경 없음"
        - goal: "모든 테스트 통과"
          measurable: "기존 테스트 14개가 모두 통과함"

    background:
      current_situation: |
        현재 loop.py (952줄)는 다음과 같은 문제가 있음:

        1. 과도한 중첩 (nested if/else, try/except)
        2. 확인된 버그:
           - verify_agent=None 케이스 무한 루프 가능성 (line 475-477)
           - SDK 카운터 리셋 없음 (누적 문제)
        3. 16개 인스턴스 변수 관리의 복잡도
        4. _run_unified_mode() 메서드가 250줄 이상
        5. 과도한 방어적 코드 (불필요한 try/except)

        주요 기능:
        - Execute → Verify 2단계 피드백 루프
        - 세션 재개 (execute는 재개, verify는 항상 신규)
        - 에러 처리 (SessionLimitError, PromptTooLongError, SDK 오류)
        - 10회 연속 Execute 후 강제 Verify 전환
        - Verify feedback history 관리
        - 인터럽트/재개 메커니즘
        - Plan 상태 업데이트 (execution.completed, todo status)

      reason_for_change: |
        1. 유지보수 어려움: 중첩된 로직으로 버그 수정 시 사이드 이펙트 발생 위험
        2. 확인된 버그: verify_agent=None 무한 루프, SDK 카운터 누적
        3. 테스트 작성 어려움: 복잡한 상태 관리로 테스트 시나리오 커버리지 낮음
        4. 요구사항 변경: completed 기반 Verify 전환 로직 단순화 필요

      changes_to_make: |
        BEFORE (현재):
        - 하나의 ExecutionLoop 클래스가 모든 책임 담당
        - 중첩된 조건문과 예외 처리 (depth 4-5)
        - 16개 인스턴스 변수를 직접 관리
        - verify_agent Optional 처리로 분기 복잡

        AFTER (목표):
        - ExecutionLoop: 메인 루프 오케스트레이션만 담당
        - 별도 클래스로 책임 분리 (DI):
          * LoopState: 카운터 및 플래그 관리
          * PhaseOrchestrator: Execute/Verify 실행 및 에러 처리
          * FeedbackManager: Verify feedback history 관리
        - verify_agent를 required로 변경 (Optional 제거)
        - 단순화된 메인 루프:
          ```
          while True:
              if not execution.completed:
                  execute_phase()
              if should_verify():
                  feedback, fully_done = verify_phase()
                  if fully_done: break
          ```
        - 불필요한 방어 코드 제거 (명백한 케이스만 처리)

        PRESERVED (유지):
        - 퍼블릭 API: run(), request_interrupt(), clear_interrupt()
        - 모든 에러 처리 로직
        - 세션 재개/저장 메커니즘
        - 10회 연속 Execute 스로틀
        - Feedback history 관리
        - Plan 상태 업데이트

    required_background:
      description: |
        **기술 스택:**
        - Python 3.12+
        - anyio (async 동시성)
        - 타입 힌트 필수 (모든 함수/메서드)

        **프로젝트 규칙:**
        - 타입 힌트: 모든 파라미터/반환값 명시
        - 테스트: pytest, fixture는 파일 맨 아래
        - 네이밍: 풀네임 사용 (축약 금지)
        - Imports: 파일 상단, nested import 금지

        **핵심 도메인 지식:**

        1. **Agent Protocol** (sisyphus_core.agents.base)
           - initialize(), start_session(), send(), stream(), close()
           - session_id property (stream() 후 업데이트됨)

        2. **Error Hierarchy** (sisyphus_core.utils.errors)
           - RetryRequiredError (재시도 가능)
             - SessionLimitError (reset_time 포함)
             - PromptTooLongError
           - SessionResumeError (세션 재개 실패)

        3. **Session Management** (sisyphus_core.core.session)
           - get_session(agent_type, plan_id) -> session_id or None
           - save_session(agent_type, session_id, plan_id)
           - delete_session(agent_type, plan_id)

        4. **Plan Models** (sisyphus_core.core.plans.models)
           - WorkPlan.execution.completed (boolean)
           - WorkPlan.work_mode.current_task_id
           - Todo.status (pending | in_progress | completed)

        5. **TaskValidatorProtocol**
           - read_content() -> str
           - check_all_goals_accomplished() -> bool
           - check_all_checkboxes_completed() -> bool

        **중요한 동작 방식:**

        - Execute phase: 세션 재개 시도 (3회 실패 시 삭제)
        - Verify phase: 항상 신규 세션
        - 10회 연속 Execute → 11번째 강제 Verify
        - Verify feedback은 Execute extra에 XML 형태로 주입
        - Plan 업데이트: fully_done에 따라 execution.completed 설정

