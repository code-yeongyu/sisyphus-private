work_plans:
- id: basedpyright-cleanup
  name: Basedpyright 이슈 완전 해결
  depends_on: []
  user_request:
    original: '지금 있는 basedpyright 이슈들 모두 정석적으로 해결하게 하는 작업계획서 작성해줘. uv run basedpyright
      . 했을때에 warning 조차도 없어야함(에러는 당연히 없어야함). 아래의 내용은 금지되는것: 1. 런타임에 영향을 단 조금이라도 주는
      것 2. ignore 처리해버리는 것. 아래의 내용은 내가 그래서 원하는 결과: 1. uv run basedpyright . 했을때 어떠한
      에러도 워닝도 없는 것 2. 기존과 100% 동일하게 작동하는 것'
    created_at: '2025-11-20T08:17:00.370424+00:00'
    additional:
    - 'Expected Outcome: uv run basedpyright . 실행 시 0 errors, 0 warnings 달성 + 기존과
      100% 동일한 런타임 동작 보장'
    - 'Forbidden Outcomes: 런타임 동작에 영향을 주는 모든 변경 금지 + type: ignore 또는 # pyright: ignore
      등 타입 체크 우회 금지'
    - 'Special Concerns: 일반적인 타입 안전성 원칙 준수로 충분, 특별한 주의사항 없음'
  objectives:
    core: 전체 프로젝트의 basedpyright 타입 체킹 이슈를 정석적인 방법으로 완전히 해결하여 워닝/에러 제로 상태 달성
    detailed:
    - goal: 타입 안전성 확보
      measurable: '`uv run basedpyright .` 실행 시 0 errors, 0 warnings 달성'
    - goal: 런타임 동작 보존
      measurable: 기존 테스트 100% 통과, 실제 동작 변화 없음
  background:
    current_situation: "현재 프로젝트에 총 48개 에러와 4088개 워닝이 존재\n\n주요 이슈 카테고리:\n- reportUnknownVariableType:
      타입 추론 불가능한 변수 (anyio, JSON 파싱 등)\n- reportAny: Any 타입 사용\n- reportUnknownMemberType:
      멤버 타입 추론 실패 (anyio.to_thread.run_sync)\n- reportUnknownArgumentType: 인자 타입 불명확\n\
      - reportExplicitAny: 명시적 Any 사용 (Type[Any] 등)\n- reportUnusedCallResult: 사용되지
      않는 함수 호출 결과\n- reportImplicitStringConcatenation: 암묵적 문자열 연결\n\n영향받는 주요 프로젝트:\n\
      - projects/sisyphus-cc-hooks/ (hook 타입 이슈)\n- projects/sisyphus-core/ (코어 로직
      타입 이슈)\n- projects/sisyphus-cli/ (CLI 타입 이슈)\n- projects/sisyphus-speckit/ (plan
      lint 타입 이슈)\n- sisyphus-setup-dot-claude/ (hook 스크립트 타입 이슈)\n"
    reason_for_change: "타입 안전성 강화 필요:\n- 런타임 에러 사전 방지\n- 코드 가독성 및 유지보수성 향상\n- IDE
      자동완성 및 타입 체킹 지원 강화\n- 타입 체킹을 통한 버그 조기 발견\n"
    changes_to_make: "현재 상태: 4088 warnings + 48 errors\n목표 상태: 0 warnings + 0 errors\n\
      \n변경 방법:\n1. TypedDict로 JSON 데이터 구조 타입 정의\n2. anyio 관련 타입 힌트 명시 (cast 활용)\n\
      3. 제네릭 타입 파라미터 명시\n4. 사용되지 않는 반환값 _ = 로 명시적 처리\n5. 명시적 Any 타입 제거 (적절한 타입으로 대체)\n\
      6. 암묵적 문자열 연결 명시적으로 변경\n7. type: ignore 사용 금지 (정석적 해결만 허용)\n"
  required_background:
    description: "기술 스택:\n- Python 3.12+\n- basedpyright 1.32.1\n- 프로젝트 구조: uv workspace
      (monorepo)\n- Async: anyio 4.11+ (asyncio/trio 호환)\n\n타입 체킹 설정:\n- pyrightconfig.json
      존재 (reportAttributeAccessIssue: false만 비활성화)\n- 기타 모든 체크 활성화 상태\n\n해결 원칙:\n\
      1. 타입 어노테이션 명시: 모든 함수 파라미터/리턴 타입 지정\n2. TypedDict 활용: JSON 데이터 구조 타입 정의\n3.
      Generic 명시: 제네릭 타입 파라미터 명확히\n4. cast() 활용: anyio 등 타입 추론 실패 시 사용\n5. 반환값 처리:
      사용 안 하면 _ = 로 명시\n\n타입 정의 패턴:\n```python\nfrom typing import TypedDict, cast\n\
      from collections.abc import Callable\n\n# JSON 구조 타입 정의\nclass HookInput(TypedDict):\n\
      \    tool_name: str\n    tool_input: dict[str, str]\n    cwd: str | None\n\n\
      # anyio 타입 처리\nresult = cast(int, await anyio.to_thread.run_sync(func))\n\n\
      # 사용되지 않는 반환값\n_ = some_function()\n```\n"
    references:
    - ref_id: basedpyright-docs
      uri: https://docs.basedpyright.com/
    - ref_id: typeddict-docs
      uri: https://docs.python.org/3/library/typing.html#typing.TypedDict
    - ref_id: anyio-types
      uri: https://anyio.readthedocs.io/
  workflow:
    dependency_diagram: "1. basedpyright 이슈 분석 및 분류\n   ↓\n2. sisyphus-cc-hooks 타입
