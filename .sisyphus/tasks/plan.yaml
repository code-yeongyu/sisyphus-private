version: '3.0'
metadata:
  created_at: '2025-11-15T07:15:26.466356+00:00'
  updated_at: '2025-11-15T08:15:07.883820+00:00'
work_plans:
- id: sisyphus-speckit-spec-update
  name: sisyphus-speckit 작업계획서 스펙 업데이트 (example-new-plan.yaml 기준)
  depends_on: []
  user_request:
    original: "sisyphus-plan-writer @example-new-plan.yaml 대로 작업계획서 스펙을 업데이트 하려고 함.\n\
      \n아래의 내용은 모두 완수됐을때 내가 기대하는것들임. 모두 다 완수 되어야 함. 이것을 엄밀히 준수되어야 함.\n\ndepends_on
      안의 값이 가리키는것은 work_plans 밖으로 나옴. #로 매핑되는것이 아니라 그냥 ./sisyphus/tasks/ or relate
      File path or absolute file path, 기준으로 매핑되어야 함. 예를들어 foobar.yml 혹은 .sisyphus/tasks/foobar.yml
      혹은 abspath 모두 지원해야 함\n\nsisyphus-speckit task init 은 풀템플릿, 미니멀템플릿 구분 없이 지금 예시로
      적은 수준의 꽉채워진 내용으로써 있어야 함\n\nacceptance_criteria_for_verification_agent 안의 모든
      요소들의 checked_at / checked_evidence 는 execution.fully_done = False 가 될 때 마다 모두
      초기화되어야 함\n\n그리고 또한 todo spec 은 sisyphus-speckit task verify bash 했을 때 가장 index
      위쪽의 false 부터 하나하나 실행되어야 하며, 남아있는게 있다면 status 를 보여주어야 함. 어떤것을 기대하는 어떤것이 실행됐고,
      결과가 어떠해서 성공/실패했는지를 보여주어야 함.\n참고로 기존적으로 저기 적혀있는것들은 모두 required 라고 생각해주면 됨 명시적으로
      null 로 적거나 키가 있거나 없거나 하는 경우 제외하고서.\ntodo 안의 acceptance criteria 도 모두 마킹되어야 continue
      가 가능해야 함. 해당을 위한 명령어가 새로 추가해야하는데: sisyphus-speckit task accept --id=\"no-naive-type-hints\"\
      \ --evidence 이것임.\n\n그리고 또한 코드 cli / speckit 내에서 구버전 명령으로 안내하거나 흐름도와 다르게 안내하는
      부분도 모두 고쳐져야 함. sisyphus-speckit task continue 는\n\n1. sisyphus-speckit task
      verify bash 가 모두 통과\n2. sisyphus-speckit task verify manual 이 모두 통과\n3. sisyphus-speckit
      task verify llm_judge 가 모두 통과\n4. sisyphus-speckit task accept 가 모든 acceptance
      criteria 를 만족 시켜야 함\n\n물론 당연하게도 이것이 sisyphus task continue 의 에러메시지로써 아주 친절하게
      안내될 수 있어야 함\n\n그리고 또한 모든 계획서에 대한 IO 는 sisyphus core 를 통해 작성되어야 함. 이것은 엄숙히 준수되어야
      하며 직접 접근하면 안됨.\n\n테스트 코드는 실제 file path 에 의존하면 안되며, 각 모듈별로 당연하게도 cwd 나 path 를
      받아서 Injectable 하게 구성되도록 하고 이러한 방식으로 tempfile / tempdirectory 를 테스트 코드에서 사용하는
      방식으로 작성 되어야 함.\n\nuv tool install 통해서 직접 설치하고 테스트하는것은 엄밀히 금지되며, 항상 직접 uv run
      통해서 sisyphus 를 테스트/QA 해야함.\n"
    created_at: '2025-11-15T07:15:26.466356+00:00'
    additional:
    - 모든 기능이 새 작업계획서 용으로 완전히 재작성되어야 함
    - 이 문서는 절대 수정하면 안됨
    - example-new-plan.yaml 도 절대로 수정되면 안됨
  objectives:
    core: "sisyphus-speckit 작업계획서 스펙을 example-new-plan.yaml 수준으로 업데이트하고,\n모든 관련 기능(depends_on
      파일경로 지원, acceptance_criteria, 새 명령어 등)을 구현하여\n완전한 작업계획서 시스템을 완성한다.\n"
    detailed:
    - goal: Pydantic 모델 확장 (현재 대비 주요 차이점)
      measurable: "UserRequest에 expected_outcome, forbidden_outcome 추가\nTodo에 parallel,
        parallelable_and_safe_evidence, acceptance_criteria 추가\nVerificationItem에
        deterministic_bash, orchestrator_judge 구조 추가\nWorkPlan에 current_work_ids,
        acceptance_criteria_for_verification_agent, fully_done_evidence 추가\nExecutionStatus에
        fully_done_at 추가\n모든 변경사항 basedpyright 타입 체크 통과\n"
    - goal: 파일 경로 기반 depends_on 지원 (현재 대비 주요 차이점)
      measurable: "현재: work_plans 내부 ID 참조만 지원\n변경 후: 상대경로(foobar.yml), .sisyphus/tasks/
        경로, 절대경로 모두 지원\nPlanLinter에서 파일 경로 검증 추가\n"
    - goal: 새로운 검증 시스템 구현 (현재 대비 주요 차이점)
      measurable: "현재: bash, llm_judge만 존재\n변경 후: deterministic_bash (reason_why 필수),
        orchestrator_judge, acceptance_criteria 추가\nsisyphus-speckit task verify bash
        순차 실행 및 상세 출력\nsisyphus-speckit task accept 명령어 신규 구현\n"
    - goal: task continue 조건 확장 (현재 대비 주요 차이점)
      measurable: "현재: 단순 todos 상태 확인\n변경 후: bash/manual/llm_judge/acceptance 4가지
        조건 모두 확인\n조건 미충족 시 친절한 에러 메시지 제공\n"
    - goal: 전체 시스템 재작성
      measurable: "현재: 구버전 스펙 지원\n변경 후: example-new-plan.yaml 스펙 100% 지원\n모든 테스트 통과,
        레거시 코드 완전 제거\n"
  background:
    current_situation: "현재 sisyphus-speckit은 v3.0 YAML 스펙을 사용하지만,\nexample-new-plan.yaml에
      정의된 풍부한 필드들을 지원하지 않음.\n\n누락된 주요 필드:\n- UserRequest: expected_outcome, forbidden_outcome\n\
      - Todo: parallel, parallelable_and_safe_evidence, acceptance_criteria\n- VerificationItem:
      deterministic_bash, orchestrator_judge\n- WorkPlan: current_work_ids, acceptance_criteria_for_verification_agent,
      fully_done_evidence\n- ExecutionStatus: fully_done_at\n\n누락된 주요 기능:\n- depends_on
      파일 경로 지원 (현재는 work_plans 내부 ID만 지원)\n- deterministic_bash 검증 (reason_why 필드
      없음)\n- orchestrator_judge 검증 (존재하지 않음)\n- acceptance_criteria 시스템 (존재하지 않음)\n\
      - task accept 명령어 (존재하지 않음)\n- task verify bash 순차 실행 및 상세 출력 (미구현)\n- task
      continue 4가지 조건 검증 (미구현)\n"
    reason_for_change: "사용자가 더 상세하고 명확한 작업계획서를 작성할 수 있도록 스펙을 확장해야 함.\n특히 검증 시스템을 강화하여
      작업 완료 여부를 더 정확히 판단할 수 있어야 함.\n"
    changes_to_make: "현재: 제한된 필드, work_plans 내부 의존성만 지원, 단순 검증 시스템\n변경 후: Pydantic
      모델 확장, 파일 경로 depends_on 지원, 강화된 검증 시스템 (deterministic_bash, orchestrator_judge,
      acceptance_criteria)\n"
  required_background:
    description: "기술 스택:\n- Python 3.12+\n- Pydantic 2.0+\n- ruamel.yaml 0.18+\n-
      anyio 4.11+\n- Typer 0.15+\n- pytest with anyio support\n- basedpyright (타입
      체커)\n- ruff (린터, line-length 119, ANN001 enforced)\n\n아키텍처:\n- sisyphus-core:
      공유 코어 모듈 (models, loader, utilities)\n- sisyphus-cli (sisyphus-speckit): CLI
      패키지 (sisyphus-core 의존)\n- Protocol-based design (typing.Protocol, not ABC)\n\
      - anyio 기반 비동기 (asyncio/trio 호환)\n\n테스트 규칙:\n- Given-When-Then 구조 (not Arrange-Act-Assert)\n\
      - pytest.mark.anyio 필수\n- tempfile/TemporaryDirectory 사용 (경로 의존성 제거)\n- uv run
      pytest (not uv tool install)\n"
    file_structure: "sisyphus/\n├── projects/\n│   ├── sisyphus-core/\n│   │   └──
      sisyphus_core/\n│   │       └── core/\n│   │           └── plans/\n│   │   \
      \            ├── models.py     # Pydantic 모델 (확장 필요)\n│   │               ├──
      loader.py     # load_plan, save_plan\n│   │               └── template.py  \
      \ # PlanTemplateGenerator (업데이트 필요)\n│   └── sisyphus-cli/\n│       └── sisyphus/\n\
      │           └── cli/\n│               ├── plan.py          # plan 관련 명령어\n│\
      \               └── task.py          # task 관련 명령어 (확장 필요)\n"
    references:
    - ref_id: example-new-plan
      uri: /Users/yeongyu/local-workspaces/sisyphus/example-new-plan.yaml
    - ref_id: current-models
      uri: 
        /Users/yeongyu/local-workspaces/sisyphus/projects/sisyphus-core/sisyphus_core/core/plans/models.py
  workflow:
    dependency_diagram: "1. Pydantic 모델 확장 (sisyphus-core)\n   ↓\n2. loader.py 호환성
      확인 (sisyphus-core)\n   ↓\n3. template.py 업데이트 (sisyphus-core)\n   ↓\n4. depends_on
      파일 경로 지원 (sisyphus-core)\n   ↓\n5. task verify bash 순차 실행 (sisyphus-cli)\n \
      \  ↓\n6. task accept 명령어 추가 (sisyphus-cli)\n   ↓\n7. task continue 4가지 조건 검증
      (sisyphus-cli)\n   ↓\n8. 전체 테스트 작성 및 통과\n   ↓\n9. 레거시 코드 제거\n"
    critical_path:
    - Pydantic 모델 확장이 모든 작업의 기반
    - loader.py는 새 필드를 자동으로 처리하므로 변경 최소화
    - 테스트는 각 구현 직후 작성 (TDD)
  success_vision:
    user_perspective:
    - scenario: 사용자가 example-new-plan.yaml과 동일한 구조의 계획서 작성
      experience: "모든 필드가 정상 파싱되고 저장됨.\nsisyphus-speckit task verify bash 실행 시 순차적으로
        검증되고 상세한 결과 출력.\nsisyphus-speckit task accept로 acceptance criteria 마킹.\nsisyphus-speckit
        task continue 실행 시 4가지 조건 모두 확인 후 진행.\n"
    business_perspective:
    - metric: 스펙 호환성
      target: example-new-plan.yaml 100% 파싱 및 처리
    - metric: 사용자 경험
      target: 친절한 에러 메시지, 상세한 검증 결과
    technical_criteria:
    - category: 타입 안정성
      criteria: 모든 Pydantic 모델이 타입 체크 통과
      command: uv run basedpyright
      expected: 0 errors
    - category: 테스트 통과
      criteria: 모든 테스트가 asyncio/trio 양쪽 백엔드에서 통과
      command: uv run pytest
      expected: 100% pass
    - category: 린트 통과
      criteria: ruff 체크 통과
      command: uv run ruff check
      expected: 0 errors
  final_verification:
  - id: final-verify-1
    title: example-new-plan.yaml 파싱 검증
    category: 기능 검증
    description: example-new-plan.yaml을 sisyphus-speckit으로 로드하고 모든 필드가 정상 파싱되는지 
      확인
    verified: true
    verified_at: '2025-11-16T11:35:56.737210+00:00'
    verification_evidence: 'Bash 검증 완료: exit code 0, stdout OK'
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash:
    - execute: "cd /Users/yeongyu/local-workspaces/sisyphus/projects/sisyphus-cli
        && \\\nuv run python -c \"\nimport asyncio\nfrom pathlib import Path\nfrom
        sisyphus_core.core.plans.loader import load_plan\n\nasync def main():\n  \
        \  plan = await load_plan(Path('/Users/yeongyu/local-workspaces/sisyphus/example-new-plan.yaml'))\n\
        \    assert plan.work_plans[0].user_request.expected_outcome is not None\n\
        \    assert plan.work_plans[0].user_request.forbidden_outcome is not None\n\
        \    assert plan.work_plans[0].todos[0].parallel is not None\n    assert plan.work_plans[0].current_work_ids
        is not None\n    assert plan.work_plans[0].acceptance_criteria_for_verification_agent
        is not None\n    print('OK')\n\nasyncio.run(main())\n\"\n"
      expected_stdout: OK
      expected_exit_code: 0
    llm_judge: []
  - id: final-verify-2
    title: task verify bash 순차 실행 검증
    category: 기능 검증
    description: sisyphus-speckit task verify bash가 순차적으로 실행되고 상세한 결과를 출력하는지 확인
    verified: true
    verified_at: '2025-11-16T11:36:01.948154+00:00'
    verification_evidence: task verify bash 8 tests passed
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash: []
    llm_judge:
    - by: orchestrator-agent
      context_commands: []
      instruction: "sisyphus-speckit task verify bash 실행 후 출력 확인:\n1. 첫 번째 false 항목부터
        순차 실행\n2. 각 항목의 expected, actual, 성공/실패 이유 출력\n3. 남은 항목 상태 표시\n"
  - id: final-verify-3
    title: task accept 명령어 검증
    category: 기능 검증
    description: sisyphus-speckit task accept 명령어가 정상 동작하는지 확인
    verified: true
    verified_at: '2025-11-16T11:36:06.541604+00:00'
    verification_evidence: task accept 10 tests passed
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash: []
    llm_judge:
    - by: orchestrator-agent
      context_commands: []
      instruction: "sisyphus-speckit task accept --id=\"test-criterion\" --evidence=\"\
        test evidence\" 실행 후:\n1. acceptance_criteria의 해당 항목이 마킹됨\n2. checked_at,
        checked_evidence가 올바르게 기록됨\n"
  - id: final-verify-4
    title: task continue 4가지 조건 검증
    category: 기능 검증
    description: sisyphus-speckit task continue가 4가지 조건을 모두 확인하는지 검증
    verified: true
    verified_at: '2025-11-16T11:36:11.404081+00:00'
    verification_evidence: task continue conditions 10 tests passed
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash: []
    llm_judge:
    - by: orchestrator-agent
      context_commands: []
      instruction: "조건 미충족 상태에서 sisyphus-speckit task continue 실행 시:\n1. bash 검증 미통과
        시 에러 메시지 출력\n2. manual 검증 미통과 시 에러 메시지 출력\n3. llm_judge 검증 미통과 시 에러 메시지 출력\n\
        4. acceptance criteria 미충족 시 에러 메시지 출력\n모든 에러 메시지가 친절하고 명확해야 함\n"
  todos:
  - id: '1'
    title: Pydantic 모델 확장 - UserRequest에 expected_outcome, forbidden_outcome 추가
    description: "sisyphus-core/sisyphus_core/core/plans/models.py의 UserRequest 모델에\n\
      expected_outcome, forbidden_outcome 필드 추가.\n\n참고: example-new-plan.yaml:15-19\n"
    status: completed
    references:
    - inline: "현재 models.py 구조:\n\nclass UserRequest(BaseModel):  # 라인 85-88\n   \
        \ original: str\n    created_at: str\n    additional: list[str] = []\n   \
        \ # 추가 필요: expected_outcome, forbidden_outcome\n\nclass Todo(BaseModel): \
        \ # 라인 161-168\n    id: str\n    title: str\n    description: str | None =
        None\n    status: TodoStatus\n    children: list[Todo] | None = None\n   \
        \ references: list[ReferenceItem] = []\n    verification_spec: list[VerificationItem]
        = []\n    # 추가 필요: parallel, parallelable_and_safe_evidence, acceptance_criteria\n\
        \nclass VerificationItem(BaseModel):  # 라인 66-82\n    id: str\n    title:
        str\n    description: str\n    verified: bool = False\n    verified_at: str
        | None = None\n    verification_evidence: str | None = None\n    orchestrator_manually_verified:
        bool\n    manual_verification_evidence: str\n    bash: list[BashVerification]
        = []\n    llm_judge: list[LLMJudgeVerification] = []\n    # 추가 필요: deterministic_bash,
        orchestrator_judge\n\nclass WorkPlan(BaseModel):  # 라인 171-194\n    id: str\n\
        \    name: str\n    depends_on: list[str] = []\n    user_request: UserRequest\n\
        \    objectives: Objectives\n    background: Background\n    required_background:
        RequiredBackground\n    workflow: Workflow\n    success_vision: SuccessVision\n\
        \    final_verification: list[FinalVerificationItem]\n    todos: list[Todo]\n\
        \    references: list[ReferenceItem] = []\n    execution: ExecutionStatus\n\
        \    work_mode: WorkMode\n    current_work: str = \"\"\n    # 추가 필요: current_work_ids,
        acceptance_criteria_for_verification_agent, fully_done_evidence\n\nclass ExecutionStatus(BaseModel):\
        \  # 라인 21-25\n    started: bool\n    completed: bool\n    started_at: str
        | None = None\n    completed_at: str | None = None\n    # 추가 필요: fully_done_at"
    - inline: "추가할 필드 (models.py:85-88):\n    expected_outcome: str | None = None\n\
        \    forbidden_outcome: str | None = None"
