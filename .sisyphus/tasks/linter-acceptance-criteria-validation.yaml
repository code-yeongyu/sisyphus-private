version: '3.0'
metadata:
  created_at: '2025-11-22T12:45:12+00:00'
  updated_at: '2025-11-22T12:45:12+00:00'
work_plans:
- id: linter-acceptance-criteria-validation
  name: Linter Acceptance Criteria Validation Enhancement
  depends_on: []

  user_request:
    original: "하위호환 고려하지말고, 1. acceptnace criteria 는 무조건 두개 이상 있어야하고 2. acceptance criteria for verification agents 도 무조건 있어야 하고 네개 이상 있어야 하는것으로 고치는"
    created_at: '2025-11-22T12:45:12+00:00'
    additional:
      - "Expected Outcome: 린터가 acceptance_criteria 2개 미만 시 에러, acceptance_criteria_for_verification_agent 4개 미만 시 에러, 둘 다 + 테스트 통과"
      - "Forbidden Outcomes: 기존 린터 검증 로직 손상, 타입 안전성 위반, 하위 호환에 대한 고려. 무조건 모든 코드는 현재 버전 기준으로 작성되어야 하고 하위호환을 위한 방어적 코드는 절대적으로 금지됨. 그리고 또한 과정의 도중 uv install 을 통해 갈아끼워버리는 행위도 엄밀히 금지됨"
      - "Special Concerns: 에러 메시지 명확성, 린터 성능"
      - "Additional Requirements: acceptance_criteria_for_verification_agent는 아주 빡빡하게 채워넣어야함, plan init에서도 당연히 잘 채워넣어준걸 생성하도록해야겠지"

  objectives:
    core: "PlanLinter의 acceptance criteria 검증 규칙을 강화하여 todos[].acceptance_criteria는 최소 2개, acceptance_criteria_for_verification_agent는 필수이며 최소 4개를 요구하도록 변경"
    detailed:
      - goal: "acceptance_criteria_for_verification_agent를 required 필드로 변경"
        measurable: "WorkPlan 모델에서 default=[] 제거, PlanLinter required_fields에 추가"
      - goal: "acceptance_criteria_for_verification_agent 최소 개수를 4개로 변경"
        measurable: "_validate_acceptance_criteria_minimum()에서 2→4 변경"
      - goal: "PlanTemplateGenerator가 4개 이상의 빡빡한 예제 생성"
        measurable: "full_example() 템플릿이 4개 이상 체크리스트 포함"
      - goal: "모든 변경사항에 대한 테스트 통과"
        measurable: "기존 테스트 수정 + 새 테스트 추가하여 100% 통과"

  background:
    current_situation: |
      현재 PlanLinter는 다음과 같이 동작합니다:
      - todos[].acceptance_criteria: optional, 있으면 최소 2개 검증 (plan_linter.py:1152-1165)
      - acceptance_criteria_for_verification_agent: optional, 있으면 최소 2개 검증 (plan_linter.py:1167-1180)
      - WorkPlan 모델: acceptance_criteria_for_verification_agent은 default=[] (models.py:262)
      - PlanTemplateGenerator: full_example()은 backend.yaml에서 로드 (template.py:45-72)

      테스트 현황:
      - test_plan_linter_acceptance_criteria.py: 11개 테스트 존재
      - 모두 최소 2개 기준으로 작성됨

    reason_for_change: |
      acceptance_criteria_for_verification_agent는 작업 완료 검증의 핵심 메커니즘이므로:
      1. 필수 필드로 강제하여 모든 계획서가 검증 기준을 명확히 정의하도록
      2. 최소 4개 요구하여 "아주 빡빡한" 검증 기준 확립
      3. 하위 호환성은 고려하지 않음 (사용자 명시적 요구)

    changes_to_make: |
      현재 상태 → 변경 후:

      1. WorkPlan 모델 (models.py):
         - BEFORE: acceptance_criteria_for_verification_agent: list[...] = []
         - AFTER: acceptance_criteria_for_verification_agent: list[...] (required, no default)

      2. PlanLinter required_fields (plan_linter.py:133-144):
         - BEFORE: ["id", "name", "user_request", ..., "todos"] (10개)
         - AFTER: + "acceptance_criteria_for_verification_agent" (11개)

      3. PlanLinter _validate_acceptance_criteria_minimum (plan_linter.py:1170):
         - BEFORE: if len(criteria_for_agent) < 2
         - AFTER: if len(criteria_for_agent) < 4

      4. PlanTemplateGenerator (template.py):
         - backend.yaml 예제 업데이트: 4개 이상 빡빡한 체크리스트

      5. 테스트 (test_plan_linter_acceptance_criteria.py):
         - 2개 기준 테스트 → 4개 기준 테스트로 수정
         - required 검증 테스트 추가

  required_background:
    description: |
      기술 스택:
      - Python 3.12+
      - Pydantic 2.0+ (BaseModel, Field, model_validator)
      - pytest + pytest-anyio
      - ruamel.yaml

      프로젝트 구조:
      - sisyphus-core: 핵심 로직 (models, linter, template)
      - sisyphus-speckit: CLI (plan init 명령어)

      핵심 파일:
      - sisyphus_core/core/plans/models.py: WorkPlan, AcceptanceCriteriaForVerificationAgent 모델
      - sisyphus_core/core/plan_linter.py: PlanLinter 클래스
      - sisyphus_core/core/plans/template.py: PlanTemplateGenerator
      - sisyphus_core/examples/multi-file/backend.yaml: full_example() 소스
      - tests/core/test_plan_linter_acceptance_criteria.py: 테스트

      프로젝트 컨벤션:
      - Type hints 필수 (ANN001)
      - Double quotes only
      - Line length 119
      - Given-When-Then 테스트 구조
      - anyio 사용 (asyncio/trio 양쪽 지원)

    file_structure: null

    references:
      - ref_id: 'pydantic-docs'
        uri: 'https://docs.pydantic.dev/latest/'
        inline: null
      - ref_id: 'pytest-docs'
        uri: 'https://docs.pytest.org/'
        inline: null

