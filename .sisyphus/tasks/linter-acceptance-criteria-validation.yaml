            - models.py: acceptance_criteria_for_verification_agent required로 변경
            - plan_linter.py: required_fields 추가 + 최소 개수 4개로 변경

            Commit 메시지 형식:
            ```
            feat: enforce acceptance_criteria_for_verification_agent as required with minimum 4 items

            BREAKING CHANGE: acceptance_criteria_for_verification_agent is now required
            and must have at least 4 items (previously optional with minimum 2).

            - Remove default=[] from WorkPlan model
