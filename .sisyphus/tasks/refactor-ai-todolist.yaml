      references:
      - inline: "구현 위치: loop.py:_resolve_plan_path_from_status() 이후\n\n구현 내용:\n```python\n\
          async def _initialize_from_plan(\n    self,\n    plan_path: Path,\n) ->
          tuple[str, str, str]:\n    \"\"\"Initialize plan context from plan path
          (DRY - used once).\n\n    Args:\n        plan_path: Path to YAML plan file\n\
          \n    Returns:\n        Tuple of (execute_prompt, verify_prompt, resolved_plan_path_str)\n\
          \    \"\"\"\n    plan_doc = await load_plan(plan_path)\n\n    if not plan_doc.work_plans:\n\
          \        self._current_plan_id = \"default\"\n    else:\n        self._current_plan_id
          = plan_doc.work_plans[0].id\n\n    uncompleted_todos = []\n    for plan
          in plan_doc.work_plans:\n        for todo in plan.todos:\n            if
          todo.status != \"completed\":\n                uncompleted_todos.append(f\"\
          \  - [{todo.id}] {todo.title}\")\n\n    todo_summary = \"\\n\".join(uncompleted_todos[:10])
          if uncompleted_todos else \"All tasks completed\"\n    if len(uncompleted_todos)
          > 10:\n        todo_summary += f\"\\n  ... and {len(uncompleted_todos) -
          10} more\"\n\n    execute_prompt = build_execute_prompt(str(plan_path),
          todo_summary)\n    verify_prompt = build_verify_prompt(str(plan_path))\n\
          \n    return (execute_prompt, verify_prompt, str(plan_path))\n```\n"
