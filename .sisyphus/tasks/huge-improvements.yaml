        BarColumn, TextColumn\nfrom pathlib import Path\nimport typer\n\ndef status(\n\
        \    path: Path | None = typer.Option(None, \"--path\", \"-p\"),\n    cwd:
        str | None = typer.Option(None, \"--cwd\"),\n) -> None:\n    async def _status()
        -> None:\n        working_dir = resolve_cwd(cwd)\n\n        if path:\n   \
        \         # 특정 파일 지정\n            plan_doc = await load_plan_from_path(path)\n\
        \            work_plan = plan_doc.work_plans[0]\n        else:\n         \
