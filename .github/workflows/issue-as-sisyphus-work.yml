name: Sisyphus Work From Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.SISYPHUS_APP_ID }}
          private-key: ${{ secrets.SISYPHUS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Install Tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.0

      - name: Cache global npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          ls -la ~/.local/bin/claude || echo "Claude binary not found!"
          which claude || echo "Claude not in PATH!"

      - name: Ensure Claude Code in PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Verify claude is accessible
          claude --version || echo "Claude command failed!"

      - name: Setup Claude Code configuration
        run: |
          if [ -d ".github/workflows/.claude" ]; then
            # Copy to user config (~/.claude)
            mkdir -p ~/.claude
            cp -r .github/workflows/.claude/* ~/.claude/
            echo "Copied .claude configuration to ~/.claude"
            ls -la ~/.claude
          else
            echo "No .github/workflows/.claude directory found, skipping configuration copy"
          fi

      - name: Setup GitHub CLI authentication
        run: |
          echo "${{ steps.generate-token.outputs.token }}" | gh auth login --with-token
          gh auth status

      - name: Validate issue format
        id: validate
        run: |
          ISSUE_BODY="${{ github.event.issue.body }}"

          # Check for unchecked checkboxes (- [ ])
          if ! echo "$ISSUE_BODY" | grep -q '\- \[ \]'; then
            echo "❌ Issue does not contain unchecked checkboxes (- [ ])"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for is_execution_started = FALSE
          if ! echo "$ISSUE_BODY" | grep -iq 'is_execution_started.*=.*FALSE'; then
            echo "❌ Issue does not contain 'is_execution_started = FALSE'"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Issue format is valid"
          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Post validation failure comment
        if: steps.validate.outputs.valid == 'false'
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "⚠️ This issue does not match the required ai-todolist.md format. Sisyphus workflows require:

          1. Unchecked checkboxes (\`- [ ]\`)
          2. \`is_execution_started = FALSE\`

          Please update the issue to match the format."
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Exit if validation failed
        if: steps.validate.outputs.valid == 'false'
        run: exit 0

      - name: Post initial comment
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "🤖 Sisyphus has started working on this issue. I'll create a pull request once the work is complete."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync project dependencies
        run: |
          uv sync

      - name: Set environments for work
        run: |
          uv run sisyphus reset --include-task-specs

      - name: Create ai-todolist.md from issue
        run: |
          cat > ai-todolist.md << 'EOF'
          # Task from Issue #${{ github.event.issue.number }}

          **Title:** ${{ github.event.issue.title }}

          **Description:**
          ${{ github.event.issue.body }}

          ---
          EOF

          cat ai-todolist.md
      - name: Setup Sisyphus Claude Code Plugin
        run: |
          claude plugin marketplace add ./
          claude plugin install essentials@sisyphus-marketplace

      - name: Run Sisyphus
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run sisyphus work --no-tui
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLI_PATH: ${{ env.HOME }}/.local/bin/claude
        continue-on-error: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push branch with changes
        run: |
          # Create a new branch for this issue
          BRANCH_NAME="sisyphus/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"

          # Add all changes
          git add .

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          git commit -m "feat: implement solution for issue #${{ github.event.issue.number }}

          ${{ github.event.issue.title }}"

          # Push to origin
          git push -u origin "$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Get Bun Path to use
        id: bun_path
        run: |
          BUN_PATH=$(which bun)
          echo "BUN_PATH=$BUN_PATH" >> $GITHUB_OUTPUT
          echo "Bun executable path: $BUN_PATH"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.13
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.app-token.outputs.token }}
          track_progress: true
          use_sticky_comment: true
          path_to_bun_executable: ${{ steps.bun_path.outputs.BUN_PATH }}
          prompt: |
            You have done your work as ./ai-todolist.md file and your work logs are on ./notepad.md
            I want you to create PR using gh cli,
            of the works that you have done.
            This work from Issue #${{ github.event.issue.number }} ${{ github.event.issue.title }}

            And I want you to be the description and the title of the PR is nice to read and good to review.
            You have to make the title / description's language as that ./ai-todolist.md file's language. So if the ./ai-todolist.md file is mostly written in 한국어, then write all the texts in 한국어 since it means that the plan file is generated from Korean. This same applies to many other languages.

            No Ask to me at all from now, just create PR. You are a fully automated system, just CREATE PULL REQUEST. No Excuses.

            1. Create PR Using gh cli
            2. Comment on Issue #${{ github.event.issue.number }} that PR has been created - with the PR link - reply in the same language as the PR.
          claude_args: |
            --dangerously-skip-permissions

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sisyphus-logs
          path: |
            logs/
            ai-todolist.md
          retention-days: 7

      - name: Post failure comment
        if: failure()
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "❌ Sisyphus encountered an error while working on this issue. Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
