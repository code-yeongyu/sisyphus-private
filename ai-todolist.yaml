          test_pattern: |
            # given-when-then 패턴 사용

            import pytest
            from tetris.game import Tetromino

            pytestmark = [pytest.mark.anyio]

            def test_tetromino_creation():
                # given & when
                t = Tetromino('I')

                # then
                assert t.type == 'I'
                assert t.rotation == 0
                assert t.x == 3
                assert t.y == 0

            def test_tetromino_rotation():
                # given
                t = Tetromino('T', rotation=0)

                # when
                rotated = t.rotate()

                # then
