# ============================================================================
# BACKGROUND - 배경
# ============================================================================
background:
  current_situation: |
    현재 Sisyphus 프로젝트는 Python 기반의 AI 에이전트 오케스트레이션 시스템입니다.
    Textual 프레임워크는 이미 TUI 구현에 사용 중이며 (sisyphus/ui/tui/),
    anyio 기반 비동기 처리 패턴이 확립되어 있습니다.

    하지만 게임 개발 관련 코드는 전혀 없으며, Tetris 구현을 위한
    게임 로직, 블록 관리, 타이머 기반 루프가 필요합니다.

  reason_for_change: |
    Textual 프레임워크의 활용도를 높이고, TUI 애플리케이션 개발 역량을 시연하기 위해
    클래식 게임인 Tetris를 구현합니다. 이를 통해:
    - Textual의 위젯 시스템, 이벤트 핸들링, 타이머 기능 활용법 습득
    - 2D 그리드 기반 게임 로직의 Python 구현 패턴 확립
    - 사용자 입력과 자동 진행이 혼합된 실시간 애플리케이션 개발 경험

  changes_to_make: |
    **현재 상태**: Sisyphus 프로젝트에 게임 관련 코드 없음

    **변경 후 상태**:
    - `tetris/` 디렉토리 신규 생성
    - `tetris/game.py`: 게임 로직 (Tetromino, Board, GameState)
    - `tetris/ui.py`: Textual 기반 TUI (GameBoard 위젯, App)
    - `tetris/__main__.py`: CLI 진입점
    - 완전히 플레이 가능한 Tetris 게임 제공

# ============================================================================
# REQUIRED BACKGROUND - 필요한 배경 지식
# ============================================================================
required_background:
  description: |
    **핵심 지식**:
    - **Textual 프레임워크**: TUI 애플리케이션 개발 (위젯, 레이아웃, 이벤트)
    - **Tetris 게임 로직**: Tetromino 회전 행렬, 충돌 감지, 라인 클리어
    - **Python 비동기 패턴**: anyio 기반 타이머, 이벤트 루프
    - **2D 배열 조작**: NumPy 또는 순수 Python 리스트

    **아키텍처 제약**:
    - Textual App은 asyncio 기반이므로 anyio 사용 (기존 sisyphus 패턴 유지)
    - 게임 로직(game.py)은 순수 Python, UI 의존성 없음 (테스트 용이)
    - 상태 변경은 GameState에서만 (단일 진실 공급원)
    - 렌더링은 Textual의 reactive 시스템 활용 (watch 패턴)

    **Edge Cases**:
    - 게임 오버 (보드 최상단에 블록 고정) → 게임 일시정지, 재시작 프롬프트
    - 터미널 크기 부족 → 시작 시 크기 검사, 부족 시 에러 메시지
    - 빠른 키 입력 (키 반복) → debounce 없음, 모든 입력 처리 (Tetris 특성)
    - 회전 실패 (벽/블록 충돌) → wall kick 시도 (SRS 표준), 실패 시 회전 무시
    - 동시 4줄 클리어 → 보너스 점수 (Tetris!), 애니메이션 효과

    **암묵적 가정**:
    - 터미널은 UTF-8 인코딩 지원 (유니코드 블록 문자 렌더링)
    - 사용자는 ANSI 색상 지원 터미널 사용 (블록 색상 표시)
    - Python 3.12 환경 (Sisyphus 프로젝트 기준)
    - Textual 1.0+ 설치됨 (기존 의존성)
    - 게임은 단일 플레이어 로컬 실행 (네트워크 없음)

