version: '3.0'
metadata:
  created_at: '2025-11-18T15:13:38.541961+00:00'
  updated_at: '2025-11-19T00:00:00.000000+00:00'
work_plans:
- id: cli-command-improvements
  name: CLI Command Structure Improvements
  depends_on: []
  user_request:
    original: "1. 모든 todo 안의 내용이 완료됐을 때 만 실행 할 수 있는 'sisyphus-speckit plan mark completed'\n\
      - 혹여 상태 상 completed 로 마킹 할 수 없다면\n- sisyphus task continue 실행하라고 하면서\n- sisyphus
      task current 보여주도록 하기\n\n2. sisyphus task continue 가 completed true 로 마킹하는 기능
      없애고, 모든 작업이 완료되어있는 상태라면 다른 플랜으로 전환하거나 하는 side effect 를 만들지말기. 대신 completed false
      라면 'sisyphus-speckit plan mark completed' 쓰라고 안내해주기\n\n3. sisyphus-speckit plan
      mark-fully-done 을 sisyphus-speckit plan mark fully-done 으로 변경해야 함\n- 관련해서 프롬프트나
      이런데에서도 같이 바뀌어야 함\n\n4. sisyphus-speckit task verify status 를 sisyphus-speckit
      plan status 로 변경해야 함 - 프롬프트랑 같이"
    created_at: '2025-11-18T15:13:38.541961+00:00'
    additional: []
  objectives:
    core: 'sisyphus-speckit CLI 명령어 구조 개선: 새 명령어 추가, 기존 명령어 동작 수정, 명령어명 변경을 통한 사용성
      향상'
    detailed:
    - goal: plan mark completed 신규 명령어 추가
      measurable: 모든 todo 완료 시에만 실행 가능, 미완료 시 task continue 안내 메시지 출력
    - goal: task continue 동작 변경
      measurable: completed=true 마킹 제거, 플랜 자동 전환 side effect 제거, 미완료 시 안내 추가
    - goal: plan mark-fully-done → plan mark fully-done 리네이밍
      measurable: 명령어명과 프롬프트 일괄 변경 완료
    - goal: task verify status → plan status 리네이밍
      measurable: 명령어명과 프롬프트 일괄 변경 완료
  background:
    current_situation: sisyphus-speckit은 Typer CLI 기반으로 plan/task 명령어 제공. 현재 
      task continue가 completed 마킹과 플랜 전환을 자동으로 수행하며, mark-fully-done과 verify 
      status가 inconsistent 네이밍을 가짐
    reason_for_change: 명령어간 책임 분리 명확화, 예측 가능한 동작 보장, 일관된 명령어 네이밍 규칙 적용 필요
    changes_to_make: 1) plan mark completed 추가 2) task continue 자동 마킹 제거 3) 
      mark-fully-done → mark fully-done 4) verify status → plan status
  required_background:
    description: sisyphus-speckit Python 3.12+ Typer CLI, sisyphus-core 의존, Rich
      출력, plan/task 하위 명령어 구조
    file_structure: "sisyphus-speckit/\n├── sisyphus_speckit/\n│   ├── cli.py    \
      \         # Typer app entry\n│   ├── plan/              # Plan commands\n│ \
      \  │   └── mark_completed.py (NEW)\n│   └── task/\n│       └── continue_.py\
      \   # 수정 필요\n"
    references:
    - uri: projects/sisyphus-speckit/AGENTS.md
    - uri: projects/sisyphus-cli/AGENTS.md
  workflow:
    dependency_diagram: "graph TD\n  A[Req1: plan mark completed 추가] --> E[통합 테스트]\n\
      \  B[Req2: task continue 수정] --> E\n  C[Req3: mark-fully-done 리네임] --> E\n \
      \ D[Req4: verify status 리네임] --> E\n  E --> F[Commit & Push]\n"
    critical_path:
    - Req1 구현 → Req2 구현 (서로 참조하는 명령어이므로 순차)
    - Req3, Req4는 독립적으로 병렬 가능
    - 모든 구현 완료 → 통합 테스트 → 커밋
  success_vision:
    user_perspective:
    - scenario: 사용자가 plan mark completed 실행
      experience: 모든 todo 미완료면 명확한 안내 메시지와 함께 task current 표시
    - scenario: task continue 실행
      experience: completed 자동 마킹 없이 예측 가능한 동작
    - scenario: 명령어 실행
      experience: mark fully-done과 plan status로 일관되고 직관적인 네이밍
    business_perspective:
    - metric: CLI UX 개선
      target: 사용자 혼란 감소
    - metric: 명령어 책임 분리
      target: 유지보수성 향상
    technical_criteria:
    - category: command
      criteria: sisyphus-speckit plan mark completed 실행 시 모든 todo completed 확인
      expected: bash command 실행
    - category: behavior
      criteria: sisyphus-speckit task continue가 completed=true 마킹하지 않음
      expected: 코드 리뷰 및 테스트
    - category: command
      criteria: sisyphus-speckit plan mark fully-done 명령어 존재
      expected: help 명령어 확인
    - category: command
      criteria: sisyphus-speckit plan status 명령어 존재
      expected: help 명령어 확인
    - category: quality
      criteria: 모든 테스트 통과
      expected: uv run pytest
