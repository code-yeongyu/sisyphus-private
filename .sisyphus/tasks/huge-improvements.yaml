    description: "sisyphus-speckit task status 명령어를 구현하여\n현재 task의 모든 검증 상태를 상세히 출력\n"
    status: completed
    references:
    - inline: "Implementation Requirements:\n1. 현재 task 정보 출력\n2. 모든 verification_spec
        상세 출력 (ID, title, description 포함)\n3. continuable 여부 출력 (다음 단계로 넘어갈 수 있는지)\n\
        4. acceptance_criteria 출력\n\nFile: projects/sisyphus-speckit/sisyphus_speckit/task/status.py
        (신규 생성)\n\nNOTE: 기존 plan/status.py와 혼동하지 말 것. 이것은 task의 status입니다.\n\nExample
        Implementation:\n```python\nfrom rich.table import Table\nfrom rich.panel
        import Panel\nimport typer\n\ndef task_status(\n    cwd: str | None = typer.Option(None,
        \"--cwd\"),\n) -> None:\n    async def _task_status() -> None:\n        working_dir
        = resolve_cwd(cwd)\n        plan_doc, work_plan, task_manager = await _load_current_plan(working_dir)\n\
        \n        current_task = task_manager.get_current_task()\n        if not current_task:\n\
        \            console.print(\"[red]No current task[/red]\")\n            return\n\
        \n        # 1. Task 기본 정보\n        console.print(Panel(f\"[bold]{current_task.title}[/bold]\"\
        , title=f\"Task {current_task.id}\"))\n        console.print(f\"Status: {current_task.status}\"\
        )\n        console.print(f\"Description: {current_task.description}\")\n\n\
        \        # 2. Verification Spec 상세 출력\n        console.print(\"\\n[bold cyan]Verification
        Specifications:[/bold cyan]\")\n        for vspec in current_task.verification_spec:\n\
        \            console.print(f\"\\n[yellow]ID: {vspec.id}[/yellow]\")\n    \
        \        console.print(f\"Title: {vspec.title}\")\n            console.print(f\"\
        Description: {vspec.description}\")\n            console.print(f\"Verified:
        {vspec.verified}\")\n\n            if vspec.bash:\n                console.print(\"\
        \  Bash Checks:\")\n                for bash in vspec.bash:\n            \
        \        console.print(f\"    - {bash.execute}\")\n\n            if vspec.llm_judge:\n\
        \                console.print(\"  LLM Judge:\")\n                for llm
        in vspec.llm_judge:\n                    console.print(f\"    - By: {llm.by}\"\
        )\n\n        # 3. Acceptance Criteria\n        if current_task.acceptance_criteria:\n\
        \            console.print(\"\\n[bold cyan]Acceptance Criteria:[/bold cyan]\"\
        )\n            table = Table()\n            table.add_column(\"ID\")\n   \
        \         table.add_column(\"Condition\")\n            table.add_column(\"\
        Verified\")\n            for ac in current_task.acceptance_criteria:\n   \
        \             table.add_row(ac.id, ac.condition, str(ac.verified_at is not
        None))\n            console.print(table)\n\n        # 4. Continuable 여부\n\
        \        can_continue = task_manager.can_continue_to_next()\n        console.print(f\"\
        \\n[bold cyan]Continuable:[/bold cyan] {can_continue}\")\n        if not can_continue:\n\
        \            console.print(\"[yellow]Complete current task verifications to
        continue[/yellow]\")\n\n    _run_async(_task_status())\n```\n\nRegister in
        task/app.py:\n```python\nfrom sisyphus_speckit.task.status import task_status\n\
        task_app.command(name=\"status\")(task_status)\n```\n"
