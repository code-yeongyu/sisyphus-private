    - inline: "// Minimap.jsx - 2D Canvas 오버레이 방식 (추가 렌더 패스 없음)\n\nfunction Minimap({
        players, localPlayerId, mapBounds = {x: 1000, z: 1000} }) {\n  const canvasRef
        = useRef();\n\n  useEffect(() => {\n    const ctx = canvasRef.current.getContext('2d');\n\
        \    const width = 200, height = 200;\n\n    // Clear\n    ctx.fillStyle =
        'rgba(0, 0, 0, 0.5)';\n    ctx.fillRect(0, 0, width, height);\n\n    // Draw
        boundary\n    ctx.strokeStyle = 'red';\n    ctx.strokeRect(0, 0, width, height);\n\
        \n    // Draw players\n    players.forEach(p => {\n      const x = ((p.position.x
        + mapBounds.x/2) / mapBounds.x) * width;\n      const z = ((p.position.z +
        mapBounds.z/2) / mapBounds.z) * height;\n\n      ctx.fillStyle = p.id ===
        localPlayerId ? 'yellow' : p.color;\n      ctx.beginPath();\n      ctx.arc(x,
        z, 4, 0, Math.PI * 2);\n      ctx.fill();\n    });\n  }, [players, localPlayerId,
        mapBounds]);\n\n  return <canvas ref={canvasRef} width={200} height={200}\n\
        \                 style={{position: 'absolute', bottom: 20, right: 20}} />;\n\
        }\n"
