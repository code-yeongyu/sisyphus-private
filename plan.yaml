    title: 백엔드 Player 모델 및 gameUtils (TDD)
    description: 'Player 모델 (id, nickname, color, position, rotation, velocity, violations,
      sessionId, serialize()). gameUtils (isOutOfBounds, generateRandomColor, validateNickname,
      validateInput, clampSpeed). TDD: 테스트 먼저 작성 후 구현. uuid 라이브러리 사용.'
    status: pending
    children: []
    references:
    - inline: "// gameUtils.js 검증 로직\n\nfunction validateNickname(nickname) {\n  //
        길이 제한: 2~20자\n  if (!nickname || nickname.length < 2 || nickname.length >
        20) {\n    throw new Error('Nickname must be 2-20 characters');\n  }\n  //
        XSS 방지: HTML 태그 제거\n  const sanitized = nickname.replace(/<[^>]*>/g, '');\n\
        \  // 특수문자 제한: 알파벳, 숫자, 일부 기호만 허용\n  if (!/^[a-zA-Z0-9_\\-가-힣]+$/.test(sanitized))
        {\n    throw new Error('Invalid characters in nickname');\n  }\n  return sanitized;\n\
        }\n\nfunction validateInput(input) {\n  // NaN/Infinity 체크\n  const { throttle,
        pitch, yaw, roll } = input;\n  if ([throttle, pitch, yaw, roll].some(v =>
        !isFinite(v))) {\n    throw new Error('Invalid input values');\n  }\n  //
        범위 제한: throttle 0~1, pitch/yaw/roll -1~1 (CRITICAL: Zod 스키마와 일치)\n  if (throttle
        < 0 || throttle > 1 || Math.abs(pitch) > 1 ||\n      Math.abs(yaw) > 1 ||
        Math.abs(roll) > 1) {\n    throw new Error('Input values out of range');\n\
        \  }\n  return true;\n}\n\nfunction clampSpeed(velocity, maxSpeed = 100) {\n\
        \  const speed = Math.sqrt(velocity.x**2 + velocity.y**2 + velocity.z**2);\n\
        \  if (speed > maxSpeed) {\n    const scale = maxSpeed / speed;\n    return
        {\n      x: velocity.x * scale,\n      y: velocity.y * scale,\n      z: velocity.z
        * scale\n    };\n  }\n  return velocity;\n}\n"
