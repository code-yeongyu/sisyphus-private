        details:
          file: "tetris/game.py"
          pattern_reference:
            description: "불변 객체 패턴 (dataclass)"
            example: |
              from dataclasses import dataclass

              @dataclass
              class Tetromino:
                  type: str
                  rotation: int = 0
                  x: int = 3
                  y: int = 0

                  @property
                  def shape(self) -> list[list[int]]:
                      return SHAPES[self.type][self.rotation]

                  def rotate(self, direction: int = 1) -> "Tetromino":
                      """회전된 새 Tetromino 반환 (불변)"""
                      new_rotation = (self.rotation + direction) % 4
                      return Tetromino(self.type, new_rotation, self.x, self.y)

                  def move(self, dx: int, dy: int) -> "Tetromino":
                      """이동된 새 Tetromino 반환"""
                      return Tetromino(self.type, self.rotation, self.x + dx, self.y + dy)

