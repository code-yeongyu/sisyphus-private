[project]
name = "sisyphus-core"
version = "0.1.0"
description = "Shared core modules for Sisyphus monorepo - YAML plan models, agents, utilities, and UI components"
authors = [{ name = "YeonGyu-Kim", email = "public.kim.yeon.gyu@gmail.com" }]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Sustainable Use License 1.0" }
keywords = [
    "llm",
    "ai",
    "agent",
    "orchestration",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.11.0",
    "trio>=0.31.0",
    "uvloop>=0.21.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "aiofiles>=24.0.0",
    "typer>=0.15.0",
    "textual>=1.0.0",
    "rich>=13.0.0",
    "claude-agent-sdk>=0.1.0",
    "catppuccin>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/code-yeongyu/sisyphus"
Repository = "https://github.com/code-yeongyu/sisyphus"
Issues = "https://github.com/code-yeongyu/sisyphus/issues"
Documentation = "https://github.com/code-yeongyu/sisyphus#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sisyphus_core"]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py", "*_test.py"]
testpaths = ["tests"]
addopts = """\
    --disable-warnings \
"""
log_level = "ERROR"

[tool.basedpyright]
pythonVersion = "3.12"
venvPath = "../.."
venv = ".venv"
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = false
enableTypeIgnoreComments = true
reportMissingImports = false
reportMissingTypeStubs = false
reportUnannotatedClassAttribute = false
reportGeneralTypeIssues = "error"
reportAssignmentType = "error"
reportMissingTypeArgument = "error"

[tool.ruff]
line-length = 119
target-version = "py312"
lint.select = [
    "PLE",
    "PLW",
    "E",
    "W",
    "F",
    "I",
    "Q",
    "UP",
    "C4",
    "PT",
    "ANN001",
    "ASYNC",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
docstring-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = true
fixture-parentheses = true

[dependency-groups]
dev = [
    "graphviz>=0.21",
]
