- id: refactor-loop-fallback
  name: ExecutionLoop fallback 로직 제거 및 리팩토링
  depends_on: []
  user_request:
    original: "지금 저 fallback 로직 없애고 ideal 한 one root 코드만 남기고 싶은데 가능하려나 ?"
    created_at: '2025-11-18T04:24:32.927069+00:00'
    additional:
    - "기대 결과: loop.py의 run() 메서드에서 중복된 fallback 로직(4번 반복)을 제거하고, status_manager 단일 소스 기반의 깔끔한 plan path 결정 로직으로 리팩토링"
    - "기존 테스트 코드도 모두 통과해야 함"
  objectives:
    core: "loop.py의 run() 메서드에서 중복된 fallback 로직(4번 반복)을 제거하고, status_manager 단일 소스 기반의 깔끔한 plan path 결정 로직으로 리팩토링"
    detailed:
    - goal: "과도기 하위호환 코드 완전 제거"
      measurable: "task_validator.todolist_path 기반 fallback 로직이 코드에서 제거됨"
    - goal: "status_manager만 사용하는 단일 소스 plan path 결정"
      measurable: "run() 메서드에서 plan path를 status_manager에서만 가져옴"
    - goal: "중복 코드 헬퍼 메서드로 추출"
      measurable: "plan 로드 + todo 수집 + prompt 빌드 로직이 헬퍼 메서드로 추출됨"
    - goal: "task_validator는 validation 용도로만 사용"
      measurable: "task_validator가 plan path 제공 역할을 하지 않음"
  background:
    current_situation: |
      loop.py:100-246 (run() 메서드)에서 plan_path를 결정하는 로직이 다음과 같이 중복 반복됨:

      1. Line 138-160: status_manager에서 plan_path 가져오기 성공
      2. Line 163-185: status_manager는 있지만 current_plan 없을 때 → task_validator로 fallback
      3. Line 190-213: status_manager 예외 발생 시 → task_validator로 fallback
      4. Line 219-240: status_manager 자체가 없을 때 → task_validator로 fallback

      모든 블록에서 동일한 작업:
      - load_plan() 호출
      - plan_doc.work_plans 체크
      - _current_plan_id 설정
      - uncompleted_todos 수집 (완전히 동일)
      - execute_prompt, verify_prompt 빌드
    reason_for_change: |
      - 기술부채 제거: 하위호환 목적의 과도기 코드가 코드 복잡도만 증가
      - 단일 책임 원칙: status_manager가 plan path의 단일 소스여야 함
      - 유지보수성 향상: 중복 코드 제거로 버그 발생 가능성 감소
    changes_to_make: |
      현재 상태 → 변경 후 상태

      | 항목 | 현재 | 변경 후 |
      |------|---------|---------|
      | Plan path 소스 | status_manager + task_validator (fallback) | status_manager만 |
      | 코드 중복 | plan 초기화 로직 4번 반복 | 헬퍼 메서드 1개로 통합 |
      | task_validator 역할 | validation + plan path 제공 | validation만 |
      | 하위호환 | task_validator.todolist_path 지원 | 제거 |
