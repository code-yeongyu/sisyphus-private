# AI TodoList Format v2.1 - Improved Spec
# 개선된 YAML 작업계획서 포맷

# ============================================================================
# METADATA - 문서 자체 정보
# ============================================================================
metadata:
  created_at: "2025-10-31T22:24:00.000000+09:00"
  updated_at: "2025-10-31T22:24:00.000000+09:00"
  format_version: "2.1"

# ============================================================================
# USER REQUEST - 요청 기록
# ============================================================================
user_request:
  original: "Python으로 간단한 TODO CLI 도구 만들기"
  timestamp: "2025-10-31T22:00:00.000000+09:00"
  additional:
    - "Typer를 사용해서 CLI 인터페이스 구현"
    - "SQLite로 데이터 저장"
    - "Rich로 예쁜 출력"

# ============================================================================
# OBJECTIVES - 목표
# ============================================================================
objectives:
  core: "Typer, SQLite, Rich를 활용하여 터미널에서 사용 가능한 TODO 관리 CLI 도구를 구현한다."

  detailed:
    - goal: "Typer 기반 CLI 명령어 시스템 구축"
      measurable: "add, list, done, delete 4개 명령어 구현 완료"

    - goal: "SQLite 데이터베이스 연동"
      measurable: "CRUD 연산 테스트 100% 통과"

    - goal: "Rich 라이브러리로 출력 포맷팅"
      measurable: "테이블 형태로 TODO 목록 출력"

# ============================================================================
# BACKGROUND - 배경 (required_background 통합)
# ============================================================================
background:
  # 기존 background 필드들
  current_situation: |
    현재 프로젝트 디렉토리가 비어있는 상태입니다.
    Python 3.12 환경에서 uv 패키지 매니저를 사용 중입니다.

  reason_for_change: |
    터미널 기반 워크플로우를 선호하는 개발자를 위해
    간단하고 빠른 TODO 관리 도구가 필요합니다.
    기존 웹 기반 도구들은 오버헤드가 크고,
    CLI 도구들은 기능이 부족한 경우가 많습니다.

  changes_to_make: |
    **Before**: 빈 프로젝트
    **After**:
    - todo-cli/ 패키지 디렉토리
    - 4개 주요 명령어 (add, list, done, delete)
    - SQLite 데이터베이스 연동
    - Rich 기반 출력

  # required_background에서 이동한 필드들
  technical_context: |
    **핵심 기술 스택**:
    - Typer: CLI 프레임워크
    - SQLite: 경량 데이터베이스
    - Rich: 터미널 출력 포맷팅

    **아키텍처 제약**:
    - 단일 파일 실행 가능 (standalone)
    - 의존성 최소화
    - 크로스 플랫폼 지원

    **Edge Cases**:
    - 동시 실행 (파일 락)
    - 존재하지 않는 TODO ID
    - 빈 목록 출력

  file_structure: |
    todo-cli/
    ├── __init__.py
    ├── cli.py          # Typer 명령어
    ├── database.py     # SQLite 연동
    └── models.py       # 데이터 모델

    tests/
    └── test_todo.py

# ============================================================================
# SUCCESS VISION - 성공 비전
# ============================================================================
success_vision:
  user_perspective:
    - scenario: "TODO 추가"
      experience: "한 줄 명령어로 즉시 추가 가능"

    - scenario: "목록 확인"
      experience: "예쁜 테이블 형태로 출력"

    - scenario: "완료 표시"
      experience: "ID로 빠르게 완료 처리"

  business_perspective:
    - metric: "개발 생산성"
      target: "TODO 관리 시간 50% 절감"

    - metric: "사용자 만족도"
      target: "CLI 도구 선호도 상승"

  technical_criteria:
    - category: "테스트"
      criteria: "모든 테스트 통과"
      command: "uv run pytest tests/"
      expected: "100% passed"

    - category: "코드 품질"
      criteria: "Lint 에러 0개"
      command: "uv run ruff check todo-cli/"
      expected: "0 errors"

    - category: "타입 안정성"
      criteria: "타입 체크 통과"
      command: "uv run basedpyright todo-cli/"
      expected: "0 errors"

# ============================================================================
# STATUS - 실행 상태
# ============================================================================
