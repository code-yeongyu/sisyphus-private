# ==============================================================================
# CRITICAL TASKS (discovered during execution)
# ==============================================================================
critical_tasks:
  - id: "ct1"
    title: "FIX: Webhook signature verification missing"
    description: |
      SECURITY VULNERABILITY - HIGH SEVERITY

      The Stripe webhook handler does not verify webhook signatures.
      This allows attackers to forge webhook events and manipulate payment status.

      Location: src/payments/webhooks.py:line 34
      Discovered during security review in iteration 2.

      Attack scenario:
      1. Attacker sends fake payment_intent.succeeded event
      2. System marks order as paid without actual payment
      3. Order fulfilled without payment

      Fix required:
      - Use stripe.Webhook.construct_event() with signature verification
      - Validate Stripe-Signature header
      - Implement replay attack prevention

    priority: "critical"
    severity: "high"
    security_impact: true
    blocks_release: true

    discovered_at: "2025-10-21T13:30:00Z"
    discovered_by: "agent_architect"
    discovery_method: "verify_phase_security_review"
    discovery_context: "iteration_2_security_audit"

    status: "completed"
    completion: 1.0
    completed_at: "2025-10-21T14:00:00Z"

    related_task: "t3.3"
    blocks: []

    assignee: "agent_claude"
    estimated_time_hours: 1.0
    actual_time_hours: 0.5

    verification:
      type: "composite"
      operator: "AND"
      checks:
        - type: "command"
          name: "security_test"
          command: "pytest tests/security/test_webhook_signature.py -v"
          expected_exit_code: 0

        - type: "prompt"
          name: "code_review"
          prompt: |
            Verify webhook signature verification:
            1. Uses stripe.Webhook.construct_event()
            2. WEBHOOK_SECRET environment variable required
            3. Signature validation before any processing
            4. Test coverage for signature validation
            5. Test coverage for invalid signature rejection
          llm_check: true

      passed: true
      verified_at: "2025-10-21T14:05:00Z"

    notes:
      - timestamp: "2025-10-21T13:30:00Z"
        author: "agent_architect"
        content: |
          Critical security issue found during verify phase.
          This is a CVSS 8.1 vulnerability (High severity).
          MUST be fixed before release.

      - timestamp: "2025-10-21T13:45:00Z"
        author: "agent_claude"
        content: "Starting fix - implementing signature verification"

      - timestamp: "2025-10-21T14:00:00Z"
        author: "agent_claude"
        content: |
          Fix complete:
          - Added stripe.Webhook.construct_event() call
          - Validates Stripe-Signature header
          - Tests added for valid/invalid signatures
          - Event ID tracking for replay prevention

  - id: "ct2"
    title: "FIX: Missing idempotency key for Stripe API calls"
    description: |
      RELIABILITY ISSUE - MEDIUM SEVERITY

      Payment intent creation does not use idempotency keys.
      Network retries could cause duplicate charges.

      Location: src/payments/stripe_client.py:line 56

      Fix required:
      - Generate idempotency key from cart_id
      - Pass idempotency-key header to Stripe API
      - Store processed keys to prevent duplicates

    priority: "high"
    severity: "medium"
    security_impact: false
    blocks_release: true

    discovered_at: "2025-10-21T13:35:00Z"
    discovered_by: "agent_architect"
    discovery_method: "verify_phase_code_review"

    status: "in_progress"
    completion: 0.3

    related_task: "t3.2"
    assignee: "agent_claude"
    estimated_time_hours: 1.5

    verification:
      type: "composite"
      operator: "AND"
      checks:
        - type: "command"
          command: "pytest tests/test_idempotency.py -v"
          expected_exit_code: 0

        - type: "prompt"
          prompt: |
            Verify idempotency implementation:
            1. Idempotency key generated from cart_id + timestamp
            2. Key passed in Idempotency-Key header
            3. Duplicate request returns cached result
            4. Keys expire after 24 hours
          llm_check: true

      passed: null

