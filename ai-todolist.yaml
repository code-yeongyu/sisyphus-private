# ============================================================================
# SUCCESS VISION - 성공 비전
# ============================================================================
success_vision:
  user_perspective:
    - scenario: "게임 시작"
      experience: "터미널에서 python -m tetris 실행 시 즉시 게임 시작"

    - scenario: "게임 플레이"
      experience: "키보드만으로 직관적인 조작 가능 (←→↑↓ Space)"

    - scenario: "UI 경험"
      experience: "점수, 레벨, 다음 블록이 한눈에 보이는 깔끔한 UI"

    - scenario: "난이도 증가"
      experience: "레벨이 올라갈수록 긴장감 있는 속도 증가"

    - scenario: "재도전"
      experience: "게임 오버 후 r키로 즉시 재시작 가능"

  business_perspective:
    - metric: "포트폴리오 가치"
      target: "Textual 프레임워크 활용 역량 시연"

    - metric: "기술 축적"
      target: "TUI 게임 개발 경험 확보"

    - metric: "오픈소스 기여"
      target: "Textual 예제로 제출 가능"

  technical_criteria:
    - category: "테스트"
      criteria: "모든 게임 로직 테스트 통과"
      command: "uv run pytest tests/tetris/test_game.py"
      expected: "12+ passed"

    - category: "코드 품질"
      criteria: "Lint 에러 0개"
      command: "uv run ruff check tetris/"
      expected: "0 errors"

    - category: "타입 안정성"
      criteria: "타입 체크 통과"
      command: "uv run basedpyright tetris/"
      expected: "0 errors"

    - category: "실행 가능성"
      criteria: "게임 정상 구동"
      command: "uv run python -m tetris"
      expected: "UI 표시 및 입력 반응"

    - category: "성능"
      criteria: "키 입력 반응 지연"
      expected: "< 50ms (Textual 기본 성능)"

    - category: "안정성"
      criteria: "장시간 플레이"
      expected: "1시간 연속 플레이 시 크래시 없음"

# ============================================================================
# FINAL VERIFICATION - 최종 검증
# ============================================================================
final_verification:
  - category: "기능 동작 확인"
    items:
      - id: "final_verify_run"
        description: "게임 실행 확인"
        input:
          type: command
          command: "timeout 5 uv run python -m tetris || true"
          capture_output: true
        verify:
          type: programmatic
          method: exit_code
          expected: 124  # timeout exit code
        note: "5초간 실행 후 타임아웃 (정상 동작)"

      - id: "final_verify_controls"
        description: "모든 키 조작 확인"
        input:
          type: manual
          instructions: |
            게임을 실행하고 다음을 확인하세요:
            - ← → 키로 블록 좌우 이동
            - ↑ 키로 블록 회전
            - ↓ 키로 빠른 낙하
            - Space로 즉시 드롭
            - 자동 낙하 동작 (약 1초)
            - 라인 클리어 시 점수 증가
            - 레벨 업 시 속도 증가
            - 게임 오버 시 r키로 재시작
        verify:
          type: none

  - category: "잘못된 구현 방지"
    items:
      - id: "final_verify_boundaries"
        description: "경계 체크 검증"
        input:
          type: command
          command: "uv run python -c 'from tetris.game import Board, Tetromino; b = Board(); results = [b.is_collision(Tetromino(\"I\", x=x)) for x in [-1, 0, 10, 11]]; print(results)'"
          capture_output: true
        verify:
          type: prompt
          prompt: |
            Verify boundary collision detection.
            Expected: [True, False, True, True]
            (x=-1 and x>=10 should collide, x=0 should not)

            Output: {output}

      - id: "final_verify_rotation"
        description: "회전 충돌 검증"
        input:
          type: prompt
          prompt: |
            Check if rotation properly handles wall/block collisions:
            1. Review GameState.rotate() method in tetris/game.py
            2. Verify it attempts wall kick (±1, ±2 positions)
            3. Confirm rotation is ignored if all wall kick attempts fail

            File: tetris/game.py
          context:
            files: ["tetris/game.py"]
        verify:
          type: llm_judge

  - category: "범위 준수"
    items:
      - id: "final_verify_separation"
        description: "게임 로직과 UI 분리 확인"
        input:
          type: prompt
          prompt: |
            Verify separation of concerns:
            1. tetris/game.py should have NO imports from tetris/ui.py
            2. Game logic (Tetromino, Board, GameState) should be UI-independent
            3. Only tetris/ui.py should import from textual

            Files to check:
            - tetris/game.py
            - tetris/ui.py
          context:
            files: ["tetris/game.py", "tetris/ui.py"]
        verify:
          type: llm_judge

      - id: "final_verify_no_sisyphus_changes"
        description: "Sisyphus 코드 미수정 확인"
        input:
          type: command
          command: "git diff HEAD -- sisyphus/ | wc -l"
          capture_output: true
        verify:
          type: programmatic
          method: exact
          expected: "0"

  - category: "기존 기능 회귀 테스트"
    items:
      - id: "final_verify_sisyphus_help"
        description: "Sisyphus 메인 기능 확인"
        input:
          type: command
          command: "uv run sisyphus --help"
          capture_output: true
        verify:
          type: programmatic
          method: contains
          expected: "sisyphus"

      - id: "final_verify_all_tests"
        description: "전체 테스트 스위트 통과"
        input:
          type: command
          command: "uv run pytest"
          capture_output: true
        verify:
          type: programmatic
          method: contains
          expected: "passed"
        note: "기존 테스트 + 새로운 Tetris 테스트 모두 통과"
