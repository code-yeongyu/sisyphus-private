  created_at: '2025-11-09T01:34:00+09:00'
  updated_at: '2025-11-09T01:45:00+09:00'
work_plans:
- id: flight-simulator
  name: 멀티플레이어 비행 시뮬레이터 구축
  depends_on: []
  user_request:
    original: 여기에 ./backend ./frontend 로 디렉토리 만들어서, 비행시뮬레이터 만들고싶어. 웹소켓 기반으로하고, 맨
      처음에 사용자가 들어오면 닉네임을 색상을 정하게해서, 닉네임을 위에 띄우고 이제 서로 돌아다니는. 맵은 적당히 그냥 초록색 잔디로 
      설정하고 싶고, 경비행기같은걸 몰게하는 그런 느낌이었으면 해
    created_at: '2025-11-09T01:07:00+09:00'
    additional:
    - React + Three.js 사용, 3인칭 뷰
    - 경계 밖으로 나가면 게임 종료, 경계를 시각적으로 명확히 표시
    - TDD 스타일, 모든 컴포넌트 테스트 가능하게 설계
    - 현재 접속 플레이어 수 표시
    - 미니맵 표시
  objectives:
    core: WebSocket 기반 멀티플레이어 비행 시뮬레이터를 TDD 방식으로 구현. React+Three.js 프론트엔드와 
      Node.js+Socket.io 백엔드로 실시간 동기화되는 3D 게임 환경 구축.
    detailed:
    - goal: 실시간 멀티플레이어 동기화 구현
      measurable: 최소 10명 동시 접속, 50ms 이하 위치 동기화 지연
    - goal: TDD 방식으로 핵심 로직 100% 테스트 커버리지 달성
      measurable: 모든 유틸, 컨트롤러, 서비스 로직에 대한 단위 테스트 작성 및 통과
    - goal: 사용자 경험 최적화
      measurable: 경계 시각화, 미니맵, 플레이어 카운트, 닉네임 표시 모두 정상 작동
  background:
    current_situation: 빈 프로젝트 디렉토리(/Users/yeongyu/local-workspaces/flight)에 
      README.md만 존재. Node.js v25.1.0, npm v11.6.2 환경 확인됨.
    reason_for_change: 멀티플레이어 3D 비행 시뮬레이터 게임을 구축하기 위해 전체 아키텍처, 디렉토리 구조, 테스트 환경, 
      프론트/백엔드 코드베이스를 처음부터 설계 및 구현해야 함.
    changes_to_make: 현재 빈 프로젝트 → ./frontend (React+Three.js), ./backend 
      (Node.js+Socket.io) 디렉토리 구조를 만들고, 각각의 패키지 설정, 테스트 환경, 핵심 컴포넌트와 서버 로직을 TDD 
      방식으로 구현하여 완전히 작동하는 멀티플레이어 게임으로 전환.
  required_background:
    description: "이 작업을 수행하려면 다음 기술 스택과 개념에 대한 이해가 필요:\n- **프론트엔드**: React, Three.js,
      React Three Fiber (@react-three/fiber), Vitest, React Testing Library\n- **백엔드**:
      Node.js, Express, Socket.io (WebSocket)\n- **테스트**: TDD (Test-Driven Development),
      단위 테스트, 통합 테스트\n- **3D 그래픽스**: Three.js Scene/Camera/Mesh, 3인칭 카메라 추적, Box3
      경계 감지\n- **멀티플레이어 동기화**: WebSocket 실시간 통신, 클라이언트 예측 + 서버 권한 모델\n- **프로젝트 구조**:
      Monorepo 구조 (./frontend, ./backend 분리)\n\n## 테스트 인프라 전략 (CRITICAL - Blocker
      4 해결)\n- **프로젝트 구조**: ./backend (Jest), ./frontend (Vitest) 분리로 충돌 방지\n- **Three.js
      테스트**: 로직은 순수 함수로 분리하여 Vitest 단위 테스트, 렌더링은 E2E로 검증\n- **@react-three/test-renderer**:
      의존성 추가 필요 (현재 Task 3에서 누락)\n- **happy-dom 한계**: WebGL 미지원, Canvas API 없음 → 수학/로직
      테스트만, 렌더링은 브라우저 E2E\n\n## 보안 메커니즘 (CRITICAL - Blocker 5 해결)\n- **Rate Limiting**:
      Per-socket token bucket (inputUpdate 60 req/s, burst 10)\n- **Session Token**:
      HMAC-SHA256 signed (secret + playerId + timestamp), 1시간 유효\n- **Origin 검증**:
      Socket.io middleware에서 handshake.headers.origin 체크, CORS whitelist\n- **입력 검증**:
      NaN/Infinity 거부, 범위 클램핑 (-1~1), 속도 상한 (100 m/s)\n- **Nickname 보안**: HTML 태그
      제거, 길이 2-20자, 알파벳/숫자/한글만 허용\n\n## 시간 동기화 및 서버 타임라인 (CRITICAL - Blocker 2 해결)\n\
      - **서버 고정 틱**: 60Hz (16.666ms 간격), 단조 증가하는 `tick` (0부터 시작, CRITICAL: 필드명 통일)\n\
      - **초기 Time Sync Handshake**: 클라이언트 접속 시 5회 ping-pong으로 RTT 측정 → clock offset
      계산\n- **주기적 재동기화 (CRITICAL)**: 2초 간격으로 ping 전송, 최근 5개 RTT 중앙값 계산, 이상치 제거 (RTT
      > 500ms 무시)\n- **Drift 보정**: offset에 EMA 적용 (alpha=0.1), 프레임당 최대 5ms 보정으로 급격한
      점프 방지\n- **Fallback**: 연속 5회 ping 실패 → \"서버 연결 불안정\" UI 표시, 연속 10회 실패 → 재접속
      권장\n- **welcome 이벤트**: `{ playerId, sessionToken, serverTimeMs, tick, mapBounds
      }` 포함 (CRITICAL: sessionToken과 tick 필드명 통일)\n- **stateSnapshot 이벤트**: 항상 `tick`,
      `serverTimeMs` 필드 포함 (필수)\n- **클라이언트 보간**: `latestTick - bufferTicks` 기준 (bufferTicks
      ≈ 80ms * 60Hz = 5 ticks)\n- **서버 물리 루프**: Fixed timestep accumulator로 지터 방지\n"
    file_structure: "flight/\n├── shared/                   # 공유 물리 모듈 (CRITICAL)\n\
      │   ├── physics.js            # 공통 물리 시뮬레이션 (Semi-implicit Euler)\n│   ├── constants.js\
      \          # 물리 상수 (gravity, airResistance, maxSpeed)\n│   └── mathUtils.js\
      \          # 수학 유틸 (quaternion 연산 등)\n├── frontend/                 # React
      + Three.js 프론트엔드\n│   ├── public/\n│   ├── src/\n│   │   ├── components/   \
      \    # UI 컴포넌트 (GameCanvas, Minimap, PlayerCount 등)\n│   │   ├── scenes/   \
      \        # Three.js 씬 로직 (MainScene, PlayerPlane 등)\n│   │   ├── services/ \
      \        # socketService (WebSocket 클라이언트)\n│   │   ├── state/            #
      Redux or Context API\n│   │   ├── utils/            # 유틸리티 (threeUtils, boundaryCheck
      등)\n│   │   ├── App.jsx\n│   │   └── main.jsx\n│   ├── tests/              \
      \  # 모든 테스트 파일\n│   ├── package.json\n│   └── vite.config.js\n├── backend/ \
      \                 # Node.js + Socket.io 백엔드\n│   ├── src/\n│   │   ├── controllers/\
      \      # gameController (join, move, bounds)\n│   │   ├── models/          \
      \ # Player 모델\n│   │   ├── middleware/       # socketAuth (보안 미들웨어)\n│   │ \
      \  ├── services/         # socketService (WebSocket 서버)\n│   │   ├── utils/\
      \            # gameUtils (경계 체크, 색상 생성 등)\n│   │   └── server.js\n│   ├── tests/\
      \                # 백엔드 테스트\n│   └── package.json\n└── README.md\n"
    references: []
  workflow:
    dependency_diagram: "1 (프로젝트 초기화)\n   ↓\n2 (백엔드 기본 구조) || 3 (프론트엔드 기본 구조)\n  \
      \ ↓                         ↓\n4 (백엔드 Player 모델) || 5 (프론트 유틸리티)\n   ↓     \
      \                    ↓\n6 (백엔드 gameUtils)   || 7 (프론트 씬 구조)\n   ↓          \
      \               ↓\n8 (Socket.io 서버 설정) || 9 (Socket.io 클라이언트)\n   ↓        \
      \                 ↓\n10 (게임 컨트롤러)      || 11 (Three.js 메인 씬)\n   ↓         \
      \                ↓\n12 (실시간 동기화 로직) || 13 (UI 컴포넌트)\n   ↓                  \
      \       ↓\n14 (통합 테스트)\n   ↓\n15 (최종 검증 및 문서화)\n"
    critical_path:
    - 1 → 2 → 4 → 6 → 8 → 10 → 12 → 14 → 15
  success_vision:
    user_perspective:
    - scenario: 사용자가 브라우저에서 게임 접속
      experience: 닉네임과 색상을 입력 후, 초록색 잔디 맵 위에서 경비행기를 조종. 다른 플레이어들이 실시간으로 이동하는 모습이
        보이고, 화면에 미니맵과 플레이어 수가 표시됨.
    - scenario: 사용자가 경계 근처로 이동
      experience: 반투명 빨간색 경계선이 보여 경계를 명확히 인식. 경계를 넘으면 즉시 '게임 종료' 메시지 팝업.
    business_perspective:
    - metric: 동시 접속자 수
      target: 최소 10명 이상 동시 접속 가능, 지연 없이 동기화
    - metric: 테스트 커버리지
      target: 핵심 로직(유틸, 컨트롤러, 서비스) 90% 이상 커버리지
    technical_criteria:
    - category: 프론트엔드 빌드
      criteria: Vite 빌드 에러 없이 완료
      command: cd frontend && npm run build
      expected: dist/ 디렉토리 생성, 빌드 성공
    - category: 백엔드 서버 실행
      criteria: 포트 3001에서 Socket.io 서버 정상 실행
      command: cd backend && npm start
      expected: Server listening on port 3001
    - category: 전체 테스트 통과
      criteria: 모든 단위/통합 테스트 통과
      command: cd backend && npm test && cd ../frontend && npm test
      expected: All tests passed
  final_verification:
  - id: final-1
    title: 전체 애플리케이션 E2E 검증
    category: Integration
    description: 백엔드+프론트엔드 실행 후 브라우저에서 전체 기능 동작 확인. 2개 탭에서 멀티플레이어 테스트, 미니맵/플레이어 
      카운트 표시 확인, 경계 초과 시 게임 종료 확인.
    verified: false
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash: []
    llm_judge:
    - by: orchestrator-agent
      context_commands:
      - cd backend && npm start
      - cd frontend && npm run dev
      instruction: "다음 확인:\n1. 백엔드 서버 실행 (포트 3001)\n2. 프론트엔드 dev 서버 실행\n3. 브라우저 2개
        탭에서 각각 접속\n4. 한 탭 이동 시 다른 탭 실시간 반영 확인\n5. 미니맵 2개 점 표시 확인\n6. 플레이어 카운트 \"2명\"\
        \ 표시\n7. 경계 밖 이동 시 \"게임 종료\" 모달 확인\n"
  - id: final-2
    title: 전체 테스트 스위트 통과
    category: Testing
    description: 프론트엔드, 백엔드 모든 테스트 통과 확인
    verified: false
