name: Sisyphus Agent

on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
        description: 'GitHub run ID for artifact retrieval'
      pr_number:
        required: false
        type: string
      issue_number:
        required: false
        type: string
      branch:
        required: false
        type: string
      sha:
        required: false
        type: string
        description: 'Commit SHA'
      requested_user:
        required: false
        type: string
        description: 'User who requested the action'
      model_name:
        required: false
        type: string
        description: 'Claude Code Model Name'
    secrets:
      ANTHROPIC_BASE_URL:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      SISYPHUS_APP_ID:
        required: true
      SISYPHUS_APP_PRIVATE_KEY:
        required: true

jobs:
  sisyphus-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.SISYPHUS_APP_ID }}
          private-key: ${{ secrets.SISYPHUS_APP_PRIVATE_KEY }}
      - name: Setup GitHub CLI authentication
        run: |
          echo "${{ steps.generate-token.outputs.token }}" | gh auth login --with-token
          gh auth status

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          ls -la ~/.local/bin/claude || echo "Claude binary not found!"
          which claude || echo "Claude not in PATH!"

      - name: Ensure Claude Code in PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Verify claude is accessible
          claude --version || echo "Claude command failed!"

      - name: Setup Claude Code configuration
        run: |
          if [ -d ".github/workflows/.claude" ]; then
            # Copy to user config (~/.claude)
            mkdir -p ~/.claude
            cp -r .github/workflows/.claude/* ~/.claude/
            echo "Copied .claude configuration to ~/.claude"
            ls -la ~/.claude
          else
            echo "No .github/workflows/.claude directory found, skipping configuration copy"
          fi


      - name: Setup Sisyphus Claude Code Plugin
        run: |
          claude plugin marketplace add ./
          claude plugin install essentials@sisyphus-marketplace

      - name: Download Append Prompt Artifact
        uses: actions/download-artifact@v4
        with:
          name: append-prompt-${{ inputs.run_id }}
          path: /tmp

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.0

      - name: Cache global npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Configure git
        run: |
          git config user.name "Sisyphus"
          git config user.email "sisyphus@mengmota.com"

      - name: Get Bun Path to use
        id: bun_path
        run: |
          BUN_PATH=$(which bun)
          echo "BUN_PATH=$BUN_PATH" >> $GITHUB_OUTPUT
          echo "Bun executable path: $BUN_PATH"

      - name: Get Claude Code Path to use
        id: claude_code_path
        run: |
          CLAUDE_CODE_PATH=$(which claude)
          echo "CLAUDE_CODE_PATH=$CLAUDE_CODE_PATH" >> $GITHUB_OUTPUT
          echo "Claude Code executable path: $CLAUDE_CODE_PATH"

      - name: Build System Prompt
        id: build_system_prompt
        run: |
          {
            echo "system_prompt<<EOF"
            cat .github/sisyphus-prompts/system.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build User Prompt
        id: build_user_prompt
        run: |
          echo "📝 Building final prompt from user.md + append_prompt..."

          # Read append prompt from file
          APPEND_PROMPT=$(cat /tmp/append_prompt.txt)

          # Save to output using heredoc - combine all prompts
          {
            echo "FINAL_PROMPT<<EOFMARKER"
            cat .github/sisyphus-prompts/user.md
            echo ""
            echo ""
            printf '%s\n' "${APPEND_PROMPT}"
            echo "EOFMARKER"
          } >> $GITHUB_OUTPUT

          echo "✅ Final prompt built successfully"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.13
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          bot_name: "Sisyphus - Claude"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          track_progress: false
          use_sticky_comment: false
          path_to_bun_executable: ${{ steps.bun_path.outputs.BUN_PATH }}
          path_to_claude_code_executable: ${{ steps.claude_code_path.outputs.CLAUDE_CODE_PATH }}

          claude_args: |
            --system-prompt "${{ steps.build_system_prompt.outputs.system_prompt }}"
            --dangerously-skip-permissions

          prompt: |
            ${{ steps.build_user_prompt.outputs.FINAL_PROMPT }}
