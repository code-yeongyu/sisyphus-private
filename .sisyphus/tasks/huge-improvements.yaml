        ```python
        from rich.progress import Progress, BarColumn, TextColumn
        from pathlib import Path
        import typer

        def status(
            path: Path | None = typer.Option(None, "--path", "-p"),
            cwd: str | None = typer.Option(None, "--cwd"),
        ) -> None:
            async def _status() -> None:
                working_dir = resolve_cwd(cwd)

                if path:
                    # 특정 파일 지정
                    plan_doc = await load_plan_from_path(path)
                    work_plan = plan_doc.work_plans[0]
                else:
                    # 현재 plan
                    plan_doc, work_plan, task_manager = await _load_current_plan(working_dir)

                # 진행률 계산
                total_todos = _count_all_todos(work_plan.todos)
                completed_todos = _count_completed_todos(work_plan.todos)
                progress_pct = (completed_todos / total_todos * 100) if total_todos > 0 else 0

                # Progress Bar 출력
                with Progress(
                    TextColumn("[bold blue]{task.description}"),
                    BarColumn(),
                    TextColumn("[progress.percentage]{task.percentage:>3.0f}%"),
                ) as progress:
                    task = progress.add_task(f"Plan: {work_plan.name}", total=total_todos)
                    progress.update(task, completed=completed_todos)

                # 상태 정보 출력
                console.print(f"Total Tasks: {total_todos}")
                console.print(f"Completed: {completed_todos}")
                console.print(f"Progress: {progress_pct:.1f}%")
                console.print(f"Fully Done: {work_plan.execution.fully_done_at is not None}")

                # 검증 상태 테이블 (기존 기능 유지)
                _display_verification_status_table(work_plan, task_manager, show_current_task=True)

            _run_async(_status())
        ```
