objectives:
  core: "Textual TUI 프레임워크를 활용하여 클래식 Tetris 게임을 구현하고, 터미널에서 플레이 가능한 완전한 게임을 제공한다."

  detailed:
    - goal: "7가지 Tetromino 블록 타입 구현 및 4방향 회전 로직 완성"
      measurable: "모든 블록(I,O,T,S,Z,J,L) 회전 테스트 통과"

    - goal: "10x20 게임 보드에서 블록 이동, 충돌 감지, 고정 처리"
