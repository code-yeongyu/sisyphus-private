version: '3.0'
metadata:
  created_at: '2025-11-10T04:48:00Z'
  updated_at: '2025-11-10T04:48:00Z'
work_plans:
- id: status-json-single-source-of-truth
  name: status.json을 Single Source of Truth로 만드는 리팩토링
  depends_on: []
  user_request:
    original: 전체가 작업을 status.json 을 통해서 현재 작업을 가져올 수 있도록 하는 작업계획을 구체적이고 상세하게 
      step by step 으로 세워줘
    created_at: '2025-11-10T04:48:00Z'
    additional:
    - sisyphus work 와 sisyphus task continue 가 status.json을 통해 동기화되어야 함
    - ExecutionLoop이 status.json에서 plan_id를 읽어야 함
    - 'sessions.json 구조를 {agent: {plan_id: {session}}} 형태로 수정'
    - 하위 호환성 유지 (status_manager=None일 때 fallback)
  objectives:
    core: status.json을 시스템 전체의 현재 작업 추적을 위한 유일한 진실 공급원으로 만들어, ExecutionLoop가 
      status.json → YAML 순서로 plan_id를 가져오도록 변경
    detailed:
    - goal: sisyphus work가 status.json을 읽고 쓰도록 수정
      measurable: work._detect_plan_path()가 status.json 우선 확인 후 선택한 plan을 
        status.json에 기록
    - goal: ExecutionLoop.run()이 status.json에서 plan_id를 읽도록 수정
      measurable: ExecutionLoop.__init__에 status_manager 파라미터 추가, run()에서 
        status.json 우선 읽기
    - goal: 'sessions.json 구조를 {agent: {plan_id: {session}}} 형태로 변경'
      measurable: 마이그레이션 스크립트로 기존 sessions.json 변환, SessionStore 로직 검증
    - goal: sisyphus work와 sisyphus task continue가 같은 plan을 추적
      measurable: 통합 테스트로 work → task continue 흐름에서 plan 일치 확인
  background:
    current_situation: "현재 상황:\n1. sisyphus task continue: status.json 사용 ✅ (task.py:252-280에서
      StatusManager로 읽기/쓰기)\n2. sisyphus work: status.json 완전히 무시 ❌ (work.py가 StatusManager
      사용 안 함)\n3. ExecutionLoop: YAML에서 직접 plan_id 추출 ❌ (loop.py:121-144, task_validator.todolist_path
      직접 로드)\n4. sessions.json 파일: Legacy 구조 ({agent: {session}}) ❌\n   - 코드(session.py:143):
      {agent: {plan_id: {session}}} 구조로 설계됨 ✅\n   - 실제 파일(.sisyphus/sessions/sessions.json):
      {claude: {session_id, updated}} 형태로 저장됨 ❌\n   - 원인: 커밋 e8fc7e5 이전에 생성된 legacy
      파일이 그대로 남아있음\n\n실제 시나리오:\n- task continue로 plan-A 선택 → status.json 기록\n- work
      실행 → status.json 무시, YAML 경로만으로 plan 선택 (plan-B 가능)\n- task continue 재실행 → 여전히
      plan-A (불일치!)\n- sessions.json: plan_id 없이 agent별로만 session 저장 → 다중 plan 세션
      관리 불가\n"
    reason_for_change: "이 불일치는 사용자 경험을 해치는 심각한 문제:\n- 두 명령어가 서로 다른 plan 추적 → 사용자 혼란\n\
      - ExecutionLoop이 status.json 무시 → 단일 진실 공급원(Single Source of Truth) 원칙 위배\n\
      - sessions.json 구조 불일치 → 다중 plan 환경에서 세션 충돌 (plan-A와 plan-B가 같은 session 공유)\n\
      \nArchitectural Decision:\n현재 ExecutionLoop은 task_validator를 통해 plan_id를 얻습니다
      (loop.py:121-144).\n이 방식의 문제:\n- work.py가 plan 선택 → ExecutionLoop에 YAML 경로만
      전달 → ExecutionLoop이 YAML 재파싱하여 plan_id 추출\n- status.json 업데이트 주체가 불명확 (work.py가
      해야 하는가, ExecutionLoop이 해야 하는가?)\n- task continue는 StatusManager로 status.json
      관리, work는 무시 → 불일치\n\n대안 검토:\n1. task_validator에 status.json 읽기 추가 → TaskValidator의
      책임 범위 초과 (validation과 무관)\n2. 별도의 PlanResolver 생성 → 과도한 추상화 (단일 책임만 수행)\n3.
      ExecutionLoop에 status_manager 직접 전달 → ✅ 선택\n\n선택 근거:\nExecutionLoop이 현재 작업 컨텍스트(어떤
      plan을 실행 중인지)를 직접 알아야 하므로, \nstatus_manager를 의존성 주입하는 것이 적절합니다. \nwork.py와 task.py
      모두 ExecutionLoop 생성 시 status_manager를 전달하면 \n두 명령어가 자연스럽게 동기화됩니다.\n"
    changes_to_make: "현재: status.json 무시, YAML 직접 로드, sessions.json 구조 불일치\n→ 미래:
      status.json 우선 읽기, 일관된 구조, task/work 동기화, 다중 plan 세션 관리\n"
  required_background:
    description: "Python 3.12+, Typer CLI, Textual TUI, anyio 비동기, YAML v3.0 WorkPlan
      형식\n- sisyphus/core/loop.py: ExecutionLoop, run() 메서드\n- sisyphus/cli/work.py:
      work 명령, _detect_plan_path()\n- sisyphus/core/status/manager.py: StatusManager\n\
      - sisyphus/core/session.py: SessionStore\n"
    references:
    - ref_id: ref-loop-py
      uri: projects/sisyphus-cli/sisyphus/core/loop.py
    - ref_id: ref-work-py
      uri: projects/sisyphus-cli/sisyphus/cli/work.py
    - ref_id: ref-status-manager
      uri: projects/sisyphus-cli/sisyphus/core/status/manager.py
    - ref_id: ref-session-py
      uri: projects/sisyphus-cli/sisyphus/core/session.py
  workflow:
    dependency_diagram: "Phase 0: 준비 (마이그레이션 스크립트, 테스트 baseline)\n   ↓\nPhase 1: ExecutionLoop
      리팩토링 (status_manager 추가)\n   ↓\nPhase 2: work.py 리팩토링 (_detect_plan_path, StatusManager
      전달)\n   ↓\nPhase 3: 테스트 수정 (MockStatusManager, 35개 파일)\n   ↓\nPhase 4: 통합 테스트
      (work + task continue 동기화)\n   ↓\nPhase 5: 문서화 (마이그레이션 가이드)\n"
    critical_path:
    - 'Phase 1-2: ExecutionLoop과 work.py 수정이 핵심'
    - 'Phase 3: 테스트 수정이 가장 시간 소요'
    - 'Phase 2.1: _detect_plan_path() 수정이 work/task 동기화의 핵심'
  success_vision:
    user_perspective:
    - scenario: 사용자가 sisyphus task continue로 plan-A 선택
      experience: status.json에 plan-A 기록 → sisyphus work 실행 시 자동으로 plan-A 사용 → 
        일관성 유지
    - scenario: 사용자가 sisyphus work로 plan-B 선택 (다중 plan 환경)
      experience: work가 status.json 업데이트 → task continue 실행 시 plan-B 사용 → 동기화됨
    - scenario: 개발자가 기존 코드 사용 (status_manager 없이 ExecutionLoop 생성)
      experience: fallback으로 기존 task_validator 방식 동작 → 하위 호환성 유지
    business_perspective: []
    technical_criteria:
    - category: Data Consistency
      criteria: task continue와 work가 항상 동일한 plan 추적
      expected: status.json을 유일한 진실 공급원으로 사용
    - category: Session Management
      criteria: 'sessions.json이 {agent: {plan_id: {session}}} 구조'
      expected: 다중 plan 세션 관리 가능
    - category: Backward Compatibility
      criteria: status_manager=None일 때 기존 동작 유지
      expected: 기존 테스트 및 사용자 코드 영향 없음
