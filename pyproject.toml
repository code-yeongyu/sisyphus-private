[project]
name = "sisyphus-workspace"
version = "0.1.0"
requires-python = ">=3.12"
description = "Sisyphus monorepo workspace"

[tool.uv.workspace]
members = ["projects/*"]

[dependency-groups]
dev = [
    "basedpyright>=1.31.6",
    "pytest>=8.4.2",
    "pytest-anyio>=0.0.0",
    "ruff>=0.14.0",
]
