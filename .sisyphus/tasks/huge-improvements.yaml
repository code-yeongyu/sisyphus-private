        1. 검증사항 상세 출력 (어떤 검증이 어떻게 되어있는지)
        2. Relative path 출력 (절대 경로 대신)
        3. 하위작업(children) 상세 출력
        4. 참조(references) resolve하여 출력

        File: projects/sisyphus-speckit/sisyphus_speckit/task/show.py (기존 파일 수정)

        현재 구현:
        - projects/sisyphus-speckit/sisyphus_speckit/task/show.py:1-32

        Enhancement:
        ```python
        def show_task(
            task_id: str = typer.Argument(...),
            rich: bool = typer.Option(False, "--rich"),
            cwd: str | None = typer.Option(None, "--cwd"),
        ) -> None:
            async def _show() -> None:
                working_dir = resolve_cwd(cwd)
                plan_doc, work_plan, task_manager = await _load_current_plan(working_dir)

                task = task_manager.find_todo_by_id(task_id)
                if task is None:
                    console.print(f"[red]작업 ID를 찾을 수 없습니다: {task_id}[/red]")
                    raise typer.Exit(1)

                # 기존 기본 정보 출력...

                # 1. Verification Spec 상세 (기존보다 더 자세히)
                if task.verification_spec:
                    console.print("\n[bold cyan]Verification Specifications:[/bold cyan]")
                    for vspec in task.verification_spec:
                        console.print(f"  [{vspec.id}] {vspec.title}")
                        console.print(f"    Status: {'✓ Verified' if vspec.verified else '✗ Not Verified'}")
                        if vspec.bash:
                            console.print(f"    Bash checks: {len(vspec.bash)}")
                        if vspec.llm_judge:
                            console.print(f"    LLM judges: {len(vspec.llm_judge)}")

                # 2. Children (하위작업) 상세
                if task.children:
                    console.print("\n[bold cyan]Sub-tasks:[/bold cyan]")
                    _display_children_recursively(task.children, indent=1)

                # 3. References (resolve하여 출력)
                if task.references:
                    console.print("\n[bold cyan]References:[/bold cyan]")
                    for ref in task.references:
                        if ref.ref_id:
                            # resolve global reference
                            global_ref = _resolve_reference(ref.ref_id, work_plan.references)
                            if global_ref:
                                console.print(f"  - [{ref.ref_id}]: {global_ref.uri or global_ref.inline[:100]}")
                        elif ref.uri:
                            console.print(f"  - URI: {ref.uri}")
                        elif ref.inline:
                            console.print(f"  - Inline: {ref.inline[:100]}...")

                # 4. File Path (relative)
                plan_file_path = task_manager.get_plan_file_path()  # 절대 경로
                relative_path = plan_file_path.relative_to(Path.cwd())
                console.print(f"\n[bold cyan]Plan File:[/bold cyan] {relative_path}")

            _run_async(_show())

        def _display_children_recursively(children, indent=0):
            for child in children:
                prefix = "  " * indent
                console.print(f"{prefix}- [{child.id}] {child.title} ({child.status})")
                if child.children:
                    _display_children_recursively(child.children, indent+1)

        def _resolve_reference(ref_id, global_refs):
            for ref in global_refs:
                if ref.ref_id == ref_id:
                    return ref
            return None
        ```
