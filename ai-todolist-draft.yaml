# SUCCESS VISION - 성공 비전
# ============================================================================
success_vision:
  user_perspective:
    - scenario: "TODO 추가"
      experience: "한 줄 명령어로 즉시 추가 가능"

    - scenario: "목록 확인"
      experience: "예쁜 테이블 형태로 출력"

    - scenario: "완료 표시"
      experience: "ID로 빠르게 완료 처리"

  business_perspective:
    - metric: "개발 생산성"
      target: "TODO 관리 시간 50% 절감"

    - metric: "사용자 만족도"
      target: "CLI 도구 선호도 상승"

  technical_criteria:
    - category: "테스트"
      criteria: "모든 테스트 통과"
      command: "uv run pytest tests/"
      expected: "100% passed"

    - category: "코드 품질"
      criteria: "Lint 에러 0개"
      command: "uv run ruff check todo-cli/"
      expected: "0 errors"

    - category: "타입 안정성"
      criteria: "타입 체크 통과"
      command: "uv run basedpyright todo-cli/"
      expected: "0 errors"

# ============================================================================
# FINAL VERIFICATION - 최종 검증
# ============================================================================
final_verification:
  - category: "기능 동작 확인"
    items:
      - id: "final_verify_cli"
        description: "CLI 실행 확인"
        input:
          type: command
          command: "uv run python -m todo_cli --help"
          capture_output: true
        verify:
          type: programmatic
          method: contains
          expected: "Usage:"

      - id: "final_verify_e2e"
        description: "E2E 테스트"
        input:
          type: manual
          instructions: |
            전체 워크플로우 테스트:
            1. todo add "Task 1"
            2. todo add "Task 2"
            3. todo list
            4. todo done 1
            5. todo delete 2
        verify:
          type: none

  - category: "잘못된 구현 방지"
    items:
      - id: "final_verify_edge_cases"
        description: "엣지 케이스 확인"
        input:
          type: multi_command
          commands:
            - "uv run python -m todo_cli list  # Empty list"
            - "uv run python -m todo_cli done 9999  # Non-existent ID"
        verify:
          type: programmatic
          method: exit_code
          expected: 1

  - category: "범위 준수"
    items:
      - id: "final_verify_no_extra_deps"
        description: "불필요한 의존성 없는지 확인"
        input:
          type: command
          command: "uv pip list"
          capture_output: true
        verify:
          type: prompt
          prompt: |
            Check dependencies list.
            Should only contain: typer, rich, click (typer dependency)
            No extra packages.

  - category: "기존 기능 회귀 테스트"
    items:
      - id: "final_verify_all_tests"
        description: "전체 테스트 스위트"
        input:
          type: command
          command: "uv run pytest tests/ -v"
          capture_output: true
        verify:
          type: programmatic
          method: regex
          expected: "\\d+ passed"
        note: "모든 테스트가 통과해야 함"
