         ↓
      4 (테스트 작성: WorkPlan required 검증)
         ↓
      5 (테스트 작성: 4개 미만 에러 검증) || 6 (기존 테스트 수정)
         ↓
      7 (모든 테스트 실행 및 통과 확인)
         ↓
      7.1 (Commit: 테스트 추가 및 수정)
         ↓
      8 (backend.yaml 예제 업데이트)
         ↓
      9 (테스트 작성: 템플릿 4개 검증)
         ↓
      9.1 (Commit: 템플릿 및 예제 업데이트)
         ↓
      10 (최종 통합 테스트)
         ↓
      10.1 (Commit: 통합 테스트 및 문서 업데이트)

    critical_path:
      - '1'
      - '2'
      - '3'
      - '3.1'
      - '7'
      - '7.1'
      - '10'
      - '10.1'

  success_vision:
    user_perspective:
      - scenario: "개발자가 acceptance_criteria_for_verification_agent 없이 계획서 작성"
        experience: "sisyphus-speckit plan lint 실행 시 명확한 에러 메시지: 'Missing required field: acceptance_criteria_for_verification_agent'"
      - scenario: "개발자가 acceptance_criteria_for_verification_agent 3개만 작성"
        experience: "lint 에러: 'acceptance_criteria_for_verification_agent must have at least 4 items (actual: 3)'"
      - scenario: "개발자가 sisyphus-speckit plan init --template full 실행"
        experience: "생성된 YAML에 4개 이상의 체크리스트가 포함된 빡빡한 acceptance_criteria_for_verification_agent 예제"

    business_perspective:
      - metric: "계획서 품질"
        target: "모든 계획서가 4개 이상의 명확한 검증 기준 포함"
      - metric: "하위 호환성"
        target: "breaking change이지만 명확한 에러 메시지로 마이그레이션 유도"

    technical_criteria:
      - category: "린터 검증"
        criteria: "acceptance_criteria_for_verification_agent required 검증"
        command: "pytest tests/core/test_plan_linter_acceptance_criteria.py::TestRequiredField -v"
        expected: "100% 테스트 통과"
      - category: "린터 검증"
        criteria: "acceptance_criteria_for_verification_agent 최소 4개 검증"
        command: "pytest tests/core/test_plan_linter_acceptance_criteria.py::TestMinimumFourItems -v"
        expected: "100% 테스트 통과"
      - category: "템플릿 생성"
        criteria: "full_example()이 4개 이상 체크리스트 생성"
        command: "pytest tests/core/plans/test_template.py::test_full_example_has_four_checklists -v"
        expected: "테스트 통과"

  final_verification:
    - id: 'final-1'
      title: '모든 단위 테스트 통과'
      category: 'Testing'
      description: 'sisyphus-core의 모든 테스트가 통과해야 함'
      verified: false
      verified_at: null
      verification_evidence: null
      orchestrator_manually_verified: false
      manual_verification_evidence: ''
      bash:
