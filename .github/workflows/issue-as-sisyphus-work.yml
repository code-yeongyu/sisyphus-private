name: Sisyphus Work From Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.SISYPHUS_APP_ID }}
          private-key: ${{ secrets.SISYPHUS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.0

      - name: Cache global npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          ls -la ~/.local/bin/claude || echo "Claude binary not found!"
          which claude || echo "Claude not in PATH!"

      - name: Ensure Claude Code in PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Verify claude is accessible
          claude --version || echo "Claude command failed!"

      - name: Setup Claude Code configuration
        run: |
          if [ -d ".github/workflows/.claude" ]; then
            # Copy to user config (~/.claude)
            mkdir -p ~/.claude
            cp -r .github/workflows/.claude/* ~/.claude/
            echo "Copied .claude configuration to ~/.claude"
            ls -la ~/.claude
          else
            echo "No .github/workflows/.claude directory found, skipping configuration copy"
          fi

      - name: Setup GitHub CLI authentication
        run: |
          echo "${{ steps.generate-token.outputs.token }}" | gh auth login --with-token
          gh auth status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync project dependencies
        run: |
          uv sync

      - name: Create ai-todolist.md from issue
        run: |
          cat > ai-todolist.md << 'EOF'
          # Task from Issue #${{ github.event.issue.number }}

          **Title:** ${{ github.event.issue.title }}

          **Description:**
          ${{ github.event.issue.body }}

          ---
          EOF

          cat ai-todolist.md
      - name: Setup Sisyphus Claude Code Plugin
        run: |
          claude plugin marketplace add ./
          claude plugin install essentials@sisyphus-marketplace

      - name: Run Sisyphus
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run sisyphus work --no-tui
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLI_PATH: ${{ env.HOME }}/.local/bin/claude
        continue-on-error: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push branch with changes
        run: |
          # Create a new branch for this issue
          BRANCH_NAME="sisyphus/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"

          # Add all changes
          git add .

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          git commit -m "feat: implement solution for issue #${{ github.event.issue.number }}

          ${{ github.event.issue.title }}"

          # Push to origin
          git push -u origin "$BRANCH_NAME"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Create Pull Request via Claude Code
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude --dangerously-skip-permissions \
          "create PR of this, using gh cli. Title should be 'Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}' and include reference to issue #${{ github.event.issue.number }} using GH CLI. No Ask to me, you are  a fully automated system, just CREATE PULL REQUEST."
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Comment on issue
        if: success()
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "🤖 Automated PR has been created via Sisyphus workflow!"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sisyphus-logs
          path: |
            logs/
            ai-todolist.md
          retention-days: 7
