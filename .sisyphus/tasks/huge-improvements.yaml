        from ruamel.yaml import YAML
        from ruamel.yaml.scalarstring import LiteralScalarString

        def lint_plan(
            file_path: Path = typer.Option(...),
            fix: bool = typer.Option(False, "--fix"),
            cwd: str | None = typer.Option(None, "--cwd"),
        ) -> None:
            # 기존 lint 로직...

            if fix:
                # multiline 텍스트를 pipeline(|) 형식으로 변환
                yaml_data = _fix_multiline_texts(yaml_data)

                # evidence 필드 등 누락된 필수 필드 추가
                yaml_data = _add_missing_fields(yaml_data)

                # 파일 저장
                with resolved_path.open("w", encoding="utf-8") as f:
                    yaml.dump(yaml_data, f)

                console.print(f"[green]✓ Fixed and saved to {resolved_path}[/green]")

        def _fix_multiline_texts(data: dict) -> dict:
            # 재귀적으로 모든 multiline string을 LiteralScalarString으로 변환
            if isinstance(data, dict):
                for key, value in data.items():
                    if isinstance(value, str) and '\n' in value:
                        data[key] = LiteralScalarString(value)
                    elif isinstance(value, (dict, list)):
                        data[key] = _fix_multiline_texts(value)
            elif isinstance(data, list):
                return [_fix_multiline_texts(item) for item in data]
            return data

