              PhaseOrchestrator 클래스 책임:

              **의존성:**
              - execute_agent: Agent
              - verify_agent: Agent (required)
              - ui: UIProtocol
              - session_store: SessionStore
              - logger_factory: LoggerFactory
              - state: LoopState (DI)

              **메서드:**

              1. **async execute_phase(prompt: str, extra: str | None) -> None**
                 - 세션 재개 시도 (3회 실패 시 삭제)
                 - consume_stream + monitor_input 동시 실행
                 - 에러 처리:
                   * SessionLimitError → sleep_until_reset
                   * SDK 오류 → state.increment_sdk_exception, 세션 삭제
                   * 기타 예외 → state.increment_execute_resume_fail
                 - 인터럽트/재개 처리
                 - 세션 ID 동기화

              2. **async verify_phase(prompt: str, extra: str | None) -> tuple[str, bool]**
                 - 항상 신규 세션
                 - consume_stream + monitor_input 동시 실행
                 - FULLY_DONE 판단 로직
                 - Acceptance Criteria 검증
                 - Judgment 재시도 (최대 5회)
                 - 에러 처리 (Execute와 동일 패턴)

