    - inline: "파일: projects/sisyphus-cc-hooks/sisyphus_cc_hooks/post_tool_use.py\n\
        라인: 64\n\n현재 이슈:\n```python\nreturn await anyio.to_thread.run_sync(_run) \
        \ # type: ignore\n```\n- reportUnknownVariableType: Return type is unknown\n\
        - reportUnknownMemberType: Type of \"run_sync\" is unknown\n\n해결 방법:\n```python\n\
        from typing import cast\n\nresult = await anyio.to_thread.run_sync(_run)\n\
