  - id: '6'
    title: Socket.io 서버/클라이언트 설정 (TDD, CRITICAL - Blocker 5 해결)
    description: "백엔드: socketService.js (connection, disconnect, joinGame, inputUpdate
      이벤트 핸들러). 프론트: socketService.js (welcome, stateSnapshot, playerJoined, playerLeft,
      outOfBounds, pong 리스너). 보안: Socket.io 미들웨어에서 origin 검증, rate limiting (per-socket
      token bucket 60 req/s), session token HMAC 검증. **CRITICAL Rate Limiting 적용**:
      모든 client→server 이벤트(joinGame, inputUpdate, requestSnapshot, resume, ping)에
      핸들러 시작 부분에서 `if (!checkRateLimit(socket.id)) { socket.emit('error', {code: 'RATE_LIMIT'});
      return; }` 체크 추가. Message 크기 제한 (1KB), schema 검증(joi/zod). TDD: 이벤트 목킹 테스트 작성."
    status: pending
    children: []
    references:
    - ref_id: ref-socketio-docs
    - inline: "// backend/src/middleware/socketAuth.js - CRITICAL: ESM only\n\nimport
        crypto from 'crypto';\n\n// HMAC Session Token\nconst SECRET = process.env.SESSION_SECRET
        || 'your-secret-key';\n\nexport function generateSessionToken(playerId) {\n\
        \  const timestamp = Date.now();\n  const payload = `${playerId}:${timestamp}`;\n\
        \  const hmac = crypto.createHmac('sha256', SECRET)\n    .update(payload)\n\
        \    .digest('hex');\n  return `${payload}:${hmac}`;\n}\n\nexport function
        verifySessionToken(token) {\n  const [playerId, timestamp, hmac] = token.split(':');\n\
        \  const payload = `${playerId}:${timestamp}`;\n  const expected = crypto.createHmac('sha256',
        SECRET)\n    .update(payload)\n    .digest('hex');\n\n  // Check HMAC\n  if
        (hmac !== expected) return null;\n\n  // Check expiry (1 hour)\n  if (Date.now()
        - parseInt(timestamp) > 3600000) return null;\n\n  return playerId;\n}\n\n\
        // Rate Limiting (Token Bucket) - CRITICAL: burst=10\nconst rateLimits = new
        Map(); // socketId -> {tokens, lastRefill}\n\nexport function checkRateLimit(socketId,
        refillRate = 60, burstCapacity = 10) {\n  const now = Date.now();\n  let bucket
        = rateLimits.get(socketId);\n\n  if (!bucket) {\n    bucket = {tokens: burstCapacity,
        lastRefill: now};\n    rateLimits.set(socketId, bucket);\n  }\n\n  // Refill
        tokens\n  const elapsed = (now - bucket.lastRefill) / 1000;\n  bucket.tokens
        = Math.min(burstCapacity, bucket.tokens + elapsed * refillRate);\n  bucket.lastRefill
        = now;\n\n  // Check availability\n  if (bucket.tokens < 1) return false;\n\
        \n  bucket.tokens -= 1;\n  return true;\n}\n\n// Origin Validation\nconst
        ALLOWED_ORIGINS = process.env.ALLOWED_ORIGINS?.split(',') || ['http://localhost:5173'];\n\
        \nexport function socketAuthMiddleware(socket, next) {\n  const origin = socket.handshake.headers.origin;\n\
        \n  if (!ALLOWED_ORIGINS.includes(origin)) {\n    return next(new Error('Origin
        not allowed'));\n  }\n\n  next();\n}\n"
