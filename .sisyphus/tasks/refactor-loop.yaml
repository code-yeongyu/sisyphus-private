version: '3.0'
metadata:
  created_at: '2025-11-18T09:39:20.926501+00:00'
  updated_at: '2025-11-18T09:39:20.926501+00:00'
work_plans:
- id: refactor-loop
  name: ExecutionLoop 리팩토링 - 버그 수정 및 아키텍처 개선
  depends_on: []
  user_request:
    original: "loop.py 는 너무 현재 복잡하고 버그도 많습니다. 이를 재작성하려고 합니다. 퍼블릭 메소드들의 시그니쳐와 스키마는
      유지하되, 필요하다면 별도의 클래스도 만들어 DI 를 할 수 있게 한다거나, 하는식으로 말입니다. 현재 상황에 대한 분석은 @loop.md
      에 있습니다.\n\n제가 원하는것은 다음과 같습니다.\nwhile True:\n- completed != False -> execute
      phase (completed True 는 sisyphus task continue 가 마킹해줌)\n- completed == True
      -> verify phase -> fully_done_at is not null and final_verification all verified
      and fully_done_evidence and acceptance_criteria_for_verification_agent 안의 로직들
      전부 verified -> break\n\n그리고 현재 존재하는 에러처리들에 대한 내용들은 제가 다 대응해둔거니까 다 대응이 되어야 하고
      ,\nexecute phase resume 이 verify phase 로 전환이 한번도 없이 10번 연속으로 진행될 경우에 11번째에 verify
      phase 로 강제이동 해버려야합니다 (강제이동이라는게 completed true 로 마킹하라는것은 아닙니다- 그냥 강제로 넘기라는겁니다.)\n\
      \n그리고 verify phase 에는 항상 <feedbackhistory></feedbackhistory>{verify phase prompt}
      형태로 들어가야 합니다.\n\n그 외 resuming / session id save load 도 당연히 유지되어야 합니다. 버그로 명백히
      판단되는것을 제외하고는 기능을 유지하되 nested / 과도히 방어적인 코드를 개선한다고 생각해주세요.\n\n그리고 다만 verify agent
      는 항상 required 여야 하며 절대 optional 로 다뤄지면 안됩니다.\n\n작업계획서의 맨 위에는 loop.py.bak 을 생성하는게
      있었으면 좋겠고, 이 작업계획서가 loop.py.bak 과 새로 작성된 loop.py 를 강박증처럼 비교하며 버그수정여부와 누락된 기능이없는지,
      제가 명시하지않은 기능이 새로 생기진 않았는지를 verify 했으면 좋겠습니다.\n"
    created_at: '2025-11-18T09:39:20.926501+00:00'
    additional:
    - "Expected Outcome: 완전 재작성 + 버그 수정 + 중요한 기능 유지 + 아키텍처 개선 + 테스트 정직하게 새로 작성(과도한
      테스트 금지, 모킹 제거)\n"
    - "Forbidden Outcomes: Verify Agent Optional 처리, 현재 존재하는 기능의 손실, 테스트 코드의 실패, 정직하지
      못하게 작성된 테스트 코드, 모킹이 필요없는데 모킹된 테스트 코드\n"
    - "Special Concerns: 기존 로직의 손실 및 요구하지 않은 추가기능의 생성, 필요 이상으로 defensive 한 코드 처리,
      필요없는 폴백 및 방어처리\n"
    - "Existing Code Handling: 재작성 + DI 까지\n"
    - "⚠️ ABSOLUTELY FORBIDDEN - uv tool install override:\n절대로 작업 중에 `uv tool install
      sisyphus-work` 명령을 실행하지 마세요.\n이 명령은 현재 작업 중인 sisyphus-work 패키지를 global tool로
      override하여\n작업이 도중에 꼬이고 예상치 못한 버그가 발생합니다.\n개발 중에는 항상 `uv run sisyphus-speckit`
      형태로 실행해야 합니다.\n"
    - "⚠️ ABSOLUTELY FORBIDDEN - sisyphus work execution in current directory:\n절대로
      이 프로젝트 디렉토리(./) 내에서 `sisyphus work` 명령을 실행하지 마세요.\nsisyphus 프로젝트는 sisyphus-cli
      자체를 개발하는 monorepo이므로,\n여기서 sisyphus work를 실행하면 자기 자신을 수정하려다 순환 참조와\n예측 불가능한
      동작이 발생합니다.\nsisyphus work는 반드시 다른 프로젝트에서만 사용해야 합니다.\n"
  objectives:
    core: "ExecutionLoop 클래스의 복잡도를 줄이고 버그를 수정하면서 모든 기존 기능을 완벽히 보존하는 리팩토링\n"
    detailed:
    - goal: 버그 수정 및 로직 단순화
      measurable: loop.md에 명시된 버그 의심 포인트들이 모두 해결됨
    - goal: 아키텍처 개선 (DI, 클래스 분리)
      measurable: 복잡한 중첩 로직이 독립적인 클래스로 분리됨
    - goal: 퍼블릭 API 시그니처 유지
      measurable: run(), request_interrupt(), clear_interrupt() 시그니처 변경 없음
    - goal: 모든 테스트 통과
      measurable: 기존 테스트 14개가 모두 통과함
  background:
    current_situation: "현재 loop.py (952줄)는 다음과 같은 문제가 있음:\n\n1. 과도한 중첩 (nested if/else,
      try/except)\n2. 확인된 버그:\n   - verify_agent=None 케이스 무한 루프 가능성 (line 475-477)\n\
      \   - SDK 카운터 리셋 없음 (누적 문제)\n3. 16개 인스턴스 변수 관리의 복잡도\n4. _run_unified_mode()
      메서드가 250줄 이상\n5. 과도한 방어적 코드 (불필요한 try/except)\n\n주요 기능:\n- Execute → Verify
      2단계 피드백 루프\n- 세션 재개 (execute는 재개, verify는 항상 신규)\n- 에러 처리 (SessionLimitError,
      PromptTooLongError, SDK 오류)\n- 10회 연속 Execute 후 강제 Verify 전환\n- Verify feedback
      history 관리\n- 인터럽트/재개 메커니즘\n- Plan 상태 업데이트 (execution.completed, todo status)\n"
    reason_for_change: "1. 유지보수 어려움: 중첩된 로직으로 버그 수정 시 사이드 이펙트 발생 위험\n2. 확인된 버그: verify_agent=None
      무한 루프, SDK 카운터 누적\n3. 테스트 작성 어려움: 복잡한 상태 관리로 테스트 시나리오 커버리지 낮음\n4. 요구사항 변경: completed
      기반 Verify 전환 로직 단순화 필요\n"
    changes_to_make: "BEFORE (현재):\n- 하나의 ExecutionLoop 클래스가 모든 책임 담당\n- 중첩된 조건문과
      예외 처리 (depth 4-5)\n- 16개 인스턴스 변수를 직접 관리\n- verify_agent Optional 처리로 분기 복잡\n\
      \nAFTER (목표):\n- ExecutionLoop: 메인 루프 오케스트레이션만 담당\n- 별도 클래스로 책임 분리 (DI):\n \
      \ * LoopState: 카운터 및 플래그 관리\n  * PhaseOrchestrator: Execute/Verify 실행 및 에러 처리\n\
      \  * FeedbackManager: Verify feedback history 관리\n- verify_agent를 required로
      변경 (Optional 제거)\n- 단순화된 메인 루프:\n  ```\n  while True:\n      if not execution.completed:\n\
      \          execute_phase()\n      if should_verify():\n          feedback, fully_done
      = verify_phase()\n          if fully_done: break\n  ```\n- 불필요한 방어 코드 제거 (명백한
      케이스만 처리)\n\nPRESERVED (유지):\n- 퍼블릭 API: run(), request_interrupt(), clear_interrupt()\n\
      - 모든 에러 처리 로직\n- 세션 재개/저장 메커니즘\n- 10회 연속 Execute 스로틀\n- Feedback history 관리\n\
      - Plan 상태 업데이트\n"
  required_background:
    description: "**기술 스택:**\n- Python 3.12+\n- anyio (async 동시성)\n- 타입 힌트 필수 (모든
      함수/메서드)\n\n**프로젝트 규칙:**\n- 타입 힌트: 모든 파라미터/반환값 명시\n- 테스트: pytest, fixture는 파일
      맨 아래\n- 네이밍: 풀네임 사용 (축약 금지)\n- Imports: 파일 상단, nested import 금지\n\n**핵심 도메인
      지식:**\n\n1. **Agent Protocol** (sisyphus_core.agents.base)\n   - initialize(),
      start_session(), send(), stream(), close()\n   - session_id property (stream()
      후 업데이트됨)\n\n2. **Error Hierarchy** (sisyphus_core.utils.errors)\n   - RetryRequiredError
      (재시도 가능)\n     - SessionLimitError (reset_time 포함)\n     - PromptTooLongError\n\
      \   - SessionResumeError (세션 재개 실패)\n\n3. **Session Management** (sisyphus_core.core.session)\n\
      \   - get_session(agent_type, plan_id) -> session_id or None\n   - save_session(agent_type,
      session_id, plan_id)\n   - delete_session(agent_type, plan_id)\n\n4. **Plan
      Models** (sisyphus_core.core.plans.models)\n   - WorkPlan.execution.completed
      (boolean)\n   - WorkPlan.work_mode.current_task_id\n   - Todo.status (pending
      | in_progress | completed)\n\n5. **TaskValidatorProtocol**\n   - read_content()
      -> str\n   - check_all_goals_accomplished() -> bool\n   - check_all_checkboxes_completed()
      -> bool\n\n**중요한 동작 방식:**\n\n- Execute phase: 세션 재개 시도 (3회 실패 시 삭제)\n- Verify
      phase: 항상 신규 세션\n- 10회 연속 Execute → 11번째 강제 Verify\n- Verify feedback은 Execute
      extra에 XML 형태로 주입\n- Plan 업데이트: fully_done에 따라 execution.completed 설정\n"
    references:
    - ref_id: ref-loop-spec
      inline: "loop.md 스펙 문서 (982줄) - 완전한 구현 스펙\n\n주요 섹션:\n- 2. 클래스 구조: 16개 인스턴스 변수
        정의\n- 4. _run_unified_mode(): 메인 루프 로직 (250줄 상세 설명)\n- 5. _execute_phase():
        세션 관리, 에러 처리\n- 6. _verify_phase(): Judgment 재시도, AC 검증\n- 8. 상태 전이 요약: 카운터/플래그
        증감 조건\n- 10. 버그 의심 포인트:\n  * verify_agent=None 무한 루프\n  * SDK 카운터 리셋 없음\n"
    - ref_id: ref-current-impl
      inline: "현재 loop.py 구현 (953줄)\n\n파일: projects/sisyphus-core/sisyphus_core/core/loop.py\n\
        \n주요 메서드:\n- run() (line 101-144): 진입점\n- _run_unified_mode() (line 229-478):
        메인 루프\n- _execute_phase() (line 479-680): Execute 실행\n- _verify_phase() (line
        681-940): Verify 실행\n- request_interrupt() (line 942-946)\n- clear_interrupt()
        (line 948-952)\n\n핵심 로직 위치:\n- 10회 스로틀: line 270-276\n- Execute 프롬프트 구성: line
        296-336\n- Verify 여부 판단: line 370-391\n- Verify 재시도 루프: line 412-436\n- Plan
        업데이트: line 438-462\n- 세션 재개: line 515-537\n- SDK 오류 감지: line 602-627\n- Acceptance
        Criteria 검증: line 758-804\n"
    - ref_id: ref-test-patterns
      inline: "기존 테스트 파일 패턴\n\n위치: projects/sisyphus-core/sisyphus_core/core/tests/\n\
        \n14개 테스트 파일:\n1. test_loop.py - 기본 실행\n2. test_loop__non_interactive_flow.py
        - 비대화형 에이전트\n3. test_loop__retry_required.py - 재시도 에러\n4. test_loop__session_limit.py
        - 세션 제한\n5. test_loop__sdk_exception.py - SDK 오류\n6. test_loop__phase_resume.py
        - Phase 재개\n7. test_loop__verify_feedback_history.py - Feedback 히스토리\n8. test_loop__execute_feedback_injection.py
        - Feedback 주입\n9. test_loop__concurrent_input_monitoring.py - 동시 입력\n10. test_loop__integration_feedback_loop.py
        - 통합 피드백\n11. test_loop__issue44_integration.py - Issue #44\n12. test_loop__execution_completed_verify_transition.py
        - Verify 전환\n13. test_loop__prompt_too_long_session_delete.py - Prompt 길이\n\
        14. test_loop__verify_phase_feedback.py - Verify 피드백\n\n테스트 패턴:\n- Mock Agent:
        supports_interactive, start_session, stream 등\n- Mock UI: show_message, show_status,
        get_input\n- Mock SessionStore: get_session, save_session\n- pytest-mock 사용
        (mocker: MockerFixture)\n- anyio.from_thread.run_sync() 패턴\n"
  workflow:
    dependency_diagram: "Task 1: loop.py.bak 백업 생성\n   ↓\nTask 2: LoopState 클래스 설계
      및 구현\n   ↓\nTask 3: FeedbackManager 클래스 설계 및 구현\n   ↓\nTask 4: PhaseOrchestrator
      클래스 설계 및 구현\n   ↓\nTask 5: ExecutionLoop 메인 로직 재작성 (DI 사용)\n   ↓\nTask 6: verify_agent
      required로 변경\n   ↓\nTask 7: 기존 테스트 16개 실행 및 수정\n   ↓\nTask 8: 기존 vs 신규 기능 비교
      검증\n   ↓\nTask 9: Commit 작성\n"
    critical_path:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
  success_vision:
    user_perspective:
    - scenario: 개발자가 기존 테스트를 실행
      experience: 14개 테스트가 모두 통과하며, 에러 메시지가 없음
    - scenario: 개발자가 새 loop.py 코드를 리뷰
      experience: 중첩 depth가 줄어들고, 각 클래스의 책임이 명확함
    business_perspective:
    - metric: 코드 복잡도
      target: 메인 메서드 100줄 이하, 중첩 depth 3 이하
    - metric: 테스트 통과율
      target: 14개 테스트 100% 통과
    - metric: 버그 수정
      target: loop.md의 버그 의심 포인트 2개 해결
    technical_criteria:
    - category: 기능 보존
      criteria: 퍼블릭 API 시그니처 변경 없음
      command: grep 'def run\|def request_interrupt\|def clear_interrupt' 
        projects/sisyphus-core/sisyphus_core/core/loop.py
      expected: 3개 메서드 시그니처 동일
    - category: 테스트
      criteria: 모든 테스트 통과
      command: pytest 
        projects/sisyphus-core/sisyphus_core/core/tests/test_loop*.py -v
      expected: 16개 파일 모두 PASSED
    - category: 타입 안전성
      criteria: 타입 에러 없음
      command: basedpyright projects/sisyphus-core/sisyphus_core/core/loop.py
      expected: 0 errors
  final_verification:
  - id: final-1
    title: 모든 퍼블릭 API 시그니처 유지
    category: 기능 보존
    description: run(), request_interrupt(), clear_interrupt() 시그니처가 변경되지 않음
    verified: true
    verified_at: '2025-11-18T14:33:36.548183+00:00'
    verification_evidence: 'Public API signatures verified: run(execute_extra: str|None=None,
      verify_extra: str|None=None)->None, request_interrupt()->None, clear_interrupt()->None.
      All signatures match expected format. Bash verification exit code 0.'
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash:
    - execute: "python -c \"import inspect; from sisyphus_core.core.loop import ExecutionLoop;
        run_sig = str(inspect.signature(ExecutionLoop.run)); interrupt_sig = str(inspect.signature(ExecutionLoop.request_interrupt));
        clear_sig = str(inspect.signature(ExecutionLoop.clear_interrupt)); print(f'run:
        {run_sig}\\nrequest_interrupt: {interrupt_sig}\\nclear_interrupt: {clear_sig}')\""
      expected_exit_code: 0
      notes: 시그니처 출력 확인
    llm_judge:
    - by: orchestrator-agent
      context_commands:
      - cat projects/sisyphus-core/sisyphus_core/core/loop.py | grep -A 5 'def 
        run\|def request_interrupt\|def clear_interrupt'
      instruction: "다음 기준으로 검증:\n\nCRITERION 1: run() 메서드 시그니처\n- Expected: async
        def run(self, execute_extra: str | None = None, verify_extra: str | None =
        None) -> None\n- Verify: 파라미터 이름/타입/기본값 동일\n\nCRITERION 2: request_interrupt()
        메서드 시그니처\n- Expected: def request_interrupt(self) -> None\n- Verify: 파라미터
        없음, 반환 None\n\nCRITERION 3: clear_interrupt() 메서드 시그니처\n- Expected: def clear_interrupt(self)
        -> None\n- Verify: 파라미터 없음, 반환 None\n\nPASS: 3개 모두 동일\nFAIL: 하나라도 다름\n"
  - id: final-2
    title: 모든 기존 테스트 통과
    category: 테스트
    description: 14개 테스트 파일이 모두 통과함
    verified: true
    verified_at: '2025-11-18T14:33:44.902364+00:00'
    verification_evidence: 'All 109 loop tests passed (100% pass rate). Test execution:
      uv run pytest sisyphus_core/core/tests/test_loop*.py -v --tb=short. Exit code
      0. All test files including test_loop.py, test_loop__phase_resume.py, test_loop__prompt_too_long_session_delete.py,
      test_loop__sdk_exception.py, test_loop__integration_feedback_loop.py passed
      successfully.'
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash:
    - execute: cd projects/sisyphus-core && uv run pytest 
        sisyphus_core/core/tests/test_loop*.py -v --tb=short
