  todos:
  - id: '1'
    title: 프로젝트 초기화 (CRITICAL - Blocker 1 해결)
    description: "프로젝트 루트 구조 및 패키지 초기화. ./shared (공유 물리 모듈), ./frontend (Vite+React),
      ./backend (Node.js) 디렉토리 생성. **CRITICAL Shared Module Strategy**: 전체 프로젝트 ESM
      채택 (루트 package.json에 `\"type\": \"module\"` 추가). Frontend: `vite.config.js`에
      ESM 방식으로 `resolve.alias` 설정 (`import { fileURLToPath } from 'url'; import path
      from 'path'; const __dirname = path.dirname(fileURLToPath(import.meta.url));
      ... resolve: { alias: { '@shared': path.resolve(__dirname, '../shared') } }`),
      `server.fs.allow: ['..']`로 상위 디렉토리 접근 허용. Backend: `import { updatePhysics }
      from '../shared/physics.js'` 직접 ESM import. Vitest/Jest: 동일 alias 설정 (`moduleNameMapper`
      또는 `resolve.alias`). frontend: npm create vite@latest, backend: npm init. 루트
      README.md 업데이트."
    status: in_progress
    children: []
