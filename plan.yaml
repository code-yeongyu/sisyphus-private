        // seconds\n\nlet accumulator = 0;\nlet lastTime = Date.now() / 1000;\nlet
        globalTick = 0;\n\nfunction physicsUpdate(player, inputQueue, dt) {\n  //
        Apply input → update velocity → position\n  const velocity = applyInput(player.velocity,
        inputQueue.latest, dt);\n  const newPos = player.position.add(velocity.multiplyScalar(dt));\n\
        \n  // Server-side boundary check with hysteresis\n  if (isOutOfBounds(newPos,
        200)) { // 200ms grace period\n    player.violations++;\n    if (player.violations
        >= 4) {\n      emitGameOver(player.id);\n    }\n  } else {\n    player.violations
        = 0;\n  }\n\n  return { position: newPos, velocity, quaternion: player.quaternion
        };\n}\n\nfunction gameLoop() {\n  const now = Date.now() / 1000;\n  let frameTime
        = now - lastTime;\n  lastTime = now;\n\n  // Clamp frameTime to prevent spiral
        of death\n  if (frameTime > 0.25) frameTime = 0.25;\n\n  accumulator += frameTime;\n\
        \n  // Fixed timestep physics updates\n  while (accumulator >= PHYSICS_STEP)
