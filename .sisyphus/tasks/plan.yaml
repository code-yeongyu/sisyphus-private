  - id: '10'
    title: depends_on 파일 경로 지원 - PlanLinter 확장
    description: "sisyphus-core/sisyphus_core/core/plan_linter.py 수정:\n\n파일 경로 해결
      알고리즘 구현:\n\n```python\nfrom pathlib import Path\n\ndef resolve_depends_on_path(depends_on:
      str, current_plan_path: Path) -> Path:\n    \"\"\"\n    depends_on 값을 실제 파일
      경로로 해결\n    \n    Args:\n        depends_on: depends_on 값 (파일명, 상대경로, 또는 절대경로)\n\
      \        current_plan_path: 현재 plan 파일의 경로\n    \n    Returns:\n        해결된
      절대 경로\n    \"\"\"\n    # 1. 절대경로 (/로 시작) → 그대로 사용\n    if depends_on.startswith('/'):\n\
      \        return Path(depends_on)\n    \n    # 2. 상대경로 (./ 또는 ../) → 현재 plan
      파일 기준으로 resolve\n    elif depends_on.startswith('./') or depends_on.startswith('../'):\n\
      \        return (current_plan_path.parent / depends_on).resolve()\n    \n  \
      \  # 3. 파일명만 (foobar.yml) → .sisyphus/tasks/ 디렉토리에서 검색\n    else:\n        return
      (current_plan_path.parent / '.sisyphus/tasks' / depends_on).resolve()\n\ndef
      validate_depends_on(depends_on: str, current_plan_path: Path, visited: set[Path])
      -> None:\n    \"\"\"\n    depends_on 검증\n    \n    Args:\n        depends_on:
      검증할 depends_on 값\n        current_plan_path: 현재 plan 파일 경로\n        visited:
      방문한 파일들 (순환 참조 검사용)\n    \n    Raises:\n        ValueError: 파일이 존재하지 않거나 순환
      참조 발견 시\n    \"\"\"\n    # depends_on 값에 \"/\" 또는 \".yml/.yaml\" 확장자가 있으면 파일
      경로로 판단\n    if \"/\" in depends_on or depends_on.endswith(('.yml', '.yaml')):\n\
      \        resolved_path = resolve_depends_on_path(depends_on, current_plan_path)\n\
      \        \n        # 파일 존재 확인\n        if not resolved_path.exists():\n    \
      \        raise ValueError(f\"depends_on 파일이 존재하지 않음: {resolved_path}\")\n  \
      \      \n        # 순환 참조 검사\n        if resolved_path in visited:\n        \
      \    raise ValueError(f\"순환 참조 발견: {resolved_path}\")\n        \n        visited.add(resolved_path)\n\
      \        \n        # 참조된 파일 로드 후 plan ID 검증\n        from sisyphus_core.core.plans.loader
      import load_plan\n        referenced_plan_doc = asyncio.run(load_plan(resolved_path))\n\
      \        \n        # 재귀적으로 참조된 파일의 depends_on도 검증\n        for work_plan in
      referenced_plan_doc.work_plans:\n            for dep in work_plan.depends_on:\n\
      \                validate_depends_on(dep, resolved_path, visited)\n```\n\nPlanLinter
      클래스에 통합:\n1. lint() 메서드에서 모든 depends_on 검증\n2. visited: set[Path] = set() 으로
      순환 참조 추적\n3. 에러 발생 시 명확한 메시지 출력"
    status: completed
    references:
    - inline: "구현 패턴:\ndef resolve_depends_on_path(depends_on: str, current_plan_path:
        Path) -> Path:\n    if depends_on.startswith('/'):\n        return Path(depends_on)\n\
        \    elif depends_on.startswith('./') or depends_on.startswith('../'):\n \
        \       return (current_plan_path.parent / depends_on).resolve()\n    else:\n\
        \        return (current_plan_path.parent / '.sisyphus/tasks' / depends_on).resolve()"
