        from pathlib import Path
        from rich.table import Table
        from rich.console import Console
        from sisyphus_core.core.plans.loader import load_plan
        import typer

        console = Console()

        def list_plans(
            directory: Path = typer.Option(Path(".sisyphus/tasks"), "--dir", "-d"),
            filter_status: str | None = typer.Option(None, "--filter"),
            sort_by: str = typer.Option("default", "--sort"),
        ) -> None:
            # 1. YAML 파일 스캔
            yaml_files = list(directory.glob("*.yaml"))

            # 2. 각 plan 메타데이터 수집
            plans = []
            for yaml_file in yaml_files:
                plan_doc = load_plan(yaml_file)
                for work_plan in plan_doc.work_plans:
                    status = _calculate_status(work_plan, yaml_file.parent)
                    plans.append({
                        "name": work_plan.name,
                        "filepath": str(yaml_file.relative_to(Path.cwd())),
                        "status": status,
                        "dependencies": len(work_plan.depends_on),
                        "created_at": work_plan.user_request.created_at,
                    })

            # 3. Filter/Sort 적용
            if filter_status:
                plans = [p for p in plans if p["status"] == filter_status]

            if sort_by == "default":
                # 작업 가능 -> 진행중 -> 완료 순, 그 안에서 created_at 오름차순
                ...

            # 4. Rich Table 출력
            table = Table(title="Available Plans")
            table.add_column("Name")
            table.add_column("File Path")
            table.add_column("Status")
            table.add_column("Dependencies")
            table.add_column("Created At")

            for plan in plans:
                table.add_row(...)

            console.print(table)
        ```

