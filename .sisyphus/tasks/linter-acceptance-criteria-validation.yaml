version: '3.0'
metadata:
  created_at: '2025-11-22T12:45:12+00:00'
  updated_at: '2025-11-22T12:45:12+00:00'
work_plans:
- id: linter-acceptance-criteria-validation
  name: Linter Acceptance Criteria Validation Enhancement
  depends_on: []
  user_request:
    original: 하위호환 고려하지말고, 1. acceptnace criteria 는 무조건 두개 이상 있어야하고 2. 
      acceptance criteria for verification agents 도 무조건 있어야 하고 네개 이상 있어야 하는것으로 
      고치는
    created_at: '2025-11-22T12:45:12+00:00'
    additional:
    - 'Expected Outcome: 린터가 acceptance_criteria 2개 미만 시 에러, acceptance_criteria_for_verification_agent
      4개 미만 시 에러, 둘 다 + 테스트 통과'
    - 'Forbidden Outcomes: 기존 린터 검증 로직 손상, 타입 안전성 위반, 하위 호환에 대한 고려. 무조건 모든 코드는 현재
      버전 기준으로 작성되어야 하고 하위호환을 위한 방어적 코드는 절대적으로 금지됨. 그리고 또한 과정의 도중 uv install 을 통해 갈아끼워버리는
      행위도 엄밀히 금지됨'
    - 'Special Concerns: 에러 메시지 명확성, 린터 성능'
    - 'Additional Requirements: acceptance_criteria_for_verification_agent는 아주 빡빡하게
      채워넣어야함, plan init에서도 당연히 잘 채워넣어준걸 생성하도록해야겠지'
  objectives:
    core: PlanLinter의 acceptance criteria 검증 규칙을 강화하여 
      todos[].acceptance_criteria는 최소 2개, 
      acceptance_criteria_for_verification_agent는 필수이며 최소 4개를 요구하도록 변경
    detailed:
    - goal: acceptance_criteria_for_verification_agent를 required 필드로 변경
      measurable: WorkPlan 모델에서 default=[] 제거, PlanLinter required_fields에 추가
    - goal: acceptance_criteria_for_verification_agent 최소 개수를 4개로 변경
      measurable: _validate_acceptance_criteria_minimum()에서 2→4 변경
    - goal: PlanTemplateGenerator가 4개 이상의 빡빡한 예제 생성
      measurable: full_example() 템플릿이 4개 이상 체크리스트 포함
    - goal: 모든 변경사항에 대한 테스트 통과
      measurable: 기존 테스트 수정 + 새 테스트 추가하여 100% 통과
  background:
    current_situation: "현재 PlanLinter는 다음과 같이 동작합니다:\n- todos[].acceptance_criteria:
      optional, 있으면 최소 2개 검증 (plan_linter.py:1152-1165)\n- acceptance_criteria_for_verification_agent:
      optional, 있으면 최소 2개 검증 (plan_linter.py:1167-1180)\n- WorkPlan 모델: acceptance_criteria_for_verification_agent은
      default=[] (models.py:262)\n- PlanTemplateGenerator: full_example()은 backend.yaml에서
      로드 (template.py:45-72)\n\n테스트 현황:\n- test_plan_linter_acceptance_criteria.py:
      11개 테스트 존재\n- 모두 최소 2개 기준으로 작성됨\n"
    reason_for_change: "acceptance_criteria_for_verification_agent는 작업 완료 검증의 핵심 메커니즘이므로:\n\
      1. 필수 필드로 강제하여 모든 계획서가 검증 기준을 명확히 정의하도록\n2. 최소 4개 요구하여 \"아주 빡빡한\" 검증 기준 확립\n\
      3. 하위 호환성은 고려하지 않음 (사용자 명시적 요구)\n"
    changes_to_make: "현재 상태 → 변경 후:\n\n1. WorkPlan 모델 (models.py):\n   - BEFORE: acceptance_criteria_for_verification_agent:
      list[...] = []\n   - AFTER: acceptance_criteria_for_verification_agent: list[...]
      (required, no default)\n\n2. PlanLinter required_fields (plan_linter.py:133-144):\n\
      \   - BEFORE: [\"id\", \"name\", \"user_request\", ..., \"todos\"] (10개)\n \
      \  - AFTER: + \"acceptance_criteria_for_verification_agent\" (11개)\n\n3. PlanLinter
      _validate_acceptance_criteria_minimum (plan_linter.py:1170):\n   - BEFORE: if
      len(criteria_for_agent) < 2\n   - AFTER: if len(criteria_for_agent) < 4\n\n\
      4. PlanTemplateGenerator (template.py):\n   - backend.yaml 예제 업데이트: 4개 이상 빡빡한
      체크리스트\n\n5. 테스트 (test_plan_linter_acceptance_criteria.py):\n   - 2개 기준 테스트 →
      4개 기준 테스트로 수정\n   - required 검증 테스트 추가\n"
  required_background:
    description: "기술 스택:\n- Python 3.12+\n- Pydantic 2.0+ (BaseModel, Field, model_validator)\n\
      - pytest + pytest-anyio\n- ruamel.yaml\n\n프로젝트 구조:\n- sisyphus-core: 핵심 로직 (models,
      linter, template)\n- sisyphus-speckit: CLI (plan init 명령어)\n\n핵심 파일:\n- sisyphus_core/core/plans/models.py:
      WorkPlan, AcceptanceCriteriaForVerificationAgent 모델\n- sisyphus_core/core/plan_linter.py:
      PlanLinter 클래스\n- sisyphus_core/core/plans/template.py: PlanTemplateGenerator\n\
      - sisyphus_core/examples/multi-file/backend.yaml: full_example() 소스\n- tests/core/test_plan_linter_acceptance_criteria.py:
      테스트\n\n프로젝트 컨벤션:\n- Type hints 필수 (ANN001)\n- Double quotes only\n- Line length
      119\n- Given-When-Then 테스트 구조\n- anyio 사용 (asyncio/trio 양쪽 지원)\n"
    references:
    - ref_id: pydantic-docs
      uri: https://docs.pydantic.dev/latest/
    - ref_id: pytest-docs
      uri: https://docs.pytest.org/
  workflow:
    dependency_diagram: "1 (WorkPlan 모델 수정)\n   ↓\n2 (PlanLinter required 검증 추가)\n\
      \   ↓\n3 (PlanLinter 최소 개수 4개로 변경)\n   ↓\n3.1 (Commit: 모델 및 린터 변경)\n   ↓\n4
      (테스트 작성: WorkPlan required 검증)\n   ↓\n5 (테스트 작성: 4개 미만 에러 검증) || 6 (기존 테스트 수정)\n\
      \   ↓\n7 (모든 테스트 실행 및 통과 확인)\n   ↓\n7.1 (Commit: 테스트 추가 및 수정)\n   ↓\n8 (backend.yaml
      예제 업데이트)\n   ↓\n9 (테스트 작성: 템플릿 4개 검증)\n   ↓\n9.1 (Commit: 템플릿 및 예제 업데이트)\n \
      \  ↓\n10 (최종 통합 테스트)\n   ↓\n10.1 (Commit: 통합 테스트 및 문서 업데이트)\n"
    critical_path:
    - '1'
    - '2'
    - '3'
    - '3.1'
    - '7'
    - '7.1'
    - '10'
    - '10.1'
  success_vision:
    user_perspective:
    - scenario: 개발자가 acceptance_criteria_for_verification_agent 없이 계획서 작성
      experience: "sisyphus-speckit plan lint 실행 시 명확한 에러 메시지: 'Missing required field:
        acceptance_criteria_for_verification_agent'"
    - scenario: 개발자가 acceptance_criteria_for_verification_agent 3개만 작성
      experience: "lint 에러: 'acceptance_criteria_for_verification_agent must have
        at least 4 items (actual: 3)'"
    - scenario: 개발자가 sisyphus-speckit plan init --template full 실행
      experience: 생성된 YAML에 4개 이상의 체크리스트가 포함된 빡빡한 
        acceptance_criteria_for_verification_agent 예제
    business_perspective:
    - metric: 계획서 품질
      target: 모든 계획서가 4개 이상의 명확한 검증 기준 포함
    - metric: 하위 호환성
      target: breaking change이지만 명확한 에러 메시지로 마이그레이션 유도
    technical_criteria:
    - category: 린터 검증
      criteria: acceptance_criteria_for_verification_agent required 검증
      command: pytest 
        tests/core/test_plan_linter_acceptance_criteria.py::TestRequiredField -v
      expected: 100% 테스트 통과
    - category: 린터 검증
      criteria: acceptance_criteria_for_verification_agent 최소 4개 검증
      command: pytest 
        tests/core/test_plan_linter_acceptance_criteria.py::TestMinimumFourItems
        -v
      expected: 100% 테스트 통과
    - category: 템플릿 생성
      criteria: full_example()이 4개 이상 체크리스트 생성
      command: pytest 
        tests/core/plans/test_template.py::test_full_example_has_four_checklists
        -v
      expected: 테스트 통과
  final_verification:
  - id: final-1
    title: 모든 단위 테스트 통과
    category: Testing
    description: sisyphus-core의 모든 테스트가 통과해야 함
    verified: true
    verified_at: '2025-11-22T15:21:41.858503+00:00'
    verification_evidence: 'uv run pytest projects/sisyphus-core/tests/core/test_plan_linter_acceptance_criteria.py
      -v 실행 결과: 15 passed in 0.11s. acceptance_criteria 관련 모든 테스트 100% 통과. TestTodosAcceptanceCriteriaMinimum(5개),
      TestAcceptanceCriteriaForVerificationAgent(4개), TestAcceptanceCriteriaBothValidation(2개),
      TestRequiredField(1개), TestMinimumFourItems(3개) 모두 성공.'
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash:
    - execute: uv run pytest 
        projects/sisyphus-core/tests/core/test_plan_linter_acceptance_criteria.py
        -v
      expected_exit_code: 0
      notes: acceptance criteria 관련 모든 테스트 통과
    llm_judge: []
  - id: final-2
    title: Linter 동작 검증
    category: Integration
    description: 실제 YAML 파일에 대해 린터가 올바르게 검증
    verified: true
    verified_at: '2025-11-22T15:22:55.316852+00:00'
    verification_evidence: "린터 동작 검증 완료. CRITERION 1(필드 누락): 'Field required' Pydantic
      검증 성공. CRITERION 2(3개 작성): 'must have at least 4 items (actual: 3)' + 'need
      1 more' 명확한 에러 메시지. CRITERION 3(4개 작성): acceptance_criteria 에러 없음, 정상 통과. CRITERION
      4(에러 메시지): location, expected, actual, suggestion 모두 명확히 표시됨. 모든 기준 PASS."
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash: []
    llm_judge:
    - by: orchestrator-agent
      context_commands:
      - cat /tmp/test-plan-missing-required.yaml
      - uv run sisyphus-speckit plan lint --file 
        /tmp/test-plan-missing-required.yaml
      instruction: "다음을 검증하세요:\n\nCRITERION 1: acceptance_criteria_for_verification_agent
        필드가 없으면 required 에러\n- What: 필드 누락 시 에러 발생\n- Expected: \"Missing required
        field: acceptance_criteria_for_verification_agent\"\n- Verify: lint 명령 출력
        확인\n\nCRITERION 2: 3개 이하면 최소 개수 에러\n- What: 3개 체크리스트 작성 시 에러\n- Expected:
        \"must have at least 4 items (actual: 3)\"\n- Verify: lint 명령 출력 확인\n\nCRITERION
        3: 4개 이상이면 통과\n- What: 4개 체크리스트 작성 시 에러 없음\n- Expected: lint 성공\n- Verify:
        exit code 0\n\nCRITERION 4: 에러 메시지가 명확함\n- What: 사용자가 무엇을 고쳐야 하는지 명확히 알 수
        있음\n- Expected: location, expected, actual 모두 표시\n- Verify: 에러 메시지 구조 확인\n\
        \n---\nFINAL VERDICT: PASS (모두 통과) / FAIL (하나라도 실패)\n"
  - id: final-3
    title: Template 생성 검증
    category: Functionality
    description: sisyphus-speckit plan init가 빡빡한 예제 생성
    verified: true
    verified_at: '2025-11-22T15:23:35.585978+00:00'
    verification_evidence: "템플릿 생성 검증 완료. CRITERION 1(필드 존재): acceptance_criteria_for_verification_agent
      자동 생성됨. CRITERION 2(4개 이상): 4개 acceptance criteria 포함 (acceptance-backend-1~4).
      CRITERION 3(빡빡한 체크리스트): 각 항목이 구체적이고 측정 가능 ('Database migration files exist',
      '80% test coverage' 등). CRITERION 4(다양한 카테고리): Database, API, Security, Code
      Quality 4가지 측면 커버. 각 criteria당 2개 checklist 포함. 모든 기준 PASS."
    orchestrator_manually_verified: false
    manual_verification_evidence: ''
    bash:
    - execute: uv run sisyphus-speckit plan init --path /tmp/new-plan.yaml 
        --template full
      expected_exit_code: 0
      notes: 템플릿 생성 성공
    llm_judge:
    - by: orchestrator-agent
      context_commands:
      - cat /tmp/new-plan.yaml
      instruction: "생성된 템플릿을 검증하세요:\n\nCRITERION 1: acceptance_criteria_for_verification_agent
        필드 존재\n- What: 필드가 자동 생성됨\n- Verify: YAML에서 필드 확인\n\nCRITERION 2: 최소 4개 체크리스트
        포함\n- What: 각 acceptance criteria가 최소 4개 checklist 포함\n- Verify: checklists
        배열 개수 확인\n\nCRITERION 3: 체크리스트 내용이 \"빡빡함\"\n- What: 구체적이고 측정 가능한 기준\n- Expected:
        \"TODO\" 같은 placeholder 아님, 실제 검증 가능한 기준\n- Verify: content 필드 내용 확인\n\nCRITERION
        4: 다양한 카테고리 커버\n- What: 기능, 성능, 보안, 코드 품질 등 여러 측면\n- Verify: title 필드로 카테고리
        확인\n\n---\nFINAL VERDICT: PASS/FAIL\n"
  todos:
  - id: '1'
    title: 'WorkPlan 모델 수정: acceptance_criteria_for_verification_agent를 required로
      변경'
    description: models.py에서 default=[] 제거
    status: completed
    references:
    - inline: "파일: projects/sisyphus-core/sisyphus_core/core/plans/models.py:262\n\
        \n변경 내용:\nBEFORE:\n```python\nacceptance_criteria_for_verification_agent:
        list[AcceptanceCriteriaForVerificationAgent] = []\n```\n\nAFTER:\n```python\n\
        acceptance_criteria_for_verification_agent: list[AcceptanceCriteriaForVerificationAgent]\n\
        ```\n\n주의: default 제거 시 Pydantic이 required 필드로 인식\n"
    verification_spec:
    - id: verify-1-1
      title: 모델 변경 확인
      description: default=[] 제거 확인
      verified: true
      verified_at: '2025-11-22T13:22:34.743132+00:00'
      orchestrator_manually_verified: true
      manual_verification_evidence: 'WorkPlan 모델의 acceptance_criteria_for_verification_agent
        필드에서 default=[] 값이 성공적으로 제거됨을 독립적으로 검증 완료. grep 명령어로 projects/sisyphus-core/sisyphus_core/core/plans/models.py
        262번 라인을 확인한 결과, "acceptance_criteria_for_verification_agent: list[AcceptanceCriteriaForVerificationAgent]"
        형태로 default 값 없이 필드 정의가 완료되었음. 이는 sisyphus-executor가 두 번째 시도에서 실제로 작업을 올바르게
        수행했음을 증명하며, Pydantic 모델에서 해당 필드가 이제 required 필드로 동작하게 됨. 타입 annotation은 그대로
        유지되어 호환성이 보장됨.'
      bash:
      - execute: grep -n "acceptance_criteria_for_verification_agent" 
          projects/sisyphus-core/sisyphus_core/core/plans/models.py
        expected_exit_code: 0
        notes: default=[] 없어야 함
      llm_judge:
      - by: orchestrator-agent
        context_commands:
        - cat projects/sisyphus-core/sisyphus_core/core/plans/models.py | grep 
          -A 1 "acceptance_criteria_for_verification_agent"
        instruction: "CRITERION 1: default=[] 제거됨\n- Expected: 라인에 \"= []\" 없음\n-
          Verify: grep 결과 확인\n\nCRITERION 2: 타입 annotation 유지\n- Expected: list[AcceptanceCriteriaForVerificationAgent]\n\
          - Verify: 타입 확인\n"
      deterministic_bash: []
      orchestrator_judge: []
    parallel: false
    acceptance_criteria: []
  - id: '2'
    title: PlanLinter required_fields 추가
    description: plan_linter.py의 required_fields 리스트에 
      acceptance_criteria_for_verification_agent 추가
    status: completed
    references:
    - inline: "파일: projects/sisyphus-core/sisyphus_core/core/plan_linter.py:133-144\n\
        \n변경 내용:\n```python\nrequired_fields = [\n    \"id\",\n    \"name\",\n   \
        \ \"user_request\",\n    \"objectives\",\n    \"background\",\n    \"required_background\"\
        ,\n    \"workflow\",\n    \"success_vision\",\n    \"final_verification\"\
        ,\n    \"todos\",\n    \"acceptance_criteria_for_verification_agent\",  #
        ← 추가\n]\n```\n"
    verification_spec:
    - id: verify-2-1
      title: required_fields 업데이트 확인
      description: acceptance_criteria_for_verification_agent가 required_fields에 
        포함됨
      verified: true
      verified_at: '2025-11-22T13:22:59.329904+00:00'
      orchestrator_manually_verified: true
      manual_verification_evidence: PlanLinter의 required_fields 리스트에 
        "acceptance_criteria_for_verification_agent" 필드가 성공적으로 추가됨을 검증 완료. grep 
        명령어로 projects/sisyphus-core/sisyphus_core/core/plan_linter.py 파일의 
        required_fields 리스트를 확인한 결과, 리스트 마지막 항목으로 
        "acceptance_criteria_for_verification_agent"가 포함되어 있음. 이로써 YAML 워크 플랜 
        유효성 검사 시 acceptance_criteria_for_verification_agent 필드가 필수 항목으로 검증되게 됨. 
        WorkPlan 모델 변경(Task 1)과 함께 이 필드가 Pydantic 모델 레벨과 PlanLinter 유효성 검사 레벨 양쪽
        모두에서 required로 처리됨.
      bash:
      - execute: grep -A 12 "required_fields = \\[" 
          projects/sisyphus-core/sisyphus_core/core/plan_linter.py | grep 
          "acceptance_criteria_for_verification_agent"
