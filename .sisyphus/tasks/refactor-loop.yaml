  - id: '6'
    title: PhaseOrchestrator 클래스 설계 및 구현
    description: Execute/Verify Phase 실행 및 에러 처리를 담당하는 PhaseOrchestrator 클래스 작성
    status: completed
    references:
    - ref_id: ref-loop-spec
    - ref_id: ref-current-impl
    - inline: "PhaseOrchestrator 클래스 책임:\n\n**의존성:**\n- execute_agent: Agent\n- verify_agent:
        Agent (required)\n- ui: UIProtocol\n- session_store: SessionStore\n- logger_factory:
        LoggerFactory\n- state: LoopState (DI)\n\n**메서드:**\n\n1. **async execute_phase(prompt:
        str, extra: str | None) -> None**\n   - 세션 재개 시도 (3회 실패 시 삭제)\n   - consume_stream
        + monitor_input 동시 실행\n   - 에러 처리:\n     * SessionLimitError → sleep_until_reset\n\
        \     * SDK 오류 → state.increment_sdk_exception, 세션 삭제\n     * 기타 예외 → state.increment_execute_resume_fail\n\
        \   - 인터럽트/재개 처리\n   - 세션 ID 동기화\n\n2. **async verify_phase(prompt: str, extra:
