version: '3.0'
metadata:
  created_at: '2025-11-19T04:53:40.692031+00:00'
  updated_at: '2025-11-19T13:56:00.000000+09:00'
work_plans:
- id: backend-api
  name: Sisyphus-Speckit CLI 개선사항 구현
  depends_on: []
  user_request:
    original: |
      아래의 기능들을 원합니다:
      1. sisyphus-speckit plan schema 의 구현
      - yaml spec 으로도 사용할 수 있는 형식으로써 json 형식의 스키마를 출력

      2. sisyphus-speckit plan list 의 구현
      - 현재 available 한 plan 목록을 name / filepath / status / dependency / created at 으로 테이블로 보여주는 것
      - 상태는 현재 작업중(status.json 참조하여서), 작업 가능(dependency 가 없거나 all resolved & all completed), 작업 완료 됨(fully_done = True with evidence)
      - filter, sort 필요
          - 필터, sort 는 모든것들에 대해서 제공되어야 하며
          - 기본값은 필터는 따로 없고 의존성없고, 상태가 지금 당장 시작 할 수 있는 상황이고(진행중인것은 그 밑으로, 완료된것은 맨 밑으로), created at 이걸 합친 기준으로 정렬을 만들어 주었으면 함

      3. sisyphus-speckit plan status --path {filepath} 의 구현
      - completed / fully done 여부 등을 출력해주어야 함
      - 몇개의 todo 가 있고, 몇개가 체크되어있고, 그래서 몇퍼센트 구현되었는지, 현재 plan 자체의 현황을 출력해야함
      - progress bar 와 함께

      4. sisyphus-speckit plan overview --path {filepath} 의 구현
      - 당연히도 sisyphus work 와 동일하게 여러개일 경우일때에 지정받게하거나 하는 그런 그 로직 그대로 있어야 하고, 말 그대로 오버뷰를 출력해야하는데, 여기서 오버뷰라 함은:
          - 사실상 todo 목록을 제외하고 모든 것. (그러나 이렇게 코딩하면 절대로 안되고, 실제로 필드명 하나하나 나열해야함)
          - 그리고 몇개의 todo 가 있고, 몇개가 체크되어있고, 그래서 몇퍼센트 구현되었는지도 출력해야 함 (진행도 느낌으로, 가능하면 progress bar 같은것도 출력해줬으면 함)
          - final verification 이나 acceptance criteria 에 대한 상세한 내용들도 출력 할 수 있어야 함
          - 여기에서 출력되는 것의 기준은 "그래서 정말 한눈으로 특정 plan 의 오버뷰를 다 볼 수 있나?" 여야 함
          - overview 는 좀 더 status 의 확장 버전에 가까움


      4. sisyphus-speckit plan lint --fix 의 추가
      - --fix fixes all the multiline texts into pipeline (|) texts, no new line thing]
      - nullable 혹은 '' 여도 상관없는, 단순히 그저 필드가 필요한 - evidence 필드 같은것들은 적절한 위치에 알아서 추가해주는 기능도 있어야 함

      5. sisyphus-speckit task status 의 구현
      - 현재 작업 자체에 대한 정보.
      - 그리고 verification status 들도 - 이걸 보고서 마킹에 활용 할 수 있을만큼 그 안의 세부 설명들 모두와 id 같은것들을 모두 표시해줄 수 있어야 함
      - 현재의 verification 과 관련한 내용들을 더 많이 출력해야 함. 모든 verification 내용을 다 출력해야함
      - 그 외 현재 'task' 의 상태를 제대로 보여주는 것을 목표로.
      - continuable (task continue 했을 때 다음단계로 넘어갈 조건이 되는지) 에 대한 값도 출력 할 수 있어야 함

      6. sisyphus-speckit task show 가 더 많은 내용을 다루도록 변경
      - 어떤 검증사항이 어떻게 되어있고 되고있는지에 관하여
      - 그리고 또한 실제 path 도 relative path 로 출력해야 함
      - 하위작업들에 대한 내용도 모조리 자세히 출력해야함.
      - 또한 참조도 다 resolve 해서 가져와서 제대로 출력해야 함

      7. sisyphus-speckit task current 가 sisyphus-speckit task show {current task id} 의 shortcut 이 되도록 변경
      - 실제로 코드에서 그렇게 참조하도록 변경되어야 함
      - 검증 스펙이나 이런거 더 자세히 알고 싶으면 'sisyphus-speckit task status' 를 실행하라고도 해야함

      8. 작업계획서의 current_work 의 제거 및 관련 참조를 모두 current_work_ids 를 통해 접근해서 가져오도록 변경. 그리고 실제로 current_work_ids 사용하도록 변경

      9. speckit 의 verify 도 그렇고 시스템 전반에서 multiline text 에는 pipeline 을 사용해야 함. sisyphus-speckit plan lint --fix 를 한번씩 하고 저장시키면 좋을 듯. 따라서 이 fix 자체는 별도의 컴포넌트여야 함
    created_at: '2025-11-19T04:53:40.692031+00:00'
    additional:
    - |
      Expected Outcome: 모든 sisyphus-speckit plan/task 명령어가 에러 없이 실행되고 예상 출력을 제공.
      각 기능이 Rich 포맷으로 깔끔하게 표시되며, 사용자가 plan과 task 상태를 한눈에 파악 가능.
      기존 코드 패턴(Typer, Rich, Pydantic)과 일관성 유지.
    - |
      Forbidden Outcomes:
      1. 타입 안정성 유지 - Any 타입 사용 금지, 모든 파라미터 타입 힌트 필수
      2. 기존 기능 파괴 금지 - 현재 동작하는 모든 명령어 그대로 동작
      3. 성능 저하 금지 - 명령어 실행 속도가 현재보다 느려지면 안 됨
      4. fallback/migration/하위호환 코드 생성 금지
      5. 요청한 내용 외 추가 작업 금지
    - |
      Special Concerns:
      1. status.json 건드리는 것 절대 금지 - 이걸 건드리지 말고 현재 YAML 스펙 내에서 다 다뤄지도록 할 것
      2. current_work_ids 구현 제대로 - 여러개 multiple로 바뀌는 점 감안
      3. YAML 스키마 호환성 - 기존 .sisyphus/tasks/*.yaml 파일들과의 호환성 유지 필수
      4. CLI 인터페이스 일관성 - 기존 명령어 인터페이스 패턴과 일관되게 유지
  objectives:
    core: |
      sisyphus-speckit CLI의 plan 및 task 관련 명령어를 확장하여 사용자가
      작업 계획과 진행 상황을 더 직관적이고 상세하게 파악할 수 있도록 개선
    detailed:
    - goal: plan 관리 기능 강화
      measurable: |
        schema, list, status, overview, lint --fix 명령어 5개 추가 구현,
        모두 정상 동작 및 예상 출력 제공
    - goal: task 조회 기능 개선
      measurable: |
        task status 신규 구현, task show 기능 확장, task current를 shortcut으로 변경,
        모든 검증사항 및 하위작업 상세 출력
    - goal: 내부 데이터 모델 정리
      measurable: |
        current_work 필드 제거, current_work_ids로 전면 전환,
        모든 참조 코드 수정 완료
    - goal: YAML 포맷 일관성 확보
      measurable: |
        multiline 텍스트 모두 pipeline(|) 형식으로 변환,
        lint --fix 기능으로 자동화
  background:
    current_situation: |
      sisyphus-speckit은 plan과 task를 관리하는 CLI 도구로,
      현재 기본적인 init, lint, graph, show, verify 등의 명령어만 제공.
      사용자가 여러 plan의 상태를 한눈에 보거나, 특정 plan/task의 진행률을
      파악하기 어려움. 또한 current_work와 current_work_ids가 혼재되어 사용.
    reason_for_change: |
      1. 사용자가 전체 plan 목록과 각 plan의 상태를 빠르게 파악할 수 없음
      2. task 검증 상태를 확인하기 위해 YAML 파일을 직접 열어봐야 함
      3. 내부 데이터 모델의 일관성 부족 (current_work vs current_work_ids)
      4. YAML 포맷의 일관성 부족 (multiline 텍스트 처리 방식 불일치)
    changes_to_make: |
      1. plan schema, list, status, overview 명령어 신규 추가
      2. plan lint에 --fix 옵션 추가 (multiline 자동 변환)
      3. task status 신규 추가, task show 기능 확장
      4. task current를 task show의 shortcut으로 변경
      5. current_work 필드 완전 제거, current_work_ids로 통합
      6. multiline 텍스트를 모두 pipeline(|) 형식으로 통일
  required_background:
    description: |
      Tech Stack:
      - Python 3.12+
      - Typer 0.15+ (CLI 프레임워크)
      - Rich 13+ (콘솔 출력)
      - Pydantic 2.0+ (데이터 모델)
      - ruamel.yaml 0.18+ (YAML 파싱)
      - sisyphus-core (공유 모델 및 유틸)

      Project Structure:
      - projects/sisyphus-speckit/sisyphus_speckit/
        - cli.py (진입점)
        - plan/ (plan 관련 명령어들)
        - task/ (task 관련 명령어들)
      - projects/sisyphus-core/sisyphus_core/
        - core/plans/models.py (Pydantic 모델 정의)
        - core/plan_linter.py (lint 검증 로직)
        - core/task_manager.py (task 네비게이션)

      Code Conventions:
      - 모든 함수 파라미터에 타입 힌트 필수 (ruff ANN001)
      - Double quotes only (ruff flake8-quotes)
      - Line length 119
      - Protocol 사용 (ABC 대신)
      - anyio 사용 (asyncio 직접 사용 금지)
      - Given-When-Then 테스트 구조
      - imports는 항상 파일 상단
      - pytest.mark.anyio 필수 (async 테스트)

      CRITICAL CONSTRAINTS:
      - status.json 절대 건드리지 않기
      - 기존 명령어 인터페이스 유지
      - YAML 스키마 호환성 보장
      - 타입 안전성 유지 (Any 타입 금지)
