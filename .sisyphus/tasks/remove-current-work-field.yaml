work_plans:
- id: remove-current-work-field
  name: Remove current_work field and use current_work_ids
  depends_on: []
  user_request:
    original: please remove current_work, and let those other references to reference it from reading current_work_ids
    created_at: '2025-11-18T04:48:27+00:00'
    additional:
    - "Expected Outcome: current_work 필드가 코드베이스에서 완전히 제거되고, current_work_ids만 사용됨"
    - "Forbidden Outcomes: 기존 테스트 깨짐, 스키마 검증 실패, 런타임 에러 발생"
    - "Special Concerns: plan_linter의 v2.1 호환성 유지, 기존 YAML 예시 파일 업데이트"
  objectives:
    core: WorkPlan 모델에서 중복된 current_work 필드를 제거하고 current_work_ids를 단일 진실 공급원으로 사용
    detailed:
    - goal: models.py에서 current_work 필드 제거
      measurable: WorkPlan 클래스에 current_work 필드가 존재하지 않음
    - goal: plan_linter에서 current_work 검증 로직 제거
      measurable: linter가 current_work 필드를 검증하거나 요구하지 않음
    - goal: 모든 테스트 파일 업데이트
      measurable: pytest가 에러 없이 통과함
  background:
    current_situation: |
      현재 WorkPlan 모델에는 current_work (str)와 current_work_ids (list[str]) 두 필드가 모두 존재합니다.
      - current_work: 사람이 읽는 현재 작업 상태 메시지
      - current_work_ids: 현재 작업 중인 Todo ID 집합

      실제 내비게이션 로직은 work_mode.current_task_id만 사용하고, current_work는 코어 로직에서 갱신되지 않습니다.
      current_work는 스키마 호환성과 가시성 목적으로만 존재합니다.
    reason_for_change: |
      중복 필드 current_work를 제거하여 데이터 모델을 단순화합니다.
      current_work_ids를 단일 진실 공급원으로 사용하여 혼란을 줄입니다.
    changes_to_make: |
      현재 상태: WorkPlan에 current_work + current_work_ids 모두 존재
      → 변경 후: current_work 필드 완전 제거, current_work_ids만 유지

      영향받는 파일들:
      - models.py: current_work 필드 삭제
      - plan_linter.py: current_work 검증 로직 제거
      - 테스트 파일들: current_work 참조 제거
      - YAML 예시/문서: current_work 필드 제거
  required_background:
    description: |
      Tech Stack: Python 3.13, uv, Pydantic v2

      현재 아키텍처:
      - WorkPlan (Pydantic BaseModel): projects/sisyphus-core/sisyphus_core/core/plans/models.py:240-241
      - PlanLinter: projects/sisyphus-core/sisyphus_core/core/plan_linter.py
      - 테스트: projects/sisyphus-speckit/tests/, projects/sisyphus-core/tests/

      중요 제약사항:
      - linter는 v2.1 포맷 검증 로직도 가지고 있음 (status.current_work 검증)
      - YAML 예시 파일들은 current_work: "" 포함
      - 모든 수정 후 pytest 통과 필수
    file_structure: null
