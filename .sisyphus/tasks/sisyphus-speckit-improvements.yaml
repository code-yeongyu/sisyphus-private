  - id: '1'
    title: 파일 컨텍스트 표시 시스템 설계
    description: Typer 콜백 기반 파일 경로 표시 시스템 설계
    status: completed
    references:
    - inline: "**설계 방향:**\n\nTyper의 callback 기능을 사용하여 모든 명령어 실행 전 파일 경로를 자동으로 표시합니다.\n\
        \n**구현 위치:**\n- `sisyphus_speckit/cli.py`의 메인 app에 callback 추가\n- callback에서
        StatusManager를 사용하여 현재 plan 경로 가져오기\n- Rich Console로 경로 출력\n\n**참고 패턴:**\n\
        ```python\n# sisyphus_speckit/cli.py\nfrom rich.console import Console\nfrom
        sisyphus_core.core.status.manager import StatusManager\n\nconsole = Console()\n\
        \n@app.callback(invoke_without_command=False)\ndef main_callback(ctx: typer.Context):\n\
        \    # 현재 working directory 확인\n    # StatusManager로 현재 plan 경로 가져오기\n   \
        \ # console.print()로 파일 경로 표시\n    pass\n```\n\n**주의사항:**\n- callback은 모든
        명령어 실행 전에 호출됨\n- status.json이 없는 경우 graceful하게 처리 (오류 내지 않고 skip)\n- 출력은 간결하게
        (한 줄로)\n"
