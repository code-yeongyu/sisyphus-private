  todos:
  - id: '1'
    title: plan schema 명령어 구현
    description: |
      sisyphus-speckit plan schema 명령어를 구현하여
      YAML 스펙을 JSON 스키마 형식으로 출력
    status: pending
    children: null
    references:
    - ref_id: null
      uri: null
      inline: |
        Implementation Requirements:
        1. Pydantic 모델(PlanDocument)을 JSON Schema로 변환
        2. pydantic의 model_json_schema() 메서드 활용
        3. Rich JSON 포맷으로 콘솔에 예쁘게 출력
        4. --output 옵션으로 파일 저장 지원

        File: projects/sisyphus-speckit/sisyphus_speckit/plan/schema.py (신규 생성)

        Reference Pattern:
        - projects/sisyphus-speckit/sisyphus_speckit/plan/lint.py:15-68
          (Typer 명령어 구조, Console 사용 패턴)
        - projects/sisyphus-core/sisyphus_core/core/plans/models.py:1-200
          (PlanDocument 모델 정의)

        Example Implementation:
        ```python
        from sisyphus_core.core.plans.models import PlanDocument
        from rich.console import Console
        from rich.syntax import Syntax
        import json
        import typer

        console = Console()

        def plan_schema(
            output: Path | None = typer.Option(None, "--output", "-o"),
        ) -> None:
            schema = PlanDocument.model_json_schema()
            json_str = json.dumps(schema, indent=2, ensure_ascii=False)

            if output:
                output.write_text(json_str, encoding="utf-8")
                console.print(f"[green]Schema saved to {output}[/green]")
            else:
                syntax = Syntax(json_str, "json", theme="monokai")
                console.print(syntax)
        ```

        Register in plan/app.py:
