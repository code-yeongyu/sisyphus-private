      - projects/sisyphus-core/sisyphus_core/core/status/manager.py: StatusManager 클래스
      - projects/sisyphus-core/sisyphus_core/core/task_validator.py: YamlTaskValidator 클래스
      - projects/sisyphus-core/sisyphus_core/core/plans/loader.py: load_plan() 함수
      - projects/sisyphus-core/sisyphus_core/core/prompts.py: prompt 빌드 함수들

      아키텍처 제약사항:
      - anyio 기반 async 사용 (asyncio 직접 사용 금지)
      - Protocol 기반 설계 유지
      - Pydantic 모델 사용
      - 기존 테스트 호환성 유지 (MockStatusManager 패턴)
