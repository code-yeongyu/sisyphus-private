    title: 백엔드 의존성 설치 및 기본 구조 (TDD, CRITICAL - Blocker 15)
    description: "backend/ 디렉토리에서 의존성 설치 (버전 핀 포함): express@^4.18.0, socket.io@^4.6.0
      (프론트와 동일 버전), uuid@^9.0.0, jest@^29.0.0, zod@^3.22.0 (스키마 검증), gl-matrix@^3.4.0
      (CRITICAL: Vector3/Quaternion 수학 연산용, Three.js 대신 경량 라이브러리). src/, src/middleware,
      tests/ 디렉토리 생성. **CRITICAL Jest ESM 설정**: package.json에 `\"type\": \"module\"\
      ` 추가하고, `jest.config.js` 파일명을 `jest.config.mjs`로 변경 (ESM native support), 또는
      더 안정적인 방법으로 Vitest 사용 고려 (프론트엔드와 통일). Jest 사용 시: `transform: {}`, `extensionsToTreatAsEsm:
      ['.js']`, test script에 `NODE_OPTIONS='--experimental-vm-modules --no-warnings'
