metadata:
  created_at: "2025-01-15T10:00:00Z"
  updated_at: "2025-01-15T10:00:00Z"
  format_version: "2.0"

user_request:
  original: "ai todolist yaml 다루는 새 도구를 만들고, 내가 사용하지 않는 것들은 지울 수있었으면 함"
  created_at: "2025-01-15T10:00:00Z"
  additional:
    - "@sisyphus/core/loop.py 통해서 execute phase 가 실행된다면 @sisyphus/core/prompts.py 이게 들어가고 얘가 메인 오케스트레이터 에이전트로써 @claude-code-plugins/sisyphus/agents/executor.md 를 호출"
    - "executor agent 의 작업이 끝나고나면 hook 으로 @.github/workflows/.claude.agent/hooks/post-tool-use/orchestrator_reminder.py 이게 orchestrator 한테 보고되는데, 이걸 yaml based 로 바꾸려고 함"

objectives:
  core: "sisyphus의 작업 계획 시스템을 ai-todolist.yaml 기반으로 재구성하고, sisyphus execute-phase와 sisyphus verify-phase CLI 명령어를 구현하여 YAML 기반 작업 워크플로우를 완성합니다"
  detailed:
    - goal: "YAML 기반 작업 계획 시스템을 위한 새 CLI 명령어 구현"
      measurable: "sisyphus execute-phase, sisyphus verify-phase 명령어 5개 이상 구현 및 테스트 통과"
    - goal: "기존 sisyphus plan 명령어 중 불필요한 업데이트성 명령어 제거"
      measurable: "plan set/set-verification/check 명령어 제거, get/lint만 유지 확인"
    - goal: "orchestrator-executor-hook 플로우를 YAML 스키마 기반으로 전환"
      measurable: "v2.1 스키마 준수 YAML 파일로 작업 진행 확인"

background:
  current_situation: "현재 ai-todolist.md 마크다운 기반 작업 계획 시스템이 운영 중. orchestrator agent가 executor agent를 호출하고, hook으로 작업 상태를 보고받는 구조. sisyphus plan 명령어에 get/set/set-verification/check/lint 5개 서브커맨드 존재. ai-todolist-draft.yaml에 v2.1 스키마가 정의되어 있음."
  reason_for_change: "YAML 기반 스키마(v2.1)가 구조화된 검증(bash, llm_judge)을 지원. 마크다운 기반보다 프로그래매틱한 접근이 용이. 작업 진행 상태, 검증 상태를 명확하게 관리 가능."
  changes_to_make: "Before: ai-todolist.md (마크다운), orchestrator → executor → hook 플로우, sisyphus plan get/set/set-verification/check/lint. After: ai-todolist.yaml (YAML v2.1), sisyphus execute-phase continue-work/bash-verify/llm-verify/manual-verify, sisyphus verify-phase bash-verify/llm-verify, sisyphus plan get/lint (업데이트성 명령어 제거)"

required_background:
  description: "Typer 기반 CLI 구조, Pydantic BaseModel 사용 패턴, anyio 기반 async 프로그래밍, v2.1 YAML 스키마 구조, PlanLoader/PlanNavigator 사용법. sisyphus/cli.py (Typer 기반 CLI 진입점), sisyphus/core/loop.py (ExecutionLoop), sisyphus/utils/plan_types.py (v2.1 YAML 스키마 Pydantic 모델), sisyphus/core/plan_navigator.py (YAML plan 탐색, DFS 알고리즘), sisyphus/core/plan_loader.py (YAML 파일 읽기/쓰기, Pydantic 변환)"
  file_structure: null
  references:
    - type: "url"
      url: "https://typer.tiangolo.com/"
      description: "Typer Documentation - Commands and Groups"
      retrieval: null
      notes: "Commands and Groups section 참고"
      id: "ref_typer_docs"
    - type: "url"
      url: "https://docs.pydantic.dev/latest/"
      description: "Pydantic BaseModel Documentation"
      retrieval: null
      notes: "model_copy, model_validate 참고"
      id: "ref_pydantic_docs"

