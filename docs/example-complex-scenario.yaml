# Complex Task Plan Example
# Demonstrates: nested subtasks, critical tasks, external references,
# complex verification, runtime task discovery, parallel execution

schema_version: "1.0.0"

project:
  id: "proj_ecommerce_cart"
  name: "E-Commerce Shopping Cart"
  description: "Implement shopping cart with payment integration"
