        url: "https://tetris.wiki/Playfield"
        description: "표준 Tetris 보드 크기 및 좌표 시스템"
        retrieval:
          type: keywords
          keywords: ["10x20 standard playfield"]

      - type: code_snippet
        language: python
        description: "충돌 감지 로직 예시"
        code: |
          def is_collision(board: list[list[int]], tetromino: Tetromino) -> bool:
              for y, row in enumerate(tetromino.shape):
                  for x, cell in enumerate(row):
                      if cell == 0:
                          continue

                      board_x = tetromino.x + x
                      board_y = tetromino.y + y

                      # 경계 체크
                      if board_x < 0 or board_x >= BOARD_WIDTH:
                          return True
                      if board_y < 0 or board_y >= BOARD_HEIGHT:
                          return True

                      # 블록 충돌 체크
                      if board[board_y][board_x] != 0:
                          return True

              return False

