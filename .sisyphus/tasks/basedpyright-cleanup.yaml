      타입 이슈 해결\n   ↓\n5. sisyphus-core 타입 검증\n   ↓\n6. sisyphus-cli 타입 이슈 해결\n   ↓\n\
      7. sisyphus-cli 타입 검증\n   ↓\n8. sisyphus-speckit 타입 이슈 해결\n   ↓\n9. sisyphus-speckit
      타입 검증\n   ↓\n10. setup-dot-claude 타입 이슈 해결\n   ↓\n11. setup-dot-claude 타입 검증\n\
      \   ↓\n12. 전체 프로젝트 최종 검증\n   ↓\n13. 기존 테스트 회귀 검증\n"
