  current_work: |
    작업이 아직 시작되지 않음.
    사용자의 명시적 시작 명령을 기다리는 중.

# ============================================================================
# WORK OVERVIEW - 작업 흐름 (workflow에서 이름 변경)
# ============================================================================
work_overview:
  dependency_diagram: |
    Phase 1: 기본 구조
    └─ Task 1: 프로젝트 초기화

    Phase 2: 핵심 기능 (순차)
    ├─ Task 2: 데이터베이스 모델
    └─ Task 3: CLI 명령어

    Phase 3: 마무리 (병렬 가능)
    ├─ Task 4 parallel: 테스트 작성
    └─ Task 5 parallel: 문서화

  critical_path:
    - "Task 1 → Task 2 → Task 3 → (Task 4 || Task 5)"

