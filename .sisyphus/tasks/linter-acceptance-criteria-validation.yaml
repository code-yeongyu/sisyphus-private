          expected_stdout: null
          expected_stderr: null
          expected_exit_code: 0
          notes: 'acceptance criteria 관련 모든 테스트 통과'
      llm_judge: []

    - id: 'final-2'
      title: 'Linter 동작 검증'
      category: 'Integration'
      description: '실제 YAML 파일에 대해 린터가 올바르게 검증'
      verified: false
      verified_at: null
      verification_evidence: null
      orchestrator_manually_verified: false
      manual_verification_evidence: ''
      bash: []
      llm_judge:
        - by: 'orchestrator-agent'
          context_commands:
            - 'cat /tmp/test-plan-missing-required.yaml'
            - 'uv run sisyphus-speckit plan lint --file /tmp/test-plan-missing-required.yaml'
          instruction: |
            다음을 검증하세요:

            CRITERION 1: acceptance_criteria_for_verification_agent 필드가 없으면 required 에러
            - What: 필드 누락 시 에러 발생
            - Expected: "Missing required field: acceptance_criteria_for_verification_agent"
            - Verify: lint 명령 출력 확인

            CRITERION 2: 3개 이하면 최소 개수 에러
            - What: 3개 체크리스트 작성 시 에러
            - Expected: "must have at least 4 items (actual: 3)"
            - Verify: lint 명령 출력 확인

            CRITERION 3: 4개 이상이면 통과
            - What: 4개 체크리스트 작성 시 에러 없음
            - Expected: lint 성공
            - Verify: exit code 0

            CRITERION 4: 에러 메시지가 명확함
            - What: 사용자가 무엇을 고쳐야 하는지 명확히 알 수 있음
            - Expected: location, expected, actual 모두 표시
            - Verify: 에러 메시지 구조 확인

            ---
            FINAL VERDICT: PASS (모두 통과) / FAIL (하나라도 실패)

    - id: 'final-3'
      title: 'Template 생성 검증'
      category: 'Functionality'
      description: 'sisyphus-speckit plan init가 빡빡한 예제 생성'
      verified: false
      verified_at: null
      verification_evidence: null
      orchestrator_manually_verified: false
      manual_verification_evidence: ''
      bash:
        - execute: 'uv run sisyphus-speckit plan init --path /tmp/new-plan.yaml --template full'
          expected_exit_code: 0
          notes: '템플릿 생성 성공'
      llm_judge:
        - by: 'orchestrator-agent'
          context_commands:
            - 'cat /tmp/new-plan.yaml'
          instruction: |
            생성된 템플릿을 검증하세요:

            CRITERION 1: acceptance_criteria_for_verification_agent 필드 존재
            - What: 필드가 자동 생성됨
            - Verify: YAML에서 필드 확인

            CRITERION 2: 최소 4개 체크리스트 포함
            - What: 각 acceptance criteria가 최소 4개 checklist 포함
            - Verify: checklists 배열 개수 확인

            CRITERION 3: 체크리스트 내용이 "빡빡함"
            - What: 구체적이고 측정 가능한 기준
            - Expected: "TODO" 같은 placeholder 아님, 실제 검증 가능한 기준
            - Verify: content 필드 내용 확인

            CRITERION 4: 다양한 카테고리 커버
            - What: 기능, 성능, 보안, 코드 품질 등 여러 측면
            - Verify: title 필드로 카테고리 확인

            ---
            FINAL VERDICT: PASS/FAIL

