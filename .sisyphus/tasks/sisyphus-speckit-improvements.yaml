  - id: '2'
    title: 파일 컨텍스트 표시 기능 구현
    description: cli.py에 Typer callback 구현 및 파일 경로 표시 추가
    status: completed
    references:
    - inline: "**구현 상세:**\n\nsisyphus_speckit/cli.py에 다음 내용을 추가합니다:\n\n```python\n\
        from pathlib import Path\nfrom rich.console import Console\nfrom sisyphus_core.core.status.manager
        import StatusManager\nfrom sisyphus_core.utils.common import resolve_cwd\n\
        \nconsole = Console()\n\n@app.callback(invoke_without_command=False)\ndef
        display_current_plan(ctx: typer.Context, cwd: str | None = None):\n    \\\"\
        \\\"\\\"Display current plan file before executing commands.\\\"\\\"\\\"\n\
        \    try:\n        working_dir = resolve_cwd(cwd)\n        status_path = working_dir
        / \".sisyphus\" / \"status.json\"\n\n        if not status_path.exists():\n\
        \            return  # No status file, skip display\n\n        # Use synchronous
        file read (StatusManager is async, but we need sync here)\n        import
        json\n        with open(status_path, 'r', encoding='utf-8') as f:\n      \
        \      status_data = json.load(f)\n\n        if status_data.get('current_plan'):\n\
        \            plan_path = status_data['current_plan']['plan_path']\n      \
        \      console.print(f\"[dim]Working on:[/dim] [cyan]{plan_path}[/cyan]\"\
        )\n    except Exception:\n        # Gracefully handle any errors\n       \
        \ pass\n```\n\n**동작 원리:**\n1. Typer가 모든 명령어 실행 전에 callback 호출\n2. .sisyphus/status.json에서
        current_plan.plan_path 읽기\n3. Rich console로 파일 경로 출력\n4. 오류 발생시 graceful하게
        pass (명령어 실행은 계속)\n\n**테스트 방법:**\n```bash\nsisyphus-speckit task current\n\
        # 출력 예: Working on: .sisyphus/tasks/my-plan.yaml\n```\n"
