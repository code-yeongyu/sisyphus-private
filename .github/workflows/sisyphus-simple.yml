name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@sisyphus-dev-ai')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@sisyphus-dev-ai')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@sisyphus-dev-ai')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@sisyphus-dev-ai') || contains(github.event.issue.title, '@sisyphus-dev-ai')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.SISYPHUS_APP_ID }}
          private-key: ${{ secrets.SISYPHUS_APP_PRIVATE_KEY }}
      - name: Setup GitHub CLI authentication
        run: |
          echo "${{ steps.generate-token.outputs.token }}" | gh auth login --with-token
          gh auth status

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          ls -la ~/.local/bin/claude || echo "Claude binary not found!"
          which claude || echo "Claude not in PATH!"

      - name: Ensure Claude Code in PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Verify claude is accessible
          claude --version || echo "Claude command failed!"

      - name: Setup Claude Code configuration
        run: |
          if [ -d ".github/workflows/.claude" ]; then
            # Copy to user config (~/.claude)
            mkdir -p ~/.claude
            cp -r .github/workflows/.claude/* ~/.claude/
            echo "Copied .claude configuration to ~/.claude"
            ls -la ~/.claude
          else
            echo "No .github/workflows/.claude directory found, skipping configuration copy"
          fi


      - name: Setup Sisyphus Claude Code Plugin
        run: |
          claude plugin marketplace add ./
          claude plugin install essentials@sisyphus-marketplace

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.0

      - name: Cache global npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Get Bun Path to use
        id: bun_path
        run: |
          BUN_PATH=$(which bun)
          echo "BUN_PATH=$BUN_PATH" >> $GITHUB_OUTPUT
          echo "Bun executable path: $BUN_PATH"

      - name: Get Claude Code Path to use
        id: claude_code_path
        run: |
          CLAUDE_CODE_PATH=$(which claude)
          echo "CLAUDE_CODE_PATH=$CLAUDE_CODE_PATH" >> $GITHUB_OUTPUT
          echo "Claude Code executable path: $CLAUDE_CODE_PATH"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.13
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          bot_name: "Sisyphus - Claude"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          track_progress: true
          use_sticky_comment: true
          path_to_bun_executable: ${{ steps.bun_path.outputs.BUN_PATH }}
          path_to_claude_code_executable: ${{ steps.claude_code_path.outputs.CLAUDE_CODE_PATH }}

          claude_args: |
            --dangerously-skip-permissions
