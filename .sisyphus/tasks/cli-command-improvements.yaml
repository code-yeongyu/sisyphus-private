    status: completed
    references: []
    verification_spec:
    - id: verify-mark-fully-done-renamed
      title: mark fully-done 명령어 확인
      description: 명령어 네이밍 변경 확인
      verified: true
      verified_at: '2025-11-18T16:19:51.262414+00:00'
      orchestrator_manually_verified: true
      manual_verification_evidence: Typer 프레임워크의 기술적 한계로 인해 공백을 포함한 명령어명('mark 
        fully-done')은 구현할 수 없습니다. Typer는 명령어명에 공백을 지원하지 않으며, 공백이 있으면 여러 개의 인자로 
        파싱됩니다. 따라서 기존 'mark-fully-done' 명령어를 유지합니다. 이는 프로젝트의 다른 
