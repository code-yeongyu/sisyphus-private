# Comprehensive AI TodoList Format v2.0 Draft
# 모든 가능한 기능을 포함한 예제 작업계획서

# ============================================================================
# METADATA - 문서 자체 정보
# ============================================================================
metadata:
  created_at: "2025-10-30T20:21:00.000000+09:00"
  updated_at: "2025-10-30T20:21:00.000000+09:00"
  format_version: "2.0"

# ============================================================================
# USER REQUEST - 요청 기록
# ============================================================================
user_request:
  original: "Python으로 간단한 TODO CLI 도구 만들기"
  timestamp: "2025-10-30T20:00:00.000000+09:00"
  additional:
    - "Typer를 사용해서 CLI 인터페이스 구현"
    - "SQLite로 데이터 저장"
    - "Rich로 예쁜 출력"

# ============================================================================
# OBJECTIVES - 목표
# ============================================================================
objectives:
  core: "Typer, SQLite, Rich를 활용하여 터미널에서 사용 가능한 TODO 관리 CLI 도구를 구현한다."

  detailed:
    - goal: "Typer 기반 CLI 명령어 시스템 구축"
      measurable: "add, list, done, delete 4개 명령어 구현 완료"

    - goal: "SQLite 데이터베이스 연동"
      measurable: "CRUD 연산 테스트 100% 통과"

    - goal: "Rich 라이브러리로 출력 포맷팅"
      measurable: "테이블 형태로 TODO 목록 출력"

# ============================================================================
# BACKGROUND - 배경
# ============================================================================
background:
  current_situation: |
    현재 프로젝트 디렉토리가 비어있는 상태입니다.
    Python 3.12 환경에서 uv 패키지 매니저를 사용 중입니다.

  reason_for_change: |
    터미널 기반 워크플로우를 선호하는 개발자를 위해
    간단하고 빠른 TODO 관리 도구가 필요합니다.
    기존 웹 기반 도구들은 오버헤드가 크고,
    CLI 도구들은 기능이 부족한 경우가 많습니다.

  changes_to_make: |
    **Before**: 빈 프로젝트
    **After**:
    - todo-cli/ 패키지 디렉토리
    - 4개 주요 명령어 (add, list, done, delete)
    - SQLite 데이터베이스 연동
    - Rich 기반 출력

# ============================================================================
# REQUIRED BACKGROUND - 필요한 배경 지식
# ============================================================================
required_background:
  description: |
    **핵심 기술 스택**:
    - Typer: CLI 프레임워크
    - SQLite: 경량 데이터베이스
    - Rich: 터미널 출력 포맷팅

    **아키텍처 제약**:
    - 단일 파일 실행 가능 (standalone)
    - 의존성 최소화
    - 크로스 플랫폼 지원

    **Edge Cases**:
    - 동시 실행 (파일 락)
    - 존재하지 않는 TODO ID
    - 빈 목록 출력

  file_structure: |
    todo-cli/
    ├── __init__.py
    ├── cli.py          # Typer 명령어
    ├── database.py     # SQLite 연동
    └── models.py       # 데이터 모델

    tests/
    └── test_todo.py

  references:
    # File Reference (keywords retrieval)
    - id: "ref_typer_example"
      type: file
      path: "sisyphus/cli.py"
      description: "기존 Typer 사용 패턴"
      retrieval:
        type: keywords
        keywords: ["@app.command", "typer.Option"]
        line_range: [1, 100]
      notes: "명령어 구조 참고"

    # URL Reference (prompt retrieval)
    - id: "ref_typer_docs"
      type: url
      url: "https://typer.tiangolo.com/"
      description: "Typer 공식 문서"
      retrieval:
        type: prompt
        prompt: "Find CLI argument and option examples"
      notes: "CLI 인터페이스 설계 시 참고"

    # Code Snippet Reference
    - id: "ref_sqlite_pattern"
      type: code_snippet
      language: python
      description: "SQLite 연결 패턴"
      code: |
        import sqlite3

        def get_db():
            conn = sqlite3.connect("todo.db")
            conn.row_factory = sqlite3.Row
            return conn

    # Text Reference
    - id: "ref_commit_style"
      type: text
      description: "커밋 메시지 스타일"
      content: |
        Conventional Commits 형식:
        - feat: 새 기능
        - fix: 버그 수정
        - test: 테스트 추가

# ============================================================================
# STATUS - 실행 상태
# ============================================================================
status:
  execution:
    started: false
    completed: false
    started_at: null
    completed_at: null

  work_mode:
    parallel_requested: false
    current_task_id: null

  progress:
    total_tasks: 5
    completed: 0
    in_progress: 0
    pending: 5

  current_work: |
    작업이 아직 시작되지 않음.
    사용자의 명시적 시작 명령을 기다리는 중.

# ============================================================================
# WORKFLOW - 작업 흐름
# ============================================================================
workflow:
  dependency_diagram: |
    Phase 1: 기본 구조
    └─ Task 1: 프로젝트 초기화

    Phase 2: 핵심 기능 (순차)
    ├─ Task 2: 데이터베이스 모델
    └─ Task 3: CLI 명령어

    Phase 3: 마무리 (병렬 가능)
    ├─ Task 4 parallel: 테스트 작성
    └─ Task 5 parallel: 문서화

  critical_path:
    - "Task 1 → Task 2 → Task 3 → (Task 4 || Task 5)"

# ============================================================================
# TODOS - 실행 항목
# ============================================================================
