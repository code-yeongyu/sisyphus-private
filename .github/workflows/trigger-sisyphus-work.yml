name: Trigger Sisyphus Work

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name with existing ai-todolist.md'
        required: true
        type: string
      retry_count:
        description: 'Current retry count (internal use)'
        required: false
        type: number
        default: 0

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  process-work:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.SISYPHUS_APP_ID }}
          private-key: ${{ secrets.SISYPHUS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout specified branch
        run: |
          git fetch origin "${{ inputs.branch_name }}"
          git checkout "${{ inputs.branch_name }}"

      - name: Validate ai-todolist.md exists
        run: |
          if [ ! -f "./ai-todolist.md" ]; then
            echo "Error: ai-todolist.md not found in branch ${{ inputs.branch_name }}"
            exit 1
          fi
          echo "✓ ai-todolist.md found"
          echo "Content preview:"
          head -n 20 ai-todolist.md

      - name: Install Tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.3.0

      - name: Cache global npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-global-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-global-

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # Verify installation
          ls -la ~/.local/bin/claude || echo "Claude binary not found!"
          which claude || echo "Claude not in PATH!"

      - name: Ensure Claude Code in PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          # Verify claude is accessible
          claude --version || echo "Claude command failed!"

      - name: Setup Claude Code configuration
        run: |
          if [ -d ".github/workflows/.claude" ]; then
            # Copy to user config (~/.claude)
            mkdir -p ~/.claude
            cp -r .github/workflows/.claude/* ~/.claude/
            echo "Copied .claude configuration to ~/.claude"
            ls -la ~/.claude
          else
            echo "No .github/workflows/.claude directory found, skipping configuration copy"
          fi

      - name: Setup GitHub CLI authentication
        run: |
          echo "${{ steps.generate-token.outputs.token }}" | gh auth login --with-token
          gh auth status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.0
        with:
          version: "latest"
          enable-cache: true

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Sync project dependencies
        run: |
          uv sync

      - name: Set environments for work
        run: |
          uv run sisyphus reset --include-task-specs

      - name: Setup Sisyphus Claude Code Plugin
        run: |
          claude plugin marketplace add ./
          claude plugin install essentials@sisyphus-marketplace

      - name: Configure git
        run: |
          git config user.name "Sisyphus"
          git config user.email "ai@sisyphus.mengmota.com"

      - name: Run Sisyphus
        id: run_sisyphus
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run sisyphus work --no-tui
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLI_PATH: ${{ env.HOME }}/.local/bin/claude
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        continue-on-error: true

      - name: Check Sisyphus Result and Handle WIP
        id: check_result
        run: |
          SISYPHUS_EXIT_CODE="${{ steps.run_sisyphus.outcome }}"

          if [ "$SISYPHUS_EXIT_CODE" != "success" ]; then
            echo "❌ Sisyphus failed. Creating WIP commit..."

            # Stage all changes including sessions/
            git add .
            git add -f sessions/

            # Create WIP commit if there are changes
            if ! git diff --staged --quiet; then
              git commit -m "wip: save progress after failure (retry ${{ inputs.retry_count }})"
              git push origin "${{ inputs.branch_name }}"
              echo "✅ WIP commit pushed"
            fi

            echo "failed=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Sisyphus succeeded"
            echo "failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Retry if Failed
        if: steps.check_result.outputs.failed == 'true'
        run: |
          RETRY_COUNT=${{ inputs.retry_count }}
          NEXT_RETRY=$((RETRY_COUNT + 1))

          if [ $NEXT_RETRY -lt 5 ]; then
            echo "🔄 Triggering retry $NEXT_RETRY/5..."

            # Trigger workflow retry with incremented counter
            gh workflow run trigger-sisyphus-work.yml \
              -f branch_name="${{ inputs.branch_name }}" \
              -f retry_count=$NEXT_RETRY

            echo "✅ Retry $NEXT_RETRY triggered"
            exit 0
          else
            echo "❌ Max retries (5) reached. Stopping."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Commit and push changes
        if: steps.check_result.outputs.failed == 'false'
        run: |
          # Add all changes
          git add .

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit changes
          git commit -m "feat: complete remaining sisyphus works on ${{ inputs.branch_name }}

          Automated work completion via trigger-sisyphus-work workflow"

          # Push to origin
          git push origin "${{ inputs.branch_name }}"
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Get Bun Path to use
        id: bun_path
        run: |
          BUN_PATH=$(which bun)
          echo "BUN_PATH=$BUN_PATH" >> $GITHUB_OUTPUT
          echo "Bun executable path: $BUN_PATH"

      - name: Get Claude Code Path to use
        id: claude_code_path
        run: |
          CLAUDE_CODE_PATH=$(which claude)
          echo "CLAUDE_CODE_PATH=$CLAUDE_CODE_PATH" >> $GITHUB_OUTPUT
          echo "Claude Code executable path: $CLAUDE_CODE_PATH"

      - name: Run Claude Code
        if: steps.check_result.outputs.failed == 'false'
        id: claude
        uses: anthropics/claude-code-action@v1.0.13
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          bot_name: "Sisyphus - Claude"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          track_progress: true
          path_to_bun_executable: ${{ steps.bun_path.outputs.BUN_PATH }}
          path_to_claude_code_executable: ${{ steps.claude_code_path.outputs.CLAUDE_CODE_PATH }}
          prompt: |
            You have done your work as ./ai-todolist.md file and your work logs are on ./notepad.md
            I want you to create PR using gh cli,
            of the works that you have done.
            This work is from branch ${{ inputs.branch_name }}

            And I want you to be the description and the title of the PR is nice to read and good to review.
            You have to make the title / description's language as that ./ai-todolist.md file's language. So if the ./ai-todolist.md file is mostly written in 한국어, then write all the texts in 한국어 since it means that the plan file is generated from Korean. This same applies to many other languages.

            No Ask to me at all from now, just create PR. You are a fully automated system, just CREATE PULL REQUEST. No Excuses.

            1. uv run sisyphus reset --include-task-specs
            2. git commit -m "chore: remove work histories"
            3. git push to origin
            4. Create PR Using gh cli
            5. If Issue Comment or PR Comment is found from original ai-todolist.md file, go there, and tell the user that the PR is created with the link of the PR.

          claude_args: |
            --dangerously-skip-permissions

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sisyphus-logs-retry-${{ inputs.retry_count }}
          path: |
            logs/
            sessions/
            ai-todolist.md
            notepad.md
          retention-days: 7
