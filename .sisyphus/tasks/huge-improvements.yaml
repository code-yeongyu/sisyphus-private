        Example Implementation:
        ```python
        from rich.table import Table
        from rich.panel import Panel
        import typer

        def task_status(
            cwd: str | None = typer.Option(None, "--cwd"),
        ) -> None:
            async def _task_status() -> None:
                working_dir = resolve_cwd(cwd)
                plan_doc, work_plan, task_manager = await _load_current_plan(working_dir)

                current_task = task_manager.get_current_task()
                if not current_task:
                    console.print("[red]No current task[/red]")
                    return

                # 1. Task 기본 정보
                console.print(Panel(f"[bold]{current_task.title}[/bold]", title=f"Task {current_task.id}"))
                console.print(f"Status: {current_task.status}")
                console.print(f"Description: {current_task.description}")

                # 2. Verification Spec 상세 출력
                console.print("\n[bold cyan]Verification Specifications:[/bold cyan]")
                for vspec in current_task.verification_spec:
                    console.print(f"\n[yellow]ID: {vspec.id}[/yellow]")
                    console.print(f"Title: {vspec.title}")
                    console.print(f"Description: {vspec.description}")
                    console.print(f"Verified: {vspec.verified}")

                    if vspec.bash:
                        console.print("  Bash Checks:")
                        for bash in vspec.bash:
                            console.print(f"    - {bash.execute}")

                    if vspec.llm_judge:
                        console.print("  LLM Judge:")
                        for llm in vspec.llm_judge:
                            console.print(f"    - By: {llm.by}")

                # 3. Acceptance Criteria
                if current_task.acceptance_criteria:
                    console.print("\n[bold cyan]Acceptance Criteria:[/bold cyan]")
                    table = Table()
                    table.add_column("ID")
                    table.add_column("Condition")
                    table.add_column("Verified")
                    for ac in current_task.acceptance_criteria:
                        table.add_row(ac.id, ac.condition, str(ac.verified_at is not None))
                    console.print(table)

                # 4. Continuable 여부
                can_continue = task_manager.can_continue_to_next()
                console.print(f"\n[bold cyan]Continuable:[/bold cyan] {can_continue}")
                if not can_continue:
                    console.print("[yellow]Complete current task verifications to continue[/yellow]")

            _run_async(_task_status())
        ```

