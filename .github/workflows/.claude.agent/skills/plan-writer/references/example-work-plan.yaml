# Example Sisyphus v3.0 Work Plan
# This is a reference example showing the complete YAML structure for work plans

version: "3.0"

metadata:
  created_at: "2025-11-08T00:00:00Z"
  updated_at: "2025-11-08T00:00:00Z"

work_plans:
  - id: example-feature-implementation
    name: "Example Feature Implementation Plan"
    depends_on: []  # List of plan IDs this plan depends on

    # User's original request and context
    user_request:
      original: "Add dark mode toggle to user settings page"
      created_at: "2025-11-08T00:00:00Z"
      additional:
        - "Must persist user preference in localStorage"
        - "Should follow existing theme patterns"

    # Clear objectives - WHAT and WHY
    objectives:
      core: "Implement dark mode toggle with persistent user preference"
      detailed:
        - goal: "Add toggle component to settings UI"
          measurable: "Toggle appears in settings page header, switches theme on click"
        - goal: "Implement theme persistence"
          measurable: "Theme preference survives page reload, localStorage contains 'theme' key"

    # Background context - current state and reason for change
    background:
      current_situation: "Application only supports light mode. Users request dark mode for better readability at night."
      reason_for_change: "User feedback indicates 60% of users prefer dark interfaces. Competitor apps all have dark mode."
      changes_to_make: |
        Current: Single light theme hardcoded in CSS
        Target: Theme system with light/dark modes, user preference storage

    # Required knowledge for executing this plan
    required_background:
      description: "React 18+, TypeScript, Tailwind CSS, localStorage API. Understanding of CSS custom properties and theme switching patterns."
      file_structure: |
        src/
        ├── components/
        │   └── settings/
        │       └── ThemeToggle.tsx    # New component to create
        ├── hooks/
        │   └── useTheme.ts             # Theme hook (may need update)
        ├── styles/
        │   └── themes.css              # Theme variables
        └── utils/
            └── storage.ts              # localStorage utilities

      references:
        - inline: "ThemeProvider pattern: src/contexts/ThemeContext.tsx - search for 'createContext', examine state management"
        - inline: "Existing toggle components: src/components/common/Toggle.tsx - search for 'onChange' handler patterns"
        - uri: "https://tailwindcss.com/docs/dark-mode"

    # Task dependency flow
    workflow:
      dependency_diagram: |
        Task 1 (Theme CSS variables)
           ↓
        Task 2 (Theme toggle component)
           ↓
        Task 3 (localStorage integration)
           ↓
        Task 4 (Testing & verification)

      critical_path:
        - "Task 1 must complete first - establishes CSS foundation"
        - "Task 2-3 can run in parallel if needed"
        - "Task 4 validates entire implementation"

    # Success criteria from multiple perspectives
    success_vision:
      user_perspective:
        - scenario: "User opens settings page"
          experience: "Sees dark mode toggle switch, clicks it, page immediately switches to dark theme"
        - scenario: "User returns after closing browser"
          experience: "Theme preference is remembered, page loads in previously selected theme"

      business_perspective:
        - metric: "User engagement with settings page"
          target: "Increase by 40% after dark mode launch"

      technical_criteria:
        - category: "Functionality"
          criteria: "Theme toggle switches between light and dark modes"
          command: "uv run pytest tests/components/test_theme_toggle.py"
          expected: "All tests pass - toggle state changes, CSS variables update"
        - category: "Persistence"
          criteria: "Theme preference survives page reload"
          command: "uv run playwright test tests/e2e/theme-persistence.spec.ts"
          expected: "E2E test confirms localStorage retention"

    # Final acceptance criteria
    final_verification:
      - id: "final-1"
        title: "Dark mode toggle works correctly"
        category: "Functionality"
        description: "Toggle switches theme, updates CSS variables, persists choice"
        verified: false
        orchestrator_manually_verified: false
        manual_verification_evidence: ""
        bash: []
        llm_judge:
          - by: "orchestrator-agent"
            context_commands:
              - "cat src/components/settings/ThemeToggle.tsx"
              - "grep -A 10 'const toggleTheme' src/hooks/useTheme.ts"
            instruction: |
              Verify the implementation:
              1. Does ThemeToggle component exist and render correctly?
              2. Does clicking toggle call theme switch function?
              3. Are CSS custom properties updated on theme change?
              4. Is localStorage.setItem('theme', ...) called?

      - id: "final-2"
        title: "Tests pass and cover all scenarios"
        category: "Quality"
        description: "Unit and E2E tests verify functionality and persistence"
        verified: false
        orchestrator_manually_verified: false
        manual_verification_evidence: ""
        bash:
          - execute: "uv run pytest tests/components/test_theme_toggle.py -v"
            expected_exit_code: 0
            notes: "All toggle component tests must pass"
        llm_judge: []

    # Detailed task breakdown
    todos:
      - id: "1"
        title: "Add CSS custom properties for dark theme"
        description: |
          Update themes.css to include dark mode color variables.
          Define --bg-primary, --text-primary, --border-color for both themes.
        status: pending

        references:
          - inline: "Existing light theme variables: src/styles/themes.css (search for ':root', examine color definitions)"
          - uri: "https://developer.mozilla.org/en-US/docs/Web/CSS/Using_CSS_custom_properties"

        verification_spec:
          - id: "verify-1-1"
            title: "Dark theme CSS variables defined"
            description: "themes.css contains [data-theme='dark'] with all color variables"
            verified: false
            verified_at: null
            orchestrator_manually_verified: false
            manual_verification_evidence: ""
            bash:
              - execute: "grep -c \"data-theme='dark'\" src/styles/themes.css"
                expected_exit_code: 0
                notes: "Should find dark theme selector"
            llm_judge: []

      - id: "2"
        title: "Create ThemeToggle component"
        description: |
          Build React component with toggle switch UI.
          Use existing Toggle component as base, add theme switching logic.
        status: pending

        references:
          - inline: "Toggle component pattern: src/components/common/Toggle.tsx (search for 'interface ToggleProps', examine onChange pattern)"

        children:
          - id: "2.1"
            title: "Implement component UI"
            status: pending

          - id: "2.2"
            title: "Add click handler for theme switching"
            status: pending

          - id: "2.3"
            title: "Write component tests"
            status: pending

        verification_spec:
          - id: "verify-2-1"
            title: "Component renders and responds to clicks"
            description: "ThemeToggle component exists, renders toggle UI, calls theme function on click"
            verified: false
            verified_at: null
            orchestrator_manually_verified: false
            manual_verification_evidence: ""
            bash: []
            llm_judge:
              - by: "orchestrator-agent"
                context_commands:
                  - "cat src/components/settings/ThemeToggle.tsx"
                instruction: |
                  Verify:
                  1. Component exports ThemeToggle function
                  2. Returns JSX with clickable toggle element
                  3. onClick handler calls setTheme or similar function
                  4. Current theme state is reflected in UI

      - id: "3"
        title: "Integrate localStorage for theme persistence"
        description: |
          Save theme preference to localStorage on change.
          Load saved theme on app initialization.
        status: pending

        references:
          - inline: "localStorage utilities: src/utils/storage.ts (search for 'getItem', 'setItem' wrapper functions)"

        verification_spec:
          - id: "verify-3-1"
            title: "Theme persists across page reloads"
            description: "localStorage contains theme key, value matches current theme"
            verified: false
            verified_at: null
            orchestrator_manually_verified: false
            manual_verification_evidence: ""
            bash:
              - execute: "uv run playwright test tests/e2e/theme-persistence.spec.ts"
                expected_exit_code: 0
                notes: "E2E test: toggle theme → reload page → theme matches"
            llm_judge: []

      - id: "4"
        title: "Write comprehensive tests"
        description: |
          Unit tests for ThemeToggle component.
          Integration tests for theme context.
          E2E test for persistence.
        status: pending

        verification_spec:
          - id: "verify-4-1"
            title: "All tests pass with good coverage"
            description: "Test suite covers toggle functionality, state management, persistence"
            verified: false
            verified_at: null
            orchestrator_manually_verified: false
            manual_verification_evidence: ""
            bash:
              - execute: "uv run pytest tests/ -v --cov=src/components/settings --cov=src/hooks"
                expected_exit_code: 0
                notes: "Coverage should be >90% for theme-related code"
            llm_judge: []

    # Global references available to all tasks
    references:
      - ref_id: "ref_react_docs"
        uri: "https://react.dev/learn/managing-state"

      - ref_id: "ref_tailwind_dark"
        uri: "https://tailwindcss.com/docs/dark-mode"

    # Execution tracking (managed by sisyphus CLI)
    execution:
      started: false
      completed: false
      started_at: null
      completed_at: null

    work_mode:
      parallel_requested: false

    progress:
      total_tasks: 4
      completed: 0
      in_progress: 0
      pending: 4

    current_work: ""
