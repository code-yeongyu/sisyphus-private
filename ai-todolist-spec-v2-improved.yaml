  # Markdown Reference (text + code_snippet 통합)
  - id: "ref_sqlite_pattern"
    type: markdown
    description: "SQLite 연결 패턴"
    content: |
      SQLite 기본 연결 패턴:

      ```python
      import sqlite3

      def get_db():
          conn = sqlite3.connect("todo.db")
          conn.row_factory = sqlite3.Row
          return conn
      ```

      **주의사항**:
      - Connection은 반드시 close() 호출
      - Context manager 사용 권장

