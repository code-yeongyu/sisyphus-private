work_plans:
- id: sisyphus-speckit-improvements
  name: Sisyphus SpecKit 개선 작업
  depends_on: []
  user_request:
    original: "다음 세 가지 작업 수행:\n1. 모든 sisyphus-speckit 명령어 실행시 최상단에 어떤 파일 기준으로 동작하는지
      표시 (중복 코드 없이 모듈러하게 구현, 새 명령어 추가시에도 자동으로 적용되도록)\n2. sisyphus-speckit plan lint에서
      acceptance_criteria와 acceptance_criteria_for_verification_agent가 최소 2개 이상의 항목을
      갖도록 검증 추가\n3. execute phase 종료시마다 (loop.py) 자동으로 plan mark completed 기능 실행 (CLI
      호출이 아닌 core 모듈 직접 호출)"
    created_at: '2025-11-21T02:38:12.489558+00:00'
    additional:
    - 'Expected Outcome: 모든 sisyphus-speckit 명령어 실행시 최상단에 현재 작업 중인 YAML 파일 경로가 자동으로
      표시됨. 새 명령어 추가시에도 데코레이터/미들웨어 방식으로 자동 적용. plan lint 실행시 acceptance_criteria와 acceptance_criteria_for_verification_agent가
      각각 최소 2개 이상의 항목을 갖지 않으면 lint error 발생. execute phase 완료 후 자동으로 plan이 completed
      상태로 전환됨.'
    - 'Forbidden Outcomes: 중복 코드 발생 (각 명령어마다 파일 경로 표시 코드 반복 금지), 기존 명령어 동작 변경 (파일
      경로 표시 기능 추가 시 핵심 동작 변경 금지), CLI 직접 호출 (loop.py에서 subprocess로 sisyphus-speckit
      CLI 호출 금지, core 모듈 직접 호출 필수), 이상한 위치에 코드 존재 (논리적으로 적절한 위치에 코드 배치)'
    - 'Special Concerns: Typer 명령어 구조 변경시 기존 동작 영향 최소화, 과도한 하위 호환 처리 금지 (깔끔한 코드만 작성),
      sisyphus-core 모듈 수정시 sisyphus-cli에도 영향 고려'
  objectives:
    core: sisyphus-speckit의 사용성과 검증 기능 개선을 통한 워크플로우 효율성 향상
    detailed:
    - goal: 파일 컨텍스트 자동 표시
      measurable: 모든 sisyphus-speckit 명령어에서 파일 경로 표시
    - goal: Lint 검증 강화
      measurable: acceptance_criteria 최소 2개 검증 추가
    - goal: 자동 완료 처리
      measurable: execute phase 후 자동 mark completed
  background:
    current_situation: "**현재 상황:**\n- sisyphus-speckit 명령어들(task current, task next,
      plan lint 등)이 어떤 파일을 기준으로 동작하는지 사용자에게 명확하지 않음\n- plan lint는 YAML 구조만 검증하고, acceptance_criteria의
      최소 개수는 검증하지 않음\n- execute phase 완료 후 사용자가 수동으로 `sisyphus-speckit plan mark completed`를
      실행해야 함\n"
    reason_for_change: "**변경 이유:**\n- 파일 경로 표시: 사용자가 현재 어떤 plan을 대상으로 명령어가 실행되는지 즉시
      알 수 있어야 함\n- Lint 검증 강화: acceptance_criteria가 너무 적으면 verification agent가 제대로
      검증할 수 없으므로 최소 기준 필요\n- 자동 완료: 수동으로 완료 처리하는 것은 번거롭고 누락 가능성이 있으므로 자동화 필요\n"
    changes_to_make: "**변경 사항:**\n1. 파일 컨텍스트 표시: Typer 콜백 또는 데코레이터 방식으로 모든 명령어 실행
      전 파일 경로 자동 표시\n2. Lint 검증 추가: PlanLinter.validate_all()에 acceptance_criteria
      최소 2개 검증 로직 추가\n3. 자동 완료 처리: loop.py의 _update_plan_execution_status() 호출 후 mark_completed
      로직 직접 호출\n"
  required_background:
    description: "**Tech Stack:**\n- Python 3.12+\n- Typer 0.15+ (CLI 프레임워크)\n- Rich
      13+ (콘솔 출력)\n- sisyphus-core (공유 로직)\n\n**프로젝트 구조:**\n```\nsisyphus-speckit/\n\
      ├── sisyphus_speckit/\n│   ├── cli.py           # 메인 Typer app\n│   ├── plan/\n\
      │   │   ├── app.py       # plan 하위 명령어\n│   │   ├── lint.py      # plan lint
      구현\n│   │   └── mark_completed.py  # mark completed 구현\n│   └── task/\n│   \
      \    ├── app.py       # task 하위 명령어\n│       ├── current.py   # task current
      구현\n│       └── _helpers.py  # 공통 헬퍼 함수\n\nsisyphus-core/\n├── sisyphus_core/\n\
      │   ├── core/\n│   │   ├── plan_linter.py  # PlanLinter 클래스\n│   │   ├── loop.py\
      \         # ExecutionLoop 클래스\n│   │   └── plans/\n│   │       ├── models.py\
      \   # WorkPlan, Todo 모델\n│   │       └── loader.py   # load_plan, save_plan\n\
      │   └── core/status/\n│       └── manager.py      # StatusManager 클래스\n```\n\
      \n**주요 패턴:**\n- Typer 기반 CLI: app.add_typer(), app.command() 사용\n- anyio 기반
      비동기: anyio.run() 래퍼 사용\n- StatusManager: .sisyphus/status.json에서 현재 plan 경로
      관리\n- PlanLinter: validate_all() 메서드에서 전체 검증 수행\n- ExecutionLoop: _update_plan_execution_status()에서
      plan 상태 업데이트\n"
    references:
    - ref_id: ref-typer-callback
      uri: https://typer.tiangolo.com/tutorial/commands/callback/
    - ref_id: ref-status-manager
      inline: "StatusManager는 .sisyphus/status.json을 관리하며, 현재 활성화된 plan 경로를 추적합니다.\n\
        \n**주요 메서드:**\n- async get() -> StatusFile: 현재 상태 읽기\n- async set_current_plan(plan_path,
        plan_root): plan 설정\n\n**사용 예:**\n```python\nstatus_manager = StatusManager(status_path)\n\
        status = await status_manager.get()\nplan_path = status.current_plan.plan_path\
        \  # 현재 plan 경로\n```\n"
