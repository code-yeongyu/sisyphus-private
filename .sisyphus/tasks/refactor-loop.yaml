            inline: |
              ExecutionLoop 재작성 가이드:

              **__init__ 변경:**
              ```python
              def __init__(
                  self,
                  execute_agent: Agent,
                  verify_agent: Agent,  # Optional 제거 - required
                  ui: UIProtocol,
                  session_store: SessionStore,
                  logger_factory: LoggerFactory,
                  task_validator: TaskValidatorProtocol,
                  working_directory: Path | None = None,
                  status_manager: StatusManager | None = None,
              ) -> None:
                  # DI 인스턴스 생성
                  self.state = LoopState()
                  self.feedback_manager = FeedbackManager()
                  self.phase_orchestrator = PhaseOrchestrator(
                      execute_agent, verify_agent, ui, session_store,
                      logger_factory, self.state
                  )
                  # 기타 의존성
                  self.ui = ui
                  self.task_validator = task_validator
                  self.status_manager = status_manager
                  self._resume_event: anyio.Event | None = None
                  self._current_cancel_scope: anyio.CancelScope | None = None
              ```

              **_run_unified_mode 단순화:**
              ```python
              async def _run_unified_mode(...) -> None:
                  self._resume_event = anyio.Event()
                  self.phase_orchestrator.set_resume_event(self._resume_event)

                  while True:
                      self.state.increment_iteration()

                      # Execute 건너뛰기 판단
                      skip_execute = await self._should_skip_execute()

                      # Execute phase
                      if not skip_execute:
                          try:
                              prompt, extra = self._build_execute_prompt(
                                  execute_prompt, execute_extra
                              )
                              await self.phase_orchestrator.execute_phase(prompt, extra)
                          except* RetryRequiredError as eg:
                              if self._handle_execute_retry_error(eg):
                                  continue

                      # Verify 여부 판단
                      if not await self._should_verify():
                          continue

                      # Verify phase
                      prompt = self.feedback_manager.build_feedback_section_for_verify(
                          verify_prompt
                      )
                      try:
                          feedback, fully_done = await self.phase_orchestrator.verify_phase(
                              prompt, verify_extra
                          )
                      except* RetryRequiredError as eg:
                          if self._handle_verify_retry_error(eg):
                              continue

                      # Plan 업데이트
                      await self._update_plan_execution_status(fully_done)

                      # 종료 조건
                      if fully_done:
                          self.state.reset_consecutive_execute()
                          self.state.reset_sdk_exception()  # 버그 수정
                          await self.ui.show_status("✅ Verify agent confirmed FULLY_DONE. All work verified!")
                          break

                      # Feedback 추가
                      if feedback:
                          self.feedback_manager.add_feedback(feedback)
              ```

              **주요 변경점:**
              1. 중첩 depth 감소 (4-5 → 2-3)
              2. LoopState, FeedbackManager, PhaseOrchestrator로 책임 분리
              3. 헬퍼 메서드 추가:
                 - _should_skip_execute() -> bool
                 - _should_verify() -> bool
                 - _build_execute_prompt() -> tuple[str, str]
                 - _handle_execute_retry_error(eg) -> bool (continue 여부)
                 - _handle_verify_retry_error(eg) -> bool
                 - _update_plan_execution_status(fully_done)
              4. SDK 카운터 리셋 추가 (fully_done=True 시)
              5. verify_agent를 required로 변경
